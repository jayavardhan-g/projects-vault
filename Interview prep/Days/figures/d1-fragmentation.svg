<text x="40" y="556" fill="#1f2430" font-size="13">Block tables:  <tspan fill="#2f6fde" font-weight="700">A → [3, 9]</tspan>   <tspan fill="#e07b28" font-weight="700">B → [1, 4, 10]</tspan>   <tspan fill="#2e9e6b" font-weight="700">C → [6]</tspan>    Free list: [0, 2, 5, 7, 8, 11]</text>
<text x="40" y="578" fill="#5b6170" font-size="12">Any free block fits any request, so there is no external fragmentation: no gap is ever "too small to use". The price is one table lookup per token.</text>
<text x="40" y="616" fill="#5b6170" font-size="12">Paging wins only when lengths vary. With equal lengths, option 2 wastes nothing and paging still wastes part of each last block (your shared_prefix: 0.8% → 2.8%).</text>
