<text x='140' y='176' text-anchor='start' font-size='11' font-weight='600' fill='#cf222e'>GPU busy only in the thin blue slivers: each kernel finishes before Python launches the next.</text>
<text x='140' y='194' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>So step time ≈ number of kernels × launch cost ≈ layers × 0.81 ms, whether 0.5B or 14B.</text>
