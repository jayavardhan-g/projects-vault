<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 450' width='960' height='450' font-family='Inter, Helvetica, Arial, sans-serif'><title>Three ways to run the batch-32 MLP forward pass</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='450' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Three ways to run the batch-32 MLP forward pass</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>mlp_bench.cu:254–299; colours = the 4 streams; W shading = which part of W1 each stream reads</text>

<g opacity='1'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The bytes: X is 32 × N (4.2 MB at N = 32768); W1 is N × N (4.29 GB). Time is about how often W is read.</text>
<text x='40' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>shapes at N = 32768</text><rect x='40' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='40' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='140' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='40' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>W1 + W2 = 8.6 GB;  activations ≈ 4 MB each</text><text x='40' y='360' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>reading both W once at 4.8 TB/s ≥ 1.8 ms</text><text x='40' y='378' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>measured baseline: 44.4 ms → W is re-read many times</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>(a) Baseline: one kernel per layer, grid (128, 32) = 4,096 blocks, default stream, all rows × all of W.</text>
<text x='40' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(a) baseline</text><rect x='40' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='41' y='105.0' width='118' height='28.0' rx='0' fill='#c8e1ff' stroke='none' stroke-width='0'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='40' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='40' y='152' width='200' height='166' fill='#c8e1ff' fill-opacity='0.6'/><text x='140' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='40' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>2 launches / iteration, no host sync</text><text x='40' y='360' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>44.43 ms at N = 32768</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>(b) Batch split: stream s gets rows 8s … 8s+7, but W1 is passed WHOLE: four kernels each sweep all of W.</text>
<text x='40' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(a) baseline</text><rect x='40' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='41' y='105.0' width='118' height='28.0' rx='0' fill='#c8e1ff' stroke='none' stroke-width='0'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='40' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='40' y='152' width='200' height='166' fill='#c8e1ff' fill-opacity='0.6'/><text x='140' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='40' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>44.43 ms</text><text x='370' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(b) batch split, 4 streams</text><rect x='370' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='371' y='105.0' width='118' height='7.0' rx='0' fill='#c8e1ff' stroke='none' stroke-width='0'/><rect x='371' y='112.0' width='118' height='7.0' rx='0' fill='#c7f0d2' stroke='none' stroke-width='0'/><rect x='371' y='119.0' width='118' height='7.0' rx='0' fill='#fff1a8' stroke='none' stroke-width='0'/><rect x='371' y='126.0' width='118' height='7.0' rx='0' fill='#f5c6e9' stroke='none' stroke-width='0'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='370' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='370' y='152' width='200' height='166' fill='#c8e1ff' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#c7f0d2' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#fff1a8' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#f5c6e9' fill-opacity='0.35'/><text x='470' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='370' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>each stream: 8 rows × ALL of W1, W2</text><text x='370' y='360' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>4× launches + 4 cudaStreamSynchronize</text><text x='370' y='378' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>52.28 ms: slower at every width</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>(c) Column split: stream s gets columns 8,192·s … +8,191 of W1 and ALL 32 rows. W is partitioned, not duplicated.</text>
<text x='40' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(a) baseline</text><rect x='40' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='41' y='105.0' width='118' height='28.0' rx='0' fill='#c8e1ff' stroke='none' stroke-width='0'/><text x='100' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='40' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='40' y='152' width='200' height='166' fill='#c8e1ff' fill-opacity='0.6'/><text x='140' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='40' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>44.43 ms</text><text x='370' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(b) batch split</text><rect x='370' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='371' y='105.0' width='118' height='7.0' rx='0' fill='#c8e1ff' stroke='none' stroke-width='0'/><rect x='371' y='112.0' width='118' height='7.0' rx='0' fill='#c7f0d2' stroke='none' stroke-width='0'/><rect x='371' y='119.0' width='118' height='7.0' rx='0' fill='#fff1a8' stroke='none' stroke-width='0'/><rect x='371' y='126.0' width='118' height='7.0' rx='0' fill='#f5c6e9' stroke='none' stroke-width='0'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='370' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='370' y='152' width='200' height='166' fill='#c8e1ff' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#c7f0d2' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#fff1a8' fill-opacity='0.35'/><rect x='370' y='152' width='200' height='166' fill='#f5c6e9' fill-opacity='0.35'/><text x='470' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='370' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>52.28 ms</text><text x='700' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>(c) column split</text><rect x='700' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='760' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='701' y='105.0' width='118' height='28.0' rx='0' fill='#eaeef2' stroke='none' stroke-width='0'/><text x='760' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='700' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='700.0' y='152' width='50.0' height='166' fill='#c8e1ff' fill-opacity='0.75'/><rect x='750.0' y='152' width='50.0' height='166' fill='#c7f0d2' fill-opacity='0.75'/><rect x='800.0' y='152' width='50.0' height='166' fill='#fff1a8' fill-opacity='0.75'/><rect x='850.0' y='152' width='50.0' height='166' fill='#f5c6e9' fill-opacity='0.75'/><text x='800' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='700' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>stream s: W1 + c0, b1 + c0, A1 + c0</text><text x='700' y='360' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>grid (32, 32) = 1,024 blocks per kernel</text><text x='700' y='378' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>25.65 ms: 1.73× at N = 32768 only</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Layer 2 needs ALL of A1, so the column split must sync all 4 streams between the layers (line 289).</text>
<text x='370' y='90' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>layer 1 → barrier → layer 2</text><rect x='370' y='104' width='120' height='30' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>X  32 × N</text><rect x='371' y='105.0' width='118' height='28.0' rx='0' fill='#eaeef2' stroke='none' stroke-width='0'/><text x='430' y='124' text-anchor='middle' font-size='10' font-weight='700' fill='#1f2328'>X  32 × N</text><rect x='370' y='150' width='200' height='170' rx='3' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='370.0' y='152' width='50.0' height='166' fill='#c8e1ff' fill-opacity='0.75'/><rect x='420.0' y='152' width='50.0' height='166' fill='#c7f0d2' fill-opacity='0.75'/><rect x='470.0' y='152' width='50.0' height='166' fill='#fff1a8' fill-opacity='0.75'/><rect x='520.0' y='152' width='50.0' height='166' fill='#f5c6e9' fill-opacity='0.75'/><text x='470' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>W1   N × N</text><text x='370' y='342' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>A1 column j comes from stream j·4/N</text><text x='370' y='360' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>every Y column needs every A1 column</text><text x='370' y='378' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>→ cudaStreamSynchronize × 4, then W2 split</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Measured (3 warm-up + 20 timed, one run): the split only pays where the baseline needs several waves.</text>
<text x='80' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>N</text><text x='220' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>baseline</text><text x='400' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>batch split</text><text x='600' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>column split</text><text x='80' y='140' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>32</text><text x='220' y='140' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.0069 ms</text><text x='400' y='140' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.0278 (4.1× slower)</text><text x='600' y='140' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.0339 (4.9× slower)</text><text x='80' y='170' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1,024</text><text x='220' y='170' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.099</text><text x='400' y='170' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.120</text><text x='600' y='170' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.125</text><text x='80' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>16,384</text><text x='220' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>6.29</text><text x='400' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>6.85</text><text x='600' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>6.19 (1.02×)</text><text x='80' y='230' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>32,768</text><text x='220' y='230' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>44.43</text><text x='400' y='230' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>52.28</text><text x='600' y='230' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>25.65 (1.73×)</text><text x='80' y='290' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>No correctness check in Part 1; the column split is wrong for N ≤ 512 (guard uses full N). The 32K result is unaffected.</text>
</g>
