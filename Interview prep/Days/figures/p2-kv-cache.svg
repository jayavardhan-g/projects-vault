<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <rect x="1" y="1" width="978" height="468" rx="14" fill="#fbfbfd" stroke="#d8dbe3"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1f2430">Why a KV cache: compute K, V once, then just read them</text>
  <text x="30" y="60" fill="#5b6170">Generating token by token. Each square = computing K and V for one token (in every layer).</text>

  <!-- left panel -->
  <text x="40" y="96" font-weight="700" fill="#d64545">Without a cache</text>
  <text x="40" y="116" fill="#5b6170" font-size="13">step t recomputes K, V for all t tokens</text>
  <g font-size="12" fill="#5b6170">
    <text x="40" y="152">step 1</text><text x="40" y="186">step 2</text><text x="40" y="220">step 3</text><text x="40" y="254">step 4</text><text x="40" y="288">step 5</text>
  </g>
  <g fill="#f7d4d4" stroke="#d64545">
    <rect x="96" y="138" width="26" height="22" rx="3"/>
    <rect x="96" y="172" width="26" height="22" rx="3"/><rect x="126" y="172" width="26" height="22" rx="3"/>
    <rect x="96" y="206" width="26" height="22" rx="3"/><rect x="126" y="206" width="26" height="22" rx="3"/><rect x="156" y="206" width="26" height="22" rx="3"/>
    <rect x="96" y="240" width="26" height="22" rx="3"/><rect x="126" y="240" width="26" height="22" rx="3"/><rect x="156" y="240" width="26" height="22" rx="3"/><rect x="186" y="240" width="26" height="22" rx="3"/>
    <rect x="96" y="274" width="26" height="22" rx="3"/><rect x="126" y="274" width="26" height="22" rx="3"/><rect x="156" y="274" width="26" height="22" rx="3"/><rect x="186" y="274" width="26" height="22" rx="3"/><rect x="216" y="274" width="26" height="22" rx="3"/>
  </g>
  <text x="40" y="330" fill="#1f2430">Work: 1+2+3+4+5 = 15 → grows like <tspan font-weight="700">n²/2</tspan></text>
  <text x="40" y="352" fill="#5b6170" font-size="13">for 4k tokens ≈ 8 million K/V computations</text>

  <!-- right panel -->
  <text x="330" y="96" font-weight="700" fill="#2e9e6b">With a cache</text>
  <text x="330" y="116" fill="#5b6170" font-size="13">step t computes only the newest token; the rest are read back</text>
  <g font-size="12" fill="#5b6170">
    <text x="330" y="152">step 1</text><text x="330" y="186">step 2</text><text x="330" y="220">step 3</text><text x="330" y="254">step 4</text><text x="330" y="288">step 5</text>
  </g>
  <g fill="#e4e6ec" stroke="#b5bac6">
    <rect x="416" y="172" width="26" height="22" rx="3"/>
    <rect x="416" y="206" width="26" height="22" rx="3"/><rect x="446" y="206" width="26" height="22" rx="3"/>
    <rect x="416" y="240" width="26" height="22" rx="3"/><rect x="446" y="240" width="26" height="22" rx="3"/><rect x="476" y="240" width="26" height="22" rx="3"/>
    <rect x="416" y="274" width="26" height="22" rx="3"/><rect x="446" y="274" width="26" height="22" rx="3"/><rect x="476" y="274" width="26" height="22" rx="3"/><rect x="506" y="274" width="26" height="22" rx="3"/>
  </g>
  <g fill="#cdeedd" stroke="#2e9e6b" stroke-width="1.5">
    <rect x="416" y="138" width="26" height="22" rx="3"/>
    <rect x="446" y="172" width="26" height="22" rx="3"/>
    <rect x="476" y="206" width="26" height="22" rx="3"/>
    <rect x="506" y="240" width="26" height="22" rx="3"/>
    <rect x="536" y="274" width="26" height="22" rx="3"/>
  </g>
  <g font-size="12">
    <rect x="600" y="140" width="18" height="14" rx="3" fill="#cdeedd" stroke="#2e9e6b"/><text x="626" y="152" fill="#1f2430">computed now</text>
    <rect x="600" y="166" width="18" height="14" rx="3" fill="#e4e6ec" stroke="#b5bac6"/><text x="626" y="178" fill="#1f2430">read from GPU memory</text>
  </g>
  <text x="330" y="330" fill="#1f2430">Work: 1 per step → grows like <tspan font-weight="700">n</tspan>. The price is memory that grows with every token.</text>

  <!-- formula band -->
  <rect x="30" y="374" width="920" height="78" rx="10" fill="#fdf0e4" stroke="#e07b28"/>
  <text x="50" y="400" fill="#1f2430" font-weight="700">KV bytes per token = 2 (K and V) × layers × kv_heads × head_dim × bytes per value</text>
  <text x="50" y="424" fill="#1f2430" font-family="monospace">Llama-3.2-1B: 2 × 16 × 8 × 64 × 2 B = 32,768 B = 32 KiB / token  →  4k tokens = 128 MiB per sequence</text>
  <text x="50" y="444" fill="#5b6170" font-size="13">With 32 KV heads (no GQA) it would be 128 KiB/token. Weights are fixed at 2.5 GB; KV grows with users × length, so KV memory caps the batch.</text>
</svg>
