<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 330' width='880' height='330' font-family='Inter, Helvetica, Arial, sans-serif'><title>token rates</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>10 seconds of speech, as a token sequence</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>bar length on a log scale; attention work grows with the square of the length</text>
<text x='730' y='78' text-anchor='start' font-size='11' font-weight='600' fill='#57606a'>attention vs CV2</text>
<text x='30' y='109' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>EnCodec 6 kbps (75 Hz × 8 books)</text>
<rect x='330' y='92' width='310.0' height='24' rx='4' fill='#ffd8b5' stroke='#d0d7de'/>
<text x='646.0' y='109' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>6,000</text>
<text x='730' y='109' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>576×</text>
<text x='30' y='149' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>WavTokenizer (75 Hz × 1)</text>
<rect x='330' y='132' width='235.9' height='24' rx='4' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='571.9008236001471' y='149' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>750</text>
<text x='730' y='149' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>9×</text>
<text x='30' y='189' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>HuBERT units / CosyVoice 1 S3 (50 Hz)</text>
<rect x='330' y='172' width='221.5' height='24' rx='4' fill='#c7f0d2' stroke='#d0d7de'/>
<text x='557.4524104240684' y='189' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>500</text>
<text x='730' y='189' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>4×</text>
<text x='30' y='229' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>CosyVoice 2 S3 (25 Hz)</text>
<rect x='330' y='212' width='196.8' height='24' rx='4' fill='#f5c6e9' stroke='#d0d7de'/>
<text x='532.7526849574507' y='229' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>250</text>
<text x='730' y='229' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>1×</text>
<text x='30' y='269' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>text (~25 words)</text>
<rect x='330' y='252' width='124.6' height='24' rx='4' fill='#fff1a8' stroke='#d0d7de'/>
<text x='460.5951498935743' y='269' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>33</text>
<text x='730' y='269' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>0.017×</text>
<text x='30' y='300' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Raw audio for the same 10 s: 240,000 samples at 24 kHz. 6,000 / 250 = 24× longer → 24² = 576× the attention.</text></svg>
