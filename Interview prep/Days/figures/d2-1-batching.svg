<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 790 365' width='790' height='365' font-family='Inter, Helvetica, Arial, sans-serif'><title>Static vs continuous batching</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='790' height='365' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='420' y='26' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>Two batch slots, four requests that generate 2, 8, 3 and 5 tokens</text>
<text x='420' y='46' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>each cell = one decode step for one request; pale = slot held but idle (waiting for the batch to end)</text>
