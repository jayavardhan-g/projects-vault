<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 420' width='900' height='420' font-family='Inter, Helvetica, Arial, sans-serif'><title>streams</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Streams overlap only when kernels leave SMs idle</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>each bar is one kernel launched on its own stream; left to right is time</text>
<text x='20' y='72' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>A. Small kernels (each needs 30 SMs)</text>
<rect x='170' y='84' width='63' height='24' rx='4' fill='#c7f0d2' stroke='#ffffff' stroke-width='1'/>
<text x='203.0' y='100' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s0</text>
<rect x='170' y='114' width='63' height='24' rx='4' fill='#c7f0d2' stroke='#ffffff' stroke-width='1'/>
<text x='203.0' y='130' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s1</text>
<rect x='170' y='144' width='63' height='24' rx='4' fill='#c7f0d2' stroke='#ffffff' stroke-width='1'/>
<text x='203.0' y='160' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s2</text>
<rect x='170' y='174' width='63' height='24' rx='4' fill='#c7f0d2' stroke='#ffffff' stroke-width='1'/>
<text x='203.0' y='190' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s3</text>
<text x='20' y='102' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>4 streams:</text>
<text x='20' y='118' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>run side by side</text>
<text x='248' y='140' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>done at t = 1 (vs 4 in one stream)</text>
<text x='20' y='232' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>B. Big kernels (each fills all 132 SMs, ~4 waves)</text>
<rect x='170' y='244' width='162.0' height='24' rx='4' fill='#ffc9c9' stroke='#ffffff' stroke-width='1'/>
<text x='252.5' y='260' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s0</text>
<rect x='341.6' y='274' width='162.0' height='24' rx='4' fill='#ffc9c9' stroke='#ffffff' stroke-width='1'/>
<text x='424.1' y='290' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s1</text>
<rect x='513.2' y='304' width='162.0' height='24' rx='4' fill='#ffc9c9' stroke='#ffffff' stroke-width='1'/>
<text x='595.7' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s2</text>
<rect x='684.8' y='334' width='96.0' height='24' rx='4' fill='#ffc9c9' stroke='#ffffff' stroke-width='1'/>
<text x='734.3' y='350' text-anchor='middle' font-size='10' font-weight='400' fill='#1f2328'>s3 …</text>
<text x='20' y='262' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>4 streams:</text>
<text x='20' y='278' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>still one after another</text>
<text x='302' y='382' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>no idle SMs to share → no overlap; extra launches + host syncs only add time</text>
