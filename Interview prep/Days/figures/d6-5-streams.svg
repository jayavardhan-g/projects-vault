<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.8300;0.9200;1.0000'/><line x1='734.3' y1='70' x2='734.3' y2='360' stroke='#0969da' stroke-width='2'/></g>
