<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 408' width='880' height='408' font-family='Inter, Helvetica, Arial, sans-serif'><title>Speedup curves</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='408' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Expected tokens per iteration and speedup vs draft depth γ</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>E(γ) = (1 − α^(γ+1)) / (1 − α);  speedup = E(γ) / (γ·c + 1);  α = per-position acceptance, c = draft cost / target cost</text>
