<text x='658' y='120' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>naive</text>
<text x='658' y='136' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>AI 0.25, roof 1.2, got 0.50</text>
