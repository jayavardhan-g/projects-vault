<text x='658' y='212' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>block2d R=4</text>
<text x='658' y='228' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>AI 16, roof 67, got 25.7</text>
<text x='640' y='270' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Gap between a dot and the HBM</text>
<text x='640' y='288' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>roof = something else limits it.</text>
<text x='640' y='312' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>For the tiled kernels that is</text>
<text x='640' y='330' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>shared-memory bandwidth</text>
<text x='640' y='348' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>(the dashed ceilings).</text>
<text x='20' y='448' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>AI values are the textbook counts (no cache effects); shared ceilings are estimates from 128 B/clock/SM</text></svg>
