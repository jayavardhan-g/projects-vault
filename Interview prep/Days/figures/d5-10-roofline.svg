<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 460' width='900' height='460' font-family='Inter, Helvetica, Arial, sans-serif'><title>roofline</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='460' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>The roofline: attainable TFLOP/s = min(peak, intensity × bandwidth)</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>H200 FP32: peak 66.9 TFLOP/s, HBM 4.8 TB/s, ridge 66.9 / 4.8 ≈ 14 FLOP/B (log–log axes)</text>
