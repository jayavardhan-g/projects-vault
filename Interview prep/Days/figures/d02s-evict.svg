<text x='640' y='90' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>1. candidates: leaf AND one reference</text><text x='656' y='106' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>only L2: L1, K are in use; M has a child</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0300;0.3000;1.0000'/><rect x='636' y='75' width='320' height='38' fill='#ffffff'/><rect x='632' y='75' width='4' height='36' rx='2' fill='#0969da'/><text x='640' y='90' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>1. candidates: leaf AND one reference</text><text x='656' y='106' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>only L2: L1, K are in use; M has a child</text></g>
<text x='640' y='146' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>2. evict L2 → block to the free list</text><text x='656' y='162' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>LRU order: oldest last_accessed first</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.3000;0.4500;1.0000'/><rect x='636' y='131' width='320' height='38' fill='#ffffff'/><rect x='632' y='131' width='4' height='36' rx='2' fill='#0969da'/><text x='640' y='146' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>2. evict L2 → block to the free list</text><text x='656' y='162' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>LRU order: oldest last_accessed first</text></g>
<text x='640' y='202' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>3. re-scan: M is now a leaf</text><text x='656' y='218' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>only the tree holds it → candidate</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.4500;0.6000;1.0000'/><rect x='636' y='187' width='320' height='38' fill='#ffffff'/><rect x='632' y='187' width='4' height='36' rx='2' fill='#0969da'/><text x='640' y='202' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>3. re-scan: M is now a leaf</text><text x='656' y='218' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>only the tree holds it → candidate</text></g>
<text x='640' y='258' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>4. evict M; 2 freed, done</text><text x='656' y='274' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>S, L1, K never: a running request holds them</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.6000;0.9800;1.0000'/><rect x='636' y='243' width='320' height='38' fill='#ffffff'/><rect x='632' y='243' width='4' height='36' rx='2' fill='#0969da'/><text x='640' y='258' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>4. evict M; 2 freed, done</text><text x='656' y='274' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>S, L1, K never: a running request holds them</text></g>
<text x='40' y='340' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>● grey = the tree's reference, ● blue = a running request's.</text>
<text x='40' y='360' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Never an inner node: its children would stay allocated</text>
<text x='40' y='378' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>but become unreachable from the root.</text>
<text x='20' y='436' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: L2 is evicted first, which exposes M as a new leaf; the re-scan evicts M; S, L1 and K are protected by their extra reference</text></svg>
