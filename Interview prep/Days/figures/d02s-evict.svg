<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 450' width='980' height='450' font-family='Inter, Helvetica, Arial, sans-serif'><title>eviction shapes</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='980' height='450' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Eviction: only LEAVES held by the tree alone, least recently used first, re-scanning after each</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>evict(2): leaf L2 (oldest) goes; its parent M becomes a leaf with only the tree's reference, so it goes next</text>
