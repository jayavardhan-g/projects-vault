<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 330' width='900' height='330' font-family='Inter, Helvetica, Arial, sans-serif'><title>story 1</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Story 1: the follower's commit index must not pass what this message proved</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>follower B's log; the leader sends AppendEntries(prev = 10, entries 11..74, leader_commit = 300)</text>
<rect x='60.0' y='80' width='36.0' height='34' fill='#d6dbe0' stroke='#8c959f'/>
<text x='78.0' y='74' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>1–10</text>
<rect x='96.0' y='80' width='230.40000000000003' height='34' fill='#c7f0d2' stroke='#1a7f37'/>
<text x='211.20000000000002' y='101' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>11–74: verified by this message</text>
<rect x='326.40000000000003' y='80' width='453.59999999999997' height='34' fill='#ffd8b5' stroke='#bf8700'/>
<text x='553.2' y='101' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>75–200: stale entries from an old term (never checked)</text>
<text x='326.40000000000003' y='132' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>74</text>
<text x='780.0' y='132' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>200</text>
<line x1='780.0' y1='150' x2='780.0' y2='180' stroke='#cf222e' stroke-width='2'/><path d='M780.0,180.0 L775.0,170.0 L785.0,170.0 z' fill='#cf222e'/>
<text x='792.0' y='196' text-anchor='end' font-size='12' font-weight='700' fill='#cf222e'>old: min(300, last_log_index = 200) = 200</text>
<text x='792.0' y='214' text-anchor='end' font-size='12' font-weight='400' fill='#cf222e'>commits the stale 75–200: a safety violation</text>
<line x1='326.40000000000003' y1='150' x2='326.40000000000003' y2='180' stroke='#1a7f37' stroke-width='2'/><path d='M326.4,180.0 L321.4,170.0 L331.4,170.0 z' fill='#1a7f37'/>
<text x='326.40000000000003' y='196' text-anchor='middle' font-size='12' font-weight='700' fill='#1a7f37'>new: min(300, last new entry = 74) = 74</text>
<text x='326.40000000000003' y='214' text-anchor='middle' font-size='12' font-weight='400' fill='#1a7f37'>everything ≤ 74 really matches the leader</text>
<text x='20' y='258' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Why the stale tail survives: entries 11..74 all agree with B's log, so nothing was truncated (truncation happens only on</text>
<text x='20' y='278' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>the first term mismatch inside the entries sent). The leader will fix 75..200 in a later message; until then B must not commit them.</text>
<text x='20' y='308' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>Fixed in commit d798369 (raft_node.cpp:862–865); the original is 2a19135:661–663.</text></svg>
