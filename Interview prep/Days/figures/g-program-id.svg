<text x='560' y='110' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>program_id(0) = row</text>
<text x='560' y='135' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>= which sequence</text>
<text x='560' y='175' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>program_id(1) = column</text>
<text x='560' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>= which head</text>
<text x='60' y='250' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>All 6 run at the same time on different cores; the highlight just walks through them.</text></svg>
