<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 280' width='760' height='280' font-family='Inter, Helvetica, Arial, sans-serif'><title>program_id</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='760' height='280' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>tl.program_id(axis): which copy of the kernel am I?</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>grid = (num_seqs, num_heads) = (2, 3) launches 6 programs; each handles one (sequence, head)</text>
