<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='960' height='440' font-family='Inter, Helvetica, Arial, sans-serif'><title>Taking snapshots without stopping the matching thread</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='440' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Taking snapshots without stopping the matching thread</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>move the slow work to a second thread that keeps its own copy of the book</text>

<g opacity='1'><animate attributeName='opacity' dur='27.5s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>First design: every 100,000 commands the MATCHING thread stopped and copied its whole book into a snapshot.</text>
<rect x='30' y='86' width='280' height='74' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='170.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>copying the book…</text><text x='170.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>not matching anything meanwhile</text><text x='30' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>matching thread (the hot path)</text><rect x='30' y='176' width='280' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the LIVE book</text><rect x='420' y='250' width='250' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='545.0' y='279.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>snapshot file on disk</text><line x1='170' y1='228' x2='416' y2='268' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='40' y='336' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>1.6 ms stall at 88,390 resting orders: thousands of commands wait in the ring ✗</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.5s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2000;0.4000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>New design. The matching thread does two things per command: append it to the log, apply it. It never copies.</text>
<rect x='30' y='86' width='280' height='74' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='170.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>log(c), then apply(c)</text><text x='170.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>count = 52,345</text><text x='30' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>matching thread (the hot path)</text><rect x='30' y='176' width='280' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the LIVE book</text><text x='350' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the log (mmap)</text><rect x='350' y='86' width='250' height='74' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>records 0 … 52,344</text><text x='475.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>count published with release</text><line x1='312' y1='122' x2='348' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='602' y1='122' x2='638' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><text x='640' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>follower thread (background)</text><rect x='640' y='86' width='290' height='74' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>idle</text><text x='785.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><rect x='640' y='176' width='290' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the REPLICA book</text><rect x='350' y='250' width='250' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='279.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>snapshot file (as of 40,000)</text><text x='40' y='336' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.5s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.4000;0.6000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The follower reads the log's count with acquire, every 200 µs, and sees the new complete records.</text>
<rect x='30' y='86' width='280' height='74' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>keeps matching</text><text x='170.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><text x='30' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>matching thread (the hot path)</text><rect x='30' y='176' width='280' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the LIVE book</text><text x='350' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the log (mmap)</text><rect x='350' y='86' width='250' height='74' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>records 0 … 52,344</text><text x='475.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><line x1='312' y1='122' x2='348' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='602' y1='122' x2='638' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><text x='640' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>follower thread (background)</text><rect x='640' y='86' width='290' height='74' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='785.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>count = 52,345: new records!</text><text x='785.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>I have replayed up to 52,000</text><rect x='640' y='176' width='290' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the REPLICA book</text><rect x='350' y='250' width='250' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='279.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>snapshot file (as of 40,000)</text><text x='40' y='336' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.5s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6000;0.8000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>It replays them into its OWN book, with the same apply code. Same commands, same order → the same book.</text>
<rect x='30' y='86' width='280' height='74' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>keeps matching</text><text x='170.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><text x='30' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>matching thread (the hot path)</text><rect x='30' y='176' width='280' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the LIVE book</text><text x='350' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the log (mmap)</text><rect x='350' y='86' width='250' height='74' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>records 0 … 52,344</text><text x='475.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><line x1='312' y1='122' x2='348' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='602' y1='122' x2='638' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><text x='640' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>follower thread (background)</text><rect x='640' y='86' width='290' height='74' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>replaying 52,000 … 52,344</text><text x='785.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>ex.apply(record)</text><rect x='640' y='176' width='290' height='50' rx='4' fill='#ffd8d3' stroke='#cf222e' stroke-width='2.4'/><text x='785.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the REPLICA book</text><rect x='350' y='250' width='250' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='279.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>snapshot file (as of 40,000)</text><text x='40' y='336' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>the replica equals the live book, a moment behind</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.5s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The follower writes the snapshot from the REPLICA. Matching is never paused: about 1.02× cost in throughput.</text>
<rect x='30' y='86' width='280' height='74' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>keeps matching</text><text x='170.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>never copies, never waits</text><text x='30' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>matching thread (the hot path)</text><rect x='30' y='176' width='280' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='170.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the LIVE book</text><text x='350' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the log (mmap)</text><rect x='350' y='86' width='250' height='74' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>records 0 … 52,344</text><text x='475.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'></text><line x1='312' y1='122' x2='348' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='602' y1='122' x2='638' y2='122' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><text x='640' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>follower thread (background)</text><rect x='640' y='86' width='290' height='74' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='121.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>snapshotting my replica</text><text x='785.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>tmp file → fsync → rename</text><rect x='640' y='176' width='290' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='205.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the REPLICA book</text><rect x='350' y='250' width='250' height='50' rx='4' fill='#eaeef2' stroke='#cf222e' stroke-width='2.4'/><text x='475.0' y='279.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>snapshot file (as of 52,345)</text><line x1='700' y1='228' x2='604' y2='268' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='40' y='336' text-anchor='start' font-size='13' font-weight='700' fill='#1a7f37'>then it frees the log segments the snapshot covers ✓</text>
</g>
</svg>