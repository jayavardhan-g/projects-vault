<rect x='272.0' y='84' width='94.99999999999999' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='319.5' y='105' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 2: A</text>
<rect x='398.5' y='84' width='94.99999999999999' height='32' rx='5' fill='#c7f0d2' stroke='#d0d7de'/>
<text x='445.99999999999994' y='105' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 3: A+B</text>
<rect x='508.5' y='84' width='94.99999999999999' height='32' rx='5' fill='#c7f0d2' stroke='#d0d7de'/>
<text x='556.0' y='105' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 4: A+B</text>
<rect x='162' y='124' width='441.5' height='32' rx='5' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='382.75' y='145' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>awaiting its future / stream queue (tokens arrive after each step)</text>
<line x1='259.0' y1='80' x2='259.0' y2='200' stroke='#bf8700' stroke-dasharray='3 3'/>
<line x1='369.0' y1='80' x2='369.0' y2='200' stroke='#bf8700' stroke-dasharray='3 3'/>
<line x1='495.5' y1='80' x2='495.5' y2='200' stroke='#bf8700' stroke-dasharray='3 3'/>
<line x1='605.5' y1='80' x2='605.5' y2='200' stroke='#bf8700' stroke-dasharray='3 3'/>
<text x='259.0' y='214' text-anchor='middle' font-size='10' font-weight='600' fill='#bf8700'>sleep(0)</text>
<text x='369.0' y='214' text-anchor='middle' font-size='10' font-weight='600' fill='#bf8700'>sleep(0)</text>
<text x='495.5' y='214' text-anchor='middle' font-size='10' font-weight='600' fill='#bf8700'>sleep(0)</text>
<text x='605.5' y='214' text-anchor='middle' font-size='10' font-weight='600' fill='#bf8700'>sleep(0)</text>
<rect x='371.0' y='164' width='29.00000000000003' height='32' rx='5' fill='#f5c6e9' stroke='#d0d7de'/>
<text x='385.5' y='185' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>submit</text>
<rect x='404.0' y='164' width='199.49999999999997' height='32' rx='5' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='503.75' y='185' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>awaiting</text>
<circle cx='314.0' cy='180' r='5' fill='#cf222e'/>
<text x='305.0' y='184' text-anchor='end' font-size='10' font-weight='600' fill='#cf222e'>B arrives</text>
<text x='666.0' y='104' text-anchor='start' font-size='11' font-weight='600' fill='#1a7f37'>A and B share steps</text>
<text x='20' y='250' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>WITHOUT it</text>
<text x='148' y='280' text-anchor='end' font-size='12' font-weight='600' fill='#1f2328'>engine loop</text>
<line x1='160' y1='294' x2='820' y2='294' stroke='#eaeef2'/>
<text x='148' y='320' text-anchor='end' font-size='12' font-weight='600' fill='#1f2328'>handler B</text>
