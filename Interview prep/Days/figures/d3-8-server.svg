<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 420' width='880' height='420' font-family='Inter, Helvetica, Arial, sans-serif'><title>Event loop timeline</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>One event loop, three coroutines: why await asyncio.sleep(0) gives continuous batching over HTTP</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>time runs left to right; only one coroutine runs at a time; a coroutine gives up the loop only at an await</text>
<text x='20' y='76' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>WITH sleep(0)</text>
<text x='148' y='106' text-anchor='end' font-size='12' font-weight='600' fill='#1f2328'>engine loop</text>
<line x1='160' y1='120' x2='820' y2='120' stroke='#eaeef2'/>
<text x='148' y='146' text-anchor='end' font-size='12' font-weight='600' fill='#1f2328'>handler A</text>
<line x1='160' y1='160' x2='820' y2='160' stroke='#eaeef2'/>
<text x='148' y='186' text-anchor='end' font-size='12' font-weight='600' fill='#1f2328'>handler B</text>
<line x1='160' y1='200' x2='820' y2='200' stroke='#eaeef2'/>
<rect x='162' y='84' width='95.0' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
