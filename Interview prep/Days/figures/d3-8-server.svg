<rect x='162.0' y='258' width='95.0' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='209.5' y='279' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 1: A</text>
<rect x='266.5' y='258' width='95.00000000000001' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='314.0' y='279' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 2: A</text>
<rect x='371.0' y='258' width='94.99999999999999' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='418.49999999999994' y='279' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 3: A</text>
<rect x='475.49999999999994' y='258' width='94.99999999999999' height='32' rx='5' fill='#c8e1ff' stroke='#d0d7de'/>
<text x='523.0' y='279' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 4: A</text>
<rect x='635.0' y='258' width='95.00000000000004' height='32' rx='5' fill='#c7f0d2' stroke='#d0d7de'/>
<text x='682.5' y='279' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>step 5: B</text>
<rect x='316.0' y='298' width='260.0' height='32' rx='5' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='445.99999999999994' y='319' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>can't run yet</text>
<rect x='580.0' y='298' width='45.50000000000002' height='32' rx='5' fill='#f5c6e9' stroke='#d0d7de'/>
<text x='602.75' y='319' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>submit</text>
<circle cx='314.0' cy='314' r='5' fill='#cf222e'/>
<text x='314.0' y='346' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>B arrived during step 2 but can't run: the loop never awaits while there is work</text>
<text x='20' y='386' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>The mutation test 'drop the per-iteration await' turned the server back into one-request-at-a-time (README, Phase 6.5).</text>
<text x='20' y='406' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>No locks are needed: add_request can only run between steps, which is exactly where the scheduler says it is safe.</text></svg>
