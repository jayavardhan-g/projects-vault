<circle cx='683.2' cy='230.0' r='9' fill='#c7f0d2' stroke='#cf222e' stroke-width='1'/>
<text x='695.2' y='222.0' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>40: 0.866</text>
<circle cx='578.4' cy='142.1' r='7' fill='#c7f0d2' stroke='#1f2328' stroke-width='1'/>
<text x='590.4' y='134.1' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>12: 0.342</text>
<circle cx='638.6' cy='176.8' r='9' fill='#c7f0d2' stroke='#cf222e' stroke-width='1'/>
<text x='650.6' y='168.8' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>77: 0.643</text>
<circle cx='410.0' cy='156.8' r='7' fill='#eaeef2' stroke='#1f2328' stroke-width='1'/>
<text x='398.0' y='148.8' text-anchor='end' font-size='11' font-weight='400' fill='#8c959f'>81: -0.500</text>
<text x='70' y='362' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>top 2 = {5, 9} → both fail the filter → 0 results</text>
<text x='510' y='362' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>only 12, 40, 77 are scored → 40 (0.866), 77 (0.643)</text>
<text x='20' y='388' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>green = allowed by SQL; red ring = the top 2 each method returns</text></svg>
