<line x1='510' y1='330' x2='660.0' y2='330.0' stroke='#bf8700' stroke-width='3' marker-end='url(#m-amber)'/><text x='674.0' y='334.0' text-anchor='start' font-size='12' font-weight='600' fill='#bf8700'>query (0°)</text>
<circle cx='709.2' cy='312.6' r='7' fill='#eaeef2' stroke='#1f2328' stroke-width='1'/>
<text x='721.2' y='304.6' text-anchor='start' font-size='11' font-weight='400' fill='#8c959f'>5: 0.996</text>
<circle cx='703.2' cy='278.2' r='7' fill='#eaeef2' stroke='#1f2328' stroke-width='1'/>
