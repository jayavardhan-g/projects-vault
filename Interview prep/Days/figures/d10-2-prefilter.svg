<line x1='70' y1='330' x2='220.0' y2='330.0' stroke='#bf8700' stroke-width='3' marker-end='url(#m-amber)'/><text x='234.0' y='334.0' text-anchor='start' font-size='12' font-weight='600' fill='#bf8700'>query (0°)</text>
<circle cx='269.2' cy='312.6' r='9' fill='#eaeef2' stroke='#cf222e' stroke-width='1'/>
<text x='281.2' y='304.6' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>5: 0.996</text>
<circle cx='263.2' cy='278.2' r='9' fill='#eaeef2' stroke='#cf222e' stroke-width='1'/>
<text x='275.2' y='270.2' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>9: 0.966</text>
<circle cx='243.2' cy='230.0' r='7' fill='#c7f0d2' stroke='#1f2328' stroke-width='1'/>
<text x='255.2' y='222.0' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>40: 0.866</text>
<circle cx='138.4' cy='142.1' r='7' fill='#c7f0d2' stroke='#1f2328' stroke-width='1'/>
<text x='150.4' y='134.1' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>12: 0.342</text>
<circle cx='198.6' cy='176.8' r='7' fill='#c7f0d2' stroke='#1f2328' stroke-width='1'/>
<text x='210.6' y='168.8' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>77: 0.643</text>
<circle cx='-30.0' cy='156.8' r='7' fill='#eaeef2' stroke='#1f2328' stroke-width='1'/>
