<text x='46' y='334' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Count global loads: naive reads 2 × 4 = 8 floats per output → 16 outputs × 8 = 128 loads.</text>
<text x='46' y='356' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Tiled: each loaded float is used by TILE = 2 threads → 128 / 2 = 64 loads. In general 2N per output → 2N / TILE.</text>
