<text x='40' y='422' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Inputs 1 + 5 + 15 + 2 + 1 + 25 = 49; targets also 49. Scored: s1–s40, one fill token and eos = 42.</text>
<text x='40' y='442' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>The fill token teaches the model to ask for the next 5 text tokens; at the last text chunk it emits eos.</text>
<text x='20' y='476' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: each blue input position is graded on the red target below it</text></svg>
