<text x='400' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>bottom-right = 2 edits (S = 1, D = 1, I = 0)</text>
<text x='400' y='222' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>WER = (S + D + I) / N = 2 / 4 = 0.50</text>
<text x='400' y='262' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Insertions have no cap: ref of 4 words,</text><text x='400' y='280' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>hyp with 1 substitution + 6 extra words</text><text x='400' y='298' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>→ (1 + 0 + 6) / 4 = 1.75</text>
<text x='20' y='448' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the yellow cheapest path, one step at a time (diagonal = keep or substitute, down = delete)</text></svg>
