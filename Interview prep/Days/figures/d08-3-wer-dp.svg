<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 462' width='880' height='462' font-family='Inter, Helvetica, Arial, sans-serif'><title>WER DP</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='462' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>WER by dynamic programming: ref “the cat sat down”, hyp “the bat sat”</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>each cell = min(up + 1 deletion, left + 1 insertion, diagonal + 0 if words match else 1 substitution)</text>
<text x='20' y='72' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>D[i][j] = fewest edits that turn the first i reference words into the first j hypothesis words</text>
