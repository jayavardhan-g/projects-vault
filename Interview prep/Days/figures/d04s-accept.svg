<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.4000;0.6200;1.0000'/><rect x='36' y='441' width='330' height='38' fill='#ffffff'/><rect x='32' y='441' width='4' height='36' rx='2' fill='#0969da'/><text x='40' y='456' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>3. row 2: x3 ≠ c → reject</text><text x='56' y='472' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>return (2, c): c replaces x3; x4 is thrown away</text></g>
<text x='520' y='400' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Always n_accepted + 1 tokens come out: 1 to γ + 1 = 5.</text>
<text x='520' y='420' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>All 4 accepted → next_token comes from row 4 (bonus).</text>
<text x='520' y='440' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Sampling instead of greedy: accept x with probability</text>
<text x='520' y='458' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>min(1, p_i[x] / q_i[x]); on reject, sample the residual.</text>
<text x='20' y='488' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: each proposal is compared with its row; the first mismatch stops the walk; kept proposals and the correction form the output</text></svg>
