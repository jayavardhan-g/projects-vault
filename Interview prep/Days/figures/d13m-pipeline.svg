<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='960' height='330' font-family='Inter, Helvetica, Arial, sans-serif'><title>One command through the exchange</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='330' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>One command through the exchange</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the same 40 bytes are copied three times before the book changes</text>
<rect x='30' y='90' width='140' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='100.0' y='123.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer thread</text><text x='100.0' y='138.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>core A</text><rect x='220' y='90' width='140' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='290.0' y='123.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>SPSC ring</text><text x='290.0' y='138.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>65,536 slots × 40 B</text><rect x='410' y='90' width='140' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='123.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>matching thread</text><text x='480.0' y='138.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>core B</text><rect x='600' y='90' width='140' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='670.0' y='123.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>WAL (mmap file)</text><text x='670.0' y='138.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>records_[n], 40 B each</text><rect x='790' y='90' width='140' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='860.0' y='123.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>order book</text><text x='860.0' y='138.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>levels, id table, pool</text><line x1='170' y1='125' x2='220' y2='125' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='360' y1='125' x2='410' y2='125' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='550' y1='125' x2='600' y2='125' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><line x1='740' y1='125' x2='790' y2='125' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/>
<g opacity='1'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The producer builds a Command: New, Buy, Limit, id 9, price 102, qty 70, tsc.</text>
<rect x='45' y='185' width='110' height='34' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='100.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>Command 40 B</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>push: the 40 bytes are copied into slots_[head &amp; mask]; then head is release-stored.</text>
<rect x='235' y='185' width='110' height='34' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='290.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>Command 40 B</text><text x='290' y='240' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>copy 1</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>pop: the matching thread acquire-loads head, copies the slot out, release-stores tail.</text>
<rect x='425' y='185' width='110' height='34' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='480.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>Command 40 B</text><text x='480' y='240' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>copy 2</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Log first: append copies the same 40 bytes into the mmap, then release-stores count + 1.</text>
<rect x='615' y='185' width='110' height='34' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='670.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>Command 40 B</text><text x='670' y='240' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>copy 3</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Only then apply: submit(id 9, Buy, 102, 70) matches against the asks and rests the remainder.</text>
<rect x='805' y='185' width='110' height='34' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='860.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>id, side, price, qty</text><text x='860' y='240' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>fields passed</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='21.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Latency = rdtsc() − c.tsc goes into the histogram. The follower thread replays the log on its replica.</text>
<rect x='415' y='185' width='130' height='34' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2'/><text x='480.0' y='205.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>rdtsc() − c.tsc</text>
</g>
</svg>