<text x='480' y='125' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1/√1 = 1   1/√4 = 0.5</text>
<text x='480' y='150' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1/√9 = 0.33   1/√16 = 0.25</text>
