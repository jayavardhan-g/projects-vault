<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 450' width='960' height='450' font-family='Inter, Helvetica, Arial, sans-serif'><title>Welch's t-test on your MNIST-C numbers</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='450' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Welch's t-test on your MNIST-C numbers</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>means and standard deviations from fml_report.pdf Table 2; every p-value recomputed with scipy</text>
<line x1='120' y1='300' x2='840' y2='300' stroke='#1f2328' stroke-width='1.2'/><line x1='120.0' y1='296' x2='120.0' y2='304' stroke='#1f2328' stroke-width='1'/><text x='120.0' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>64</text><line x1='222.85714285714286' y1='296' x2='222.85714285714286' y2='304' stroke='#1f2328' stroke-width='1'/><text x='222.85714285714286' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>66</text><line x1='325.7142857142857' y1='296' x2='325.7142857142857' y2='304' stroke='#1f2328' stroke-width='1'/><text x='325.7142857142857' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>68</text><line x1='428.57142857142856' y1='296' x2='428.57142857142856' y2='304' stroke='#1f2328' stroke-width='1'/><text x='428.57142857142856' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>70</text><line x1='531.4285714285714' y1='296' x2='531.4285714285714' y2='304' stroke='#1f2328' stroke-width='1'/><text x='531.4285714285714' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>72</text><line x1='634.2857142857143' y1='296' x2='634.2857142857143' y2='304' stroke='#1f2328' stroke-width='1'/><text x='634.2857142857143' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>74</text><line x1='737.1428571428571' y1='296' x2='737.1428571428571' y2='304' stroke='#1f2328' stroke-width='1'/><text x='737.1428571428571' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>76</text><line x1='840.0' y1='296' x2='840.0' y2='304' stroke='#1f2328' stroke-width='1'/><text x='840.0' y='320' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>78</text><text x='120' y='340' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>MNIST-C mean accuracy (%), 5 seeds each: dot = mean, bar = ± 1 standard deviation</text>
<g opacity='1'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1111;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Question: does pruning change corruption accuracy, or is the gap just seed noise? 5 training seeds per model.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><line x1='295.88571428571436' y1='220' x2='543.7714285714283' y2='220' stroke='#cf222e' stroke-width='3'/><line x1='295.88571428571436' y1='213' x2='295.88571428571436' y2='227' stroke='#cf222e' stroke-width='2'/><line x1='543.7714285714283' y1='213' x2='543.7714285714283' y2='227' stroke='#cf222e' stroke-width='2'/><circle cx='419.8285714285713' cy='220' r='6' fill='#cf222e'/><text x='553.7714285714283' y='224' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>layer-wise 3.75%: 69.83 ± 2.41</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1111;0.2222;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Global vs dense. Difference of means = 73.59 − 73.72 = −0.13 points. Is that bigger than the noise?</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>difference d = −0.13</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2222;0.3333;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Noise of a mean of 5 numbers = s² / n. Dense: 0.92² / 5 = 0.169. Global: 0.98² / 5 = 0.192.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>var of each mean: 0.169 and 0.192</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.4444;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Standard error of the difference = √(0.169 + 0.192) = 0.601. Welch does NOT assume the two spreads are equal.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>SE = 0.601</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.4444;0.5556;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>t = d / SE = −0.13 / 0.601 = −0.22. The difference is a fifth of its own noise.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>t = −0.22</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5556;0.6667;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Degrees of freedom (Welch–Satterthwaite) = (0.169 + 0.192)² / (0.169²/4 + 0.192²/4) = 7.97.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>df = 7.97</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.7778;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>7/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>p = chance of |t| ≥ 0.22 if there were truly no difference = 0.83. "No evidence of a difference", NOT "proved equal".</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='562.8' y1='170' x2='663.6000000000004' y2='170' stroke='#1a7f37' stroke-width='3'/><line x1='562.8' y1='163' x2='562.8' y2='177' stroke='#1a7f37' stroke-width='2'/><line x1='663.6000000000004' y1='163' x2='663.6000000000004' y2='177' stroke='#1a7f37' stroke-width='2'/><circle cx='613.2000000000003' cy='170' r='6' fill='#1a7f37'/><text x='673.6000000000004' y='174' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>global 3.52%: 73.59 ± 0.98</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>p = 0.83  (the report's number, recomputed from its own table)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.7778;0.8889;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>8/9</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Layer-wise vs dense: d = −3.89, SE = √(2.41²/5 + 0.92²/5) = 1.15, t = −3.37, df = 5.1 → p = 0.019. A real drop.</text>
<line x1='572.5714285714284' y1='120' x2='667.2' y2='120' stroke='#0969da' stroke-width='3'/><line x1='572.5714285714284' y1='113' x2='572.5714285714284' y2='127' stroke='#0969da' stroke-width='2'/><line x1='667.2' y1='113' x2='667.2' y2='127' stroke='#0969da' stroke-width='2'/><circle cx='619.8857142857142' cy='120' r='6' fill='#0969da'/><text x='677.2' y='124' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>dense: 73.72 ± 0.92</text><line x1='295.88571428571436' y1='220' x2='543.7714285714283' y2='220' stroke='#cf222e' stroke-width='3'/><line x1='295.88571428571436' y1='213' x2='295.88571428571436' y2='227' stroke='#cf222e' stroke-width='2'/><line x1='543.7714285714283' y1='213' x2='543.7714285714283' y2='227' stroke='#cf222e' stroke-width='2'/><circle cx='419.8285714285713' cy='220' r='6' fill='#cf222e'/><text x='553.7714285714283' y='224' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>layer-wise 3.75%: 69.83 ± 2.41</text><rect x='40' y='360' width='880' height='34' rx='4' fill='#f6f8fa' stroke='#57606a' stroke-width='1'/><text x='480.0' y='381.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>p = 0.019</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='41.4s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8889;1'/>
<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
