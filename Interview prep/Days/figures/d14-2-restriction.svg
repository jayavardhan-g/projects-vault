<rect x='424' y='84' width='446' height='108' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='440' y='106' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>S4 (last t3/6) asks for votes in term 4:</text>
<text x='440' y='128' text-anchor='start' font-size='12' font-weight='400' fill='#cf222e'>S2, S3: my last is t3/7, longer → refuse</text>
<text x='440' y='150' text-anchor='start' font-size='12' font-weight='400' fill='#1a7f37'>S5: last t2/4 is behind S4 → grant</text>
<text x='440' y='172' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>S4 gets 2 votes (itself + S5) &lt; 3: cannot win</text>
<rect x='424' y='204' width='446' height='86' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='440' y='226' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>S2 (last t3/7) asks:</text>
<text x='440' y='248' text-anchor='start' font-size='12' font-weight='400' fill='#1a7f37'>S3 equal → grant; S4, S5 behind → grant</text>
<text x='440' y='270' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>S2 wins with 4 votes and already has entry 7</text>
<text x='20' y='300' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Why it always works: the votes a winner needs (3) and the copies of a committed entry (3) are both majorities.</text>
<text x='20' y='320' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Two majorities of 5 always share at least one node (3 + 3 &gt; 5), and that node refuses anyone missing the entry.</text>
<text x='20' y='345' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>Rule (raft_node.cpp:747): grant if cand_last_term &gt; mine, or same term and cand_last_index ≥ mine.</text></svg>
