<rect x='692.6923076923077' y='180' width='130' height='30' rx='5' fill='#ffd8b5' stroke='#cf222e' stroke-width='1.3'/><text x='757.6923076923077' y='199.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>≈751 ms: LEADER t3</text>
<text x='757.6923076923077' y='225' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>2 of 3 votes = majority</text>
<line x1='110' y1='88' x2='110' y2='332' stroke='#cf222e' stroke-width='2'><animate attributeName='x1' dur='9.0s' repeatCount='indefinite' values='110;860;860' keyTimes='0;0.92;1'/><animate attributeName='x2' dur='9.0s' repeatCount='indefinite' values='110;860;860' keyTimes='0;0.92;1'/></line>
<text x='20' y='388' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the red line is the clock. Boxes are labels: on loopback the vote round trip takes ~1 ms, so n2 leads at ≈751 ms.</text></svg>
