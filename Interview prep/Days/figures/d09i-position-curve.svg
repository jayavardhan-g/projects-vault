<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Correct tool in the first 5 places: mean score 0.00061.</text>
<polyline points='120.0,97.23076923076923' fill='none' stroke='#0969da' stroke-width='3'/><circle cx='120.0' cy='97.23076923076923' r='5' fill='#0969da' stroke='white' stroke-width='1.5'/><text x='120.0' y='85.23076923076923' text-anchor='middle' font-size='11' font-weight='700' fill='#cf222e'>0.00061</text>
</g>
