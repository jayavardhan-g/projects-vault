<rect x='20' y='404' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='424' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='424' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>run2.py: for every test query, score the correct tool with ALL heads averaged, and note where the shuffle put it (0–99).</text>

</g>
