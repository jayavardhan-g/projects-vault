<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Your measurement: attention to the correct tool vs its position</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>values read off the report's plot (p. 4), all-heads baseline, 5,000 test queries; the plot itself is in the note</text>
<line x1='100' y1='360' x2='900' y2='360' stroke='#1f2328' stroke-width='1.2'/><line x1='100' y1='360' x2='100' y2='80' stroke='#1f2328' stroke-width='1.2'/><text x='500.0' y='398' text-anchor='middle' font-size='12' font-weight='600' fill='#57606a'>position of the correct tool among the 100 (bins of 5)</text><text x='100' y='66' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>mean attention, query → correct tool (all 512 heads)</text><text x='100.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>0</text><text x='260.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>20</text><text x='420.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>40</text><text x='580.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>60</text><text x='740.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>80</text><text x='900.0' y='378' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>100</text><text x='92' y='320.9230769230769' text-anchor='end' font-size='11' font-weight='400' fill='#57606a'>0.0001</text><line x1='100' y1='316.9230769230769' x2='900' y2='316.9230769230769' stroke='#eaeef2' stroke-width='1'/><text x='92' y='234.76923076923077' text-anchor='end' font-size='11' font-weight='400' fill='#57606a'>0.0003</text><line x1='100' y1='230.76923076923077' x2='900' y2='230.76923076923077' stroke='#eaeef2' stroke-width='1'/><text x='92' y='148.61538461538458' text-anchor='end' font-size='11' font-weight='400' fill='#57606a'>0.0005</text><line x1='100' y1='144.61538461538458' x2='900' y2='144.61538461538458' stroke='#eaeef2' stroke-width='1'/>
