<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 462' width='900' height='462' font-family='Inter, Helvetica, Arial, sans-serif'><title>memory ordering</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='462' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Release / acquire: the slot write happens-before the slot read</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>producer on core A, consumer on core B; numbers are program order</text>
<text x='190' y='80' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>producer: push(cmd)</text>
<rect x='40' y='92' width='300' height='48' rx='8' fill='#ffffff' stroke='#0969da' stroke-width='1.5'/><text x='190.0' y='110.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>1. slots_[0] = cmd</text><text x='190.0' y='129.0' text-anchor='middle' font-size='11' fill='#57606a'>40 bytes, plain (non-atomic) writes</text>
<rect x='40' y='154' width='300' height='48' rx='8' fill='#c8e1ff' stroke='#0969da' stroke-width='1.5'/><text x='190.0' y='172.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>2. head_.store(1, release)</text><text x='190.0' y='191.0' text-anchor='middle' font-size='11' fill='#57606a'>publishes everything written before it</text>
<text x='690' y='80' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>consumer: pop(out)</text>
<rect x='540' y='92' width='300' height='48' rx='8' fill='#c7f0d2' stroke='#1a7f37' stroke-width='1.5'/><text x='690.0' y='110.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>3. head_.load(acquire) → 1</text><text x='690.0' y='129.0' text-anchor='middle' font-size='11' fill='#57606a'>sees the new head ...</text>
<rect x='540' y='154' width='300' height='48' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.5'/><text x='690.0' y='172.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>4. out = slots_[0]</text><text x='690.0' y='191.0' text-anchor='middle' font-size='11' fill='#57606a'>... so it must see all of cmd</text>
<path d='M340,178 C440,178 440,148 530,148' fill='none' stroke='#cf222e' stroke-width='2.5'/><line x1='529' y1='148' x2='540' y2='148' stroke='#cf222e' stroke-width='2.5'/><path d='M540.0,148.0 L530.0,153.0 L530.0,143.0 z' fill='#cf222e'/>
<text x='440' y='140' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>synchronizes-with</text>
<text x='440' y='200' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>(the acquire read the released value)</text>
<rect x='40' y='240' width='820' height='88' rx='8' fill='#fff5f5' stroke='#cf222e'/>
<text x='60' y='264' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>With memory_order_relaxed on both:</text>
<text x='60' y='286' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>the compiler or CPU may make step 2 visible before step 1 (or do 4 before 3).</text>
<text x='60' y='306' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>The consumer then sees head = 1 but copies a half-written cmd: wrong price or qty, and a data race (undefined behaviour).</text>
<text x='40' y='356' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>False sharing: why alignas(64) on head_ and tail_</text>
<rect x='40' y='368' width='112' height='30' rx='5' fill='#c8e1ff' stroke='#d0d7de' stroke-width='1.3'/><text x='96.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>head_</text>
<rect x='160' y='368' width='112' height='30' rx='5' fill='#c8e1ff' stroke='#d0d7de' stroke-width='1.3'/><text x='216.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>tail_cache_</text>
<rect x='280' y='368' width='112' height='30' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.3'/><text x='336.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>pad</text>
<text x='220' y='416' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>cache line 1: only the producer writes</text>
<rect x='480' y='368' width='112' height='30' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='536.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>tail_</text>
<rect x='600' y='368' width='112' height='30' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='656.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>head_cache_</text>
<rect x='720' y='368' width='112' height='30' rx='5' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.3'/><text x='776.0' y='387.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>pad</text>
<text x='660' y='416' text-anchor='middle' font-size='11' font-weight='600' fill='#1a7f37'>cache line 2: only the consumer writes</text>
<text x='20' y='448' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>If head_ and tail_ shared one 64-byte line, every push would invalidate the consumer's copy, and every pop the producer's.</text></svg>
