<text x='355.0' y='142.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<rect x='373' y='122' width='32' height='32' rx='4' fill='#c7f0d2' stroke='#ffffff'/>
<text x='389.0' y='142.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<rect x='407' y='122' width='32' height='32' rx='4' fill='#f5c6e9' stroke='#ffffff'/>
