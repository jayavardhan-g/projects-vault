<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 310' width='760' height='310' font-family='Inter, Helvetica, Arial, sans-serif'><title>stride</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='760' height='310' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>x.stride(d): how far to jump in memory for +1 along axis d</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>row-major: stride(1) = 1 (next column = next address), stride(0) = 3 (next row = jump a whole row)</text>
<text x='90.0' y='94' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>x: shape [2, 3]</text>
<rect x='30' y='102' width='120' height='97' rx='7' fill='none' stroke='#6e7781' stroke-width='1.3'/>
