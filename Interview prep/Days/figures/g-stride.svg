<text x='90.0' y='177.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>4</text>
<rect x='108' y='157' width='32' height='32' rx='4' fill='#d8d0ff' stroke='#ffffff'/>
<text x='124.0' y='177.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>5</text>
<text x='406.0' y='109' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>how it sits in memory</text>
