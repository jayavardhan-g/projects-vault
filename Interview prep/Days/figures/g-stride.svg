<rect x='475' y='122' width='32' height='32' rx='4' fill='#d8d0ff' stroke='#ffffff'/>
<text x='491.0' y='142.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>5</text>
<text x='406.0' y='174' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>addresses 0 … 5</text>
<text x='30' y='235' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'>address of x[i, j] = i · stride(0) + j · stride(1) = 3i + j</text>
<text x='30' y='260' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>x[1, 2] → 3·1 + 2 = 5. A [N, 16, 8, 64] cache has stride(0) = 16·8·64 = 8192.</text>
