<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 380' width='800' height='380' font-family='Inter, Helvetica, Arial, sans-serif'><title>RoPE rotation of each token's pair 0</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='800' height='380' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='400' y='30' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>Pair 0 of K (features f0, f2) for each token, drawn as a 2-D arrow</text>
<text x='400' y='50' text-anchor='middle' font-size='12' fill='#57606a'>grey = before RoPE, red = after; the angle turned is position × 1 rad. Pair 1 (f1, f3) turns only position × 0.0014 rad.</text>
<circle cx='140' cy='190' r='95' fill='#f6f8fa' stroke='#d0d7de'/>
<line x1='39' y1='190' x2='241' y2='190' stroke='#d0d7de'/><line x1='140' y1='89' x2='140' y2='291' stroke='#d0d7de'/>
<text x='239' y='186' font-size='10' fill='#57606a'>f0</text><text x='144' y='93' font-size='10' fill='#57606a'>f2</text>
<line x1='140' y1='190' x2='166.1' y2='173.0' stroke='#8c959f' stroke-width='4' stroke-linecap='round'/>
<line x1='140' y1='190' x2='166.1' y2='173.0' stroke='#cf222e' stroke-width='4' stroke-linecap='round'/>
<text x='140' y='311' text-anchor='middle' font-size='14' font-weight='700' fill='#1f2328'>'the', position 0: turn 0 rad (0°)</text>
<text x='140' y='331' text-anchor='middle' font-size='12' fill='#57606a'>(0.82, 0.53) → <tspan fill='#cf222e'>(0.82, 0.53)</tspan></text>
<text x='140' y='349' text-anchor='middle' font-size='11' fill='#57606a'>length stays 0.97: rotation never changes size</text>
<circle cx='400' cy='190' r='95' fill='#f6f8fa' stroke='#d0d7de'/>
<line x1='299' y1='190' x2='501' y2='190' stroke='#d0d7de'/><line x1='400' y1='89' x2='400' y2='291' stroke='#d0d7de'/>
<text x='499' y='186' font-size='10' fill='#57606a'>f0</text><text x='404' y='93' font-size='10' fill='#57606a'>f2</text>
<line x1='400' y1='190' x2='444.1' y2='207.0' stroke='#8c959f' stroke-width='4' stroke-linecap='round'/>
<line x1='400' y1='190' x2='438.1' y2='162.1' stroke='#cf222e' stroke-width='4' stroke-linecap='round'/>
<path d='M431.7,202.2 A34,34 0 0 0 427.4,169.9' fill='none' stroke='#cf222e' stroke-width='2' stroke-dasharray='4 3'/>
