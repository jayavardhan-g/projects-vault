<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 330' width='860' height='330' font-family='Inter, Helvetica, Arial, sans-serif'><title>BCubed</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='m-ink' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1f2328'/></marker><marker id='m-muted' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#57606a'/></marker><marker id='m-red' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#cf222e'/></marker><marker id='m-blue' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#0969da'/></marker><marker id='m-green' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1a7f37'/></marker><marker id='m-amber' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#bf8700'/></marker><marker id='m-grey' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#8c959f'/></marker></defs><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>BCubed: score every face, then average</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>colour = true person; boxes = predicted clusters. Face 4 (a B) was put in with the three As</text>
<rect x='40' y='75' width='240' height='74' rx='10' fill='none' stroke='#57606a' stroke-width='1.5'/>
<text x='160.0' y='166' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>cluster 1</text>
<rect x='48' y='87' width='48' height='50' rx='8' fill='#ffd8b5' stroke='#1f2328'/>
<text x='72' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 1</text><text x='72' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>A</text>
<rect x='104' y='87' width='48' height='50' rx='8' fill='#ffd8b5' stroke='#1f2328'/>
<text x='128' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 2</text><text x='128' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>A</text>
<rect x='160' y='87' width='48' height='50' rx='8' fill='#ffd8b5' stroke='#1f2328'/>
<text x='184' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 3</text><text x='184' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>A</text>
<rect x='216' y='87' width='48' height='50' rx='8' fill='#c8e1ff' stroke='#1f2328'/>
<text x='240' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 4</text><text x='240' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>B</text>
<rect x='304' y='75' width='72' height='74' rx='10' fill='none' stroke='#57606a' stroke-width='1.5'/>
<text x='340.0' y='166' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>cluster 2</text>
<rect x='312' y='87' width='48' height='50' rx='8' fill='#c8e1ff' stroke='#1f2328'/>
<text x='336' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 5</text><text x='336' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>B</text>
<rect x='400' y='75' width='72' height='74' rx='10' fill='none' stroke='#57606a' stroke-width='1.5'/>
<text x='436.0' y='166' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>cluster 3</text>
<rect x='408' y='87' width='48' height='50' rx='8' fill='#c7f0d2' stroke='#1f2328'/>
<text x='432' y='108' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>face 6</text><text x='432' y='126' text-anchor='middle' font-size='12' font-weight='700' fill='#1f2328'>C</text>
<text x='540' y='85' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>face</text><text x='600' y='85' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>precision</text><text x='690' y='85' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>recall</text>
<text x='540' y='107' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1</text><text x='600' y='107' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.75</text><text x='690' y='107' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text>
<text x='540' y='128' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>2</text><text x='600' y='128' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.75</text><text x='690' y='128' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text>
<text x='540' y='149' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>3</text><text x='600' y='149' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.75</text><text x='690' y='149' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text>
<text x='540' y='170' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>4</text><text x='600' y='170' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.25</text><text x='690' y='170' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.50</text>
<text x='540' y='191' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>5</text><text x='600' y='191' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text><text x='690' y='191' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>0.50</text>
<text x='540' y='212' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>6</text><text x='600' y='212' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text><text x='690' y='212' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>1.00</text>
<text x='540' y='250' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>mean</text><text x='600' y='250' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>0.750</text><text x='690' y='250' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>0.833</text>
<text x='40' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>precision(face) = share of ITS CLUSTER with its true person: face 1 → 3 of 4 = 0.75</text>
<text x='40' y='222' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>recall(face) = share of ITS PERSON inside its cluster: face 5 → 1 of 2 = 0.50</text>
<text x='40' y='256' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>F1 = 2 · 0.750 · 0.833 / (0.750 + 0.833) = 0.789</text>
<text x='20' y='318' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>no matching of cluster ids to people is needed: every number is about one face</text></svg>
