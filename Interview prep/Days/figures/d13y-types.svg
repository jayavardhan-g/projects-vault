<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='960' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>Limit, IOC and Market: the same buyer, three order types</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='400' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Limit, IOC and Market: the same buyer, three order types</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the difference is only what happens to the part that cannot trade now</text>

<g opacity='1'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2500;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/4</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The book: sellers offer 50 shares at 103 and 40 shares at 105. A buyer wants 80 shares.</text>
<text x='480' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#57606a'>price</text><text x='250' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>buyers (bids)</text><text x='710' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>sellers (asks)</text><rect x='430' y='96' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='126.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>105</text><rect x='560' y='96' width='300' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='710.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>40 waiting</text><rect x='100' y='96' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='430' y='158' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='188.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>103</text><rect x='560' y='158' width='300' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='710.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>50 waiting</text><rect x='100' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='240' width='400' height='46' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='300.0' y='268.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>incoming: buy 80</text><text x='520' y='268' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2500;0.5000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/4</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>LIMIT buy 80 @ 103: fills 50 at 103. 105 is above the limit. The other 30 REST in the book and wait.</text>
<text x='480' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#57606a'>price</text><text x='250' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>buyers (bids)</text><text x='710' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>sellers (asks)</text><rect x='430' y='96' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='126.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>105</text><rect x='560' y='96' width='300' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='710.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>40 waiting</text><rect x='100' y='96' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='430' y='158' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='188.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>103</text><rect x='560' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='710.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='158' width='300' height='50' rx='4' fill='#c8e1ff' stroke='#cf222e' stroke-width='2.4'/><text x='250.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>new order: 30 resting</text><rect x='100' y='240' width='400' height='46' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='300.0' y='268.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>Limit  buy 80 @ 103</text><text x='520' y='268' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>filled 50, resting 30</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.7500;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/4</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>IOC buy 80 @ 103: fills 50 at 103, same as before. But the other 30 EXPIRE at once. Nothing rests.</text>
<text x='480' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#57606a'>price</text><text x='250' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>buyers (bids)</text><text x='710' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>sellers (asks)</text><rect x='430' y='96' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='126.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>105</text><rect x='560' y='96' width='300' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='710.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>40 waiting</text><rect x='100' y='96' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='430' y='158' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='188.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>103</text><rect x='560' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.4'/><text x='710.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='240' width='400' height='46' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='300.0' y='268.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>IOC  buy 80 @ 103</text><text x='520' y='268' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>filled 50, expired 30</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.7500;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/4</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>MARKET buy 80: no price limit. Fills 50 at 103, then 30 more at 105. It never rests either.</text>
<text x='480' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#57606a'>price</text><text x='250' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>buyers (bids)</text><text x='710' y='84' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>sellers (asks)</text><rect x='430' y='96' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='126.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>105</text><rect x='560' y='96' width='300' height='50' rx='4' fill='#ffd8d3' stroke='#cf222e' stroke-width='2.4'/><text x='710.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>10 waiting</text><rect x='100' y='96' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='125.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='430' y='158' width='100' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='188.4' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2328'>103</text><rect x='560' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.4'/><text x='710.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='158' width='300' height='50' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='250.0' y='187.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>—</text><rect x='100' y='240' width='400' height='46' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='300.0' y='268.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>Market  buy 80</text><text x='520' y='268' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>filled 80 (50 @ 103 + 30 @ 105)</text>
</g>
</svg>