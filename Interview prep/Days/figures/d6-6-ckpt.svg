<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0400;0.2800;1.0000'/><rect x='470' y='176.0' width='180' height='143.0' rx='3' fill='#ffd8b5' stroke='#cf222e' stroke-width='2'/><text x='560' y='252.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>192 MiB in use</text><text x='670' y='196.0' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>forward 1–2: z1 a1 z2</text></g>
<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.2800;0.5200;1.0000'/><rect x='470' y='224.0' width='180' height='95.0' rx='3' fill='#c8e1ff' stroke='#cf222e' stroke-width='2'/><text x='560' y='276.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>128 MiB in use</text><text x='670' y='196.0' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>forward 3: z3 a3 (overwrites)</text></g>
<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.5200;0.7600;1.0000'/><rect x='470' y='224.0' width='180' height='95.0' rx='3' fill='#c8e1ff' stroke='#cf222e' stroke-width='2'/><text x='560' y='276.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>128 MiB in use</text><text x='670' y='196.0' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>backward: rebuild z3 a3 from A2</text></g>
<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.7600;1.0000;1.0000'/><rect x='470' y='176.0' width='180' height='143.0' rx='3' fill='#ffd8b5' stroke='#cf222e' stroke-width='2'/><text x='560' y='252.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>192 MiB in use</text><text x='670' y='196.0' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>backward: rebuild z1 a1 z2 from X</text></g>
<text x='690' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>arena = max(</text>
<text x='690' y='148' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>  2·n3 = 128,</text>
<text x='690' y='166' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>  2·n1 + n2 = 192) MiB</text>
<text x='690' y='200' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>activations: 400 → 272</text>
<text x='690' y='218' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>(−32%)</text>
<text x='690' y='248' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>whole step: 962 → 834</text>
<text x='690' y='266' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>(−128 MiB = −13.3%)</text>
<text x='690' y='296' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>cost: backward 136.1 →</text>
<text x='690' y='314' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>171.7 ms (+26%)</text>
<text x='20' y='418' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: what the one arena holds in each phase. Five separate buffers instead would total 400 again: the 0 MB bug</text></svg>
