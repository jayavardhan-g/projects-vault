<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 430' width='900' height='430' font-family='Inter, Helvetica, Arial, sans-serif'><title>checkpointing memory</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='430' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Checkpointing on the N = 4096 config: what is allocated (MiB)</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>4-layer MLP, batch 4096, widths 1024 → 4096 → 4096 → 4096 → 1024; one 4096×4096 float tensor = 64 MiB</text>
