<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 470' width='960' height='470' font-family='Inter, Helvetica, Arial, sans-serif'><title>Why the column split was 1.73× faster: waves and L2</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='470' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why the column split was 1.73× faster: waves and L2</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>mm_thin at N = 32768; each tiny cell is one block (256 threads); coloured bands = blocks resident in the same wave</text>
<text x='40' y='86' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>baseline grid: 128 column chunks (blockIdx.x) × 32 batch rows (blockIdx.y) = 4,096 blocks</text><rect x='40' y='96' width='588.8' height='224' rx='0' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><line x1='40' y1='96' x2='628.8' y2='96' stroke='#ffffff' stroke-width='0.8'/><line x1='40' y1='152' x2='628.8' y2='152' stroke='#ffffff' stroke-width='0.8'/><line x1='40' y1='208' x2='628.8' y2='208' stroke='#ffffff' stroke-width='0.8'/><line x1='40' y1='264' x2='628.8' y2='264' stroke='#ffffff' stroke-width='0.8'/><line x1='40' y1='320' x2='628.8' y2='320' stroke='#ffffff' stroke-width='0.8'/><line x1='40.0' y1='96' x2='40.0' y2='320' stroke='#ffffff' stroke-width='0.8'/><line x1='187.2' y1='96' x2='187.2' y2='320' stroke='#ffffff' stroke-width='0.8'/><line x1='334.4' y1='96' x2='334.4' y2='320' stroke='#ffffff' stroke-width='0.8'/><line x1='481.59999999999997' y1='96' x2='481.59999999999997' y2='320' stroke='#ffffff' stroke-width='0.8'/><line x1='628.8' y1='96' x2='628.8' y2='320' stroke='#ffffff' stroke-width='0.8'/><text x='34' y='106' text-anchor='end' font-size='9' font-weight='400' fill='#57606a'>row 0</text><text x='34' y='320' text-anchor='end' font-size='9' font-weight='400' fill='#57606a'>row 31</text>
<g opacity='1'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>A wave = blocks resident at once: up to 8 mm_thin blocks per SM × 132 SMs = 1,056. Baseline needs 4,096 / 1,056 ≈ 3.9 waves.</text>
<text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>dispatch order (typical, not guaranteed):</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>blockIdx.x first, then the next blockIdx.y.</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>So a wave = a band of ~8 batch rows</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>across ALL 128 column chunks.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Wave 0: batch rows 0–8 × all 128 column chunks → it streams the WHOLE of W1 (4.29 GB) through a ~50 MB L2.</text>
<rect x='40.0' y='96' width='588.8' height='7' fill='#c8e1ff' fill-opacity='0.85'/><rect x='40' y='103' width='588.8' height='49' fill='#c8e1ff' fill-opacity='0.85'/><rect x='40' y='152' width='147.2' height='7' fill='#c8e1ff' fill-opacity='0.85'/><text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>wave 0 touches every column of W1</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>4.29 GB ≫ 50 MB L2:</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>the early chunks are evicted</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>before anyone else needs them.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Wave 1: the next ~8 rows need the same W columns again, but those lines left L2 long ago → HBM again.</text>
<rect x='40.0' y='96' width='588.8' height='7' fill='#c8e1ff' fill-opacity='0.35'/><rect x='40' y='103' width='588.8' height='49' fill='#c8e1ff' fill-opacity='0.35'/><rect x='40' y='152' width='147.2' height='7' fill='#c8e1ff' fill-opacity='0.35'/><rect x='187.2' y='152' width='441.59999999999997' height='7' fill='#c7f0d2' fill-opacity='0.85'/><rect x='40' y='159' width='588.8' height='49' fill='#c7f0d2' fill-opacity='0.85'/><rect x='40' y='208' width='294.4' height='7' fill='#c7f0d2' fill-opacity='0.85'/><text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>W1 is read from HBM again</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>for every wave: about 4 times per layer.</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>(reconstructed hypothesis; not profiled,</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>ncu needed root)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Waves 2 and 3: two more sweeps. Reuse of W across the batch is left to cache luck.</text>
<rect x='40.0' y='96' width='588.8' height='7' fill='#c8e1ff' fill-opacity='0.35'/><rect x='40' y='103' width='588.8' height='49' fill='#c8e1ff' fill-opacity='0.35'/><rect x='40' y='152' width='147.2' height='7' fill='#c8e1ff' fill-opacity='0.35'/><rect x='187.2' y='152' width='441.59999999999997' height='7' fill='#c7f0d2' fill-opacity='0.35'/><rect x='40' y='159' width='588.8' height='49' fill='#c7f0d2' fill-opacity='0.35'/><rect x='40' y='208' width='294.4' height='7' fill='#c7f0d2' fill-opacity='0.35'/><rect x='334.4' y='208' width='294.4' height='7' fill='#fff1a8' fill-opacity='0.85'/><rect x='40' y='215' width='588.8' height='49' fill='#fff1a8' fill-opacity='0.85'/><rect x='40' y='264' width='441.59999999999997' height='7' fill='#fff1a8' fill-opacity='0.85'/><rect x='481.59999999999997' y='264' width='147.2' height='7' fill='#f5c6e9' fill-opacity='0.85'/><rect x='40' y='271' width='588.8' height='49' fill='#f5c6e9' fill-opacity='0.85'/><text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>≈ 3.9 sweeps of W per layer</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>baseline time scales 7.1× from</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>N = 16K → 32K for 4× the work</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>(6.29 → 44.43 ms): a large-N pathology</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Column split: each kernel is 32 chunks wide and fits in ONE wave, so its 32 batch rows run together.</text>
<rect x='40.0' y='96' width='588.8' height='7' fill='#c8e1ff' fill-opacity='0.2'/><rect x='40' y='103' width='588.8' height='49' fill='#c8e1ff' fill-opacity='0.2'/><rect x='40' y='152' width='147.2' height='7' fill='#c8e1ff' fill-opacity='0.2'/><rect x='187.2' y='152' width='441.59999999999997' height='7' fill='#c7f0d2' fill-opacity='0.2'/><rect x='40' y='159' width='588.8' height='49' fill='#c7f0d2' fill-opacity='0.2'/><rect x='40' y='208' width='294.4' height='7' fill='#c7f0d2' fill-opacity='0.2'/><rect x='334.4' y='208' width='294.4' height='7' fill='#fff1a8' fill-opacity='0.2'/><rect x='40' y='215' width='588.8' height='49' fill='#fff1a8' fill-opacity='0.2'/><rect x='40' y='264' width='441.59999999999997' height='7' fill='#fff1a8' fill-opacity='0.2'/><rect x='481.59999999999997' y='264' width='147.2' height='7' fill='#f5c6e9' fill-opacity='0.2'/><rect x='40' y='271' width='588.8' height='49' fill='#f5c6e9' fill-opacity='0.2'/><text x='40' y='352' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>one column-split kernel: 32 chunks × 32 rows = 1,024 blocks ≤ 1,056 → ONE wave</text><rect x='40' y='360' width='294.4' height='48' rx='0' fill='#c7f0d2' stroke='#57606a' stroke-width='1'/><text x='344.4' y='388' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>all 32 rows of each W chunk are resident together → W lines shared via L2</text><text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>each W1 line is needed by 32 blocks</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>that are resident at the same time</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>→ read from HBM ~once, then L2 hits</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>column split scales 4.1× (6.19 → 25.65)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='28.8s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='424' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='444' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='444' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Verdict: the 1.73× is most likely LOCALITY, not concurrency. One experiment settles it: all 4 chunks on ONE stream.</text>
<text x='40' y='352' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>one column-split kernel: 32 chunks × 32 rows = 1,024 blocks ≤ 1,056 → ONE wave</text><rect x='40' y='360' width='294.4' height='48' rx='0' fill='#c7f0d2' stroke='#57606a' stroke-width='1'/><text x='344.4' y='388' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>all 32 rows of each W chunk are resident together → W lines shared via L2</text><text x='650' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>test (prep pack exercise 2): st[s] → st[0]</text><text x='650' y='131' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>≈ 25–27 ms still → locality</text><text x='650' y='152' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>≈ 44 ms again → overlap mattered</text><text x='650' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>not run: say "likely", never "proved"</text>
</g>
</svg>