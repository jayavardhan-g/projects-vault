<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 540' width='760' height='540' font-family='Inter, Helvetica, Arial, sans-serif'><title>One decoder layer: the residual stream</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='760' height='540' rx='12' fill='#ffffff' stroke='#d0d7de'/><rect x='270' y='20' width='220' height='46' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='380.0' y='37.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>hidden  [3, 8]</text><text x='380.0' y='56.0' text-anchor='middle' font-size='11' fill='#57606a'>layer input = residual</text>
<line x1='380' y1='66' x2='380' y2='470' stroke='#1f2328' stroke-width='3'/>
<text x='390' y='292' font-size='12' fill='#57606a'>residual stream</text>
<rect x='40' y='90' width='290' height='186' rx='10' fill='#fff8f0' stroke='#e5a06a'/>
<text x='185' y='110' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>attention block</text>
<text x='60' y='134' font-size='12' fill='#1f2328'>1. RMSNorm 1.4</text>
<text x='60' y='160' font-size='12' fill='#1f2328'>2. q, k, v 1.5</text>
<text x='60' y='186' font-size='12' fill='#1f2328'>3. RoPE 1.6</text>
<text x='60' y='212' font-size='12' fill='#1f2328'>4. cache write 1.7</text>
<text x='60' y='238' font-size='12' fill='#1f2328'>5. attention 1.8</text>
<text x='60' y='264' font-size='12' fill='#1f2328'>6. o_proj 1.9</text>
<path d='M380,98 L340,98' fill='none' stroke='#57606a' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#ah)'/>
<path d='M330,203 L366,203' fill='none' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<circle cx='380' cy='203' r='13' fill='#ffffff' stroke='#1f2328' stroke-width='2'/>
<text x='380' y='209' text-anchor='middle' font-size='18' font-weight='700' fill='#1f2328'>+</text>
<text x='402' y='208' font-size='12' fill='#57606a'>H1 = X + attention output</text>
<rect x='40' y='310' width='290' height='134' rx='10' fill='#fff8f0' stroke='#e5a06a'/>
<text x='185' y='330' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>MLP block</text>
<text x='60' y='354' font-size='12' fill='#1f2328'>1. RMSNorm 1.10</text>
<text x='60' y='380' font-size='12' fill='#1f2328'>2. gate, up 1.10</text>
<text x='60' y='406' font-size='12' fill='#1f2328'>3. silu · up</text>
<text x='60' y='432' font-size='12' fill='#1f2328'>4. down_proj 1.10</text>
<path d='M380,318 L340,318' fill='none' stroke='#57606a' stroke-width='2' stroke-dasharray='5 4' marker-end='url(#ah)'/>
<path d='M330,397 L366,397' fill='none' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<circle cx='380' cy='397' r='13' fill='#ffffff' stroke='#1f2328' stroke-width='2'/>
<text x='380' y='403' text-anchor='middle' font-size='18' font-weight='700' fill='#1f2328'>+</text>
<text x='402' y='402' font-size='12' fill='#57606a'>H2 = H1 + MLP output</text>
<rect x='270' y='470' width='220' height='46' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='380.0' y='487.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>hidden  [3, 8]</text><text x='380.0' y='506.0' text-anchor='middle' font-size='11' fill='#57606a'>→ next layer (16 in total)</text>
<text x='500' y='92' font-size='12' fill='#57606a'>Each block READS a normalised</text>
<text x='500' y='108' font-size='12' fill='#57606a'>copy of the stream (dashed)</text>
<text x='500' y='124' font-size='12' fill='#57606a'>and ADDS its result back (solid).</text>
<text x='500' y='140' font-size='12' fill='#57606a'>The stream is never normalised</text>
<text x='500' y='156' font-size='12' fill='#57606a'>in place, so the original signal</text>
<text x='500' y='172' font-size='12' fill='#57606a'>survives all 16 layers.</text></svg>
