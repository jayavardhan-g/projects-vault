<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 430' width='800' height='430' font-family='Inter, Helvetica, Arial, sans-serif'><title>Radix prefix cache</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='800' height='430' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='400' y='26' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>A radix prefix cache with block size 4: each node = one FULL block of token ids</text>
<text x='400' y='46' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>rc = refcount: 1 for the tree + 1 per running request using the block</text>
<rect x='245' y='70' width='190' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='340.0' y='90.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>root</text><text x='340.0' y='109.0' text-anchor='middle' font-size='11' fill='#57606a'>no block</text>
<rect x='245' y='150' width='190' height='52' rx='8' fill='#fff8f0' stroke='#d0d7de' stroke-width='1.5'/><text x='340.0' y='170.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>[s0 s1 s2 s3]</text><text x='340.0' y='189.0' text-anchor='middle' font-size='11' fill='#57606a'>block 0 · rc 3</text>
<rect x='245' y='230' width='190' height='52' rx='8' fill='#fff8f0' stroke='#d0d7de' stroke-width='1.5'/><text x='340.0' y='250.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>[s4 s5 s6 s7]</text><text x='340.0' y='269.0' text-anchor='middle' font-size='11' fill='#57606a'>block 1 · rc 3</text>
<rect x='75' y='310' width='190' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='170.0' y='330.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>[a0 a1 a2 a3]</text><text x='170.0' y='349.0' text-anchor='middle' font-size='11' fill='#57606a'>block 2 · rc 2 (A running)</text>
<rect x='415' y='310' width='190' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='510.0' y='330.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>[b0 b1 b2 b3]</text><text x='510.0' y='349.0' text-anchor='middle' font-size='11' fill='#57606a'>block 5 · rc 1 · leaf: evictable</text>
<line x1='340' y1='122' x2='340' y2='148' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<line x1='340' y1='202' x2='340' y2='228' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<line x1='340' y1='282' x2='170' y2='308' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<line x1='340' y1='282' x2='510' y2='308' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/>
<text x='560' y='175' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>shared system prompt S (8 tokens):</text>
<text x='560' y='193' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>used by A and by the new request C</text>
<text x='20' y='395' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>New request C = S + [c0 c1 c2] (11 tokens): its full blocks are [s0..s3], [s4..s7] → both match → 8 tokens reused.</text>
<text x='20' y='413' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Its 3rd block [c0 c1 c2] is not full, so it can't be in the tree: C prefills only those 3 tokens.</text></svg>
