<text x="50" y="318" font-weight="700" fill="#1f2430" font-size="15">Where does token t = 9 live?   (BlockTable.slot_index / slot_mapping)</text>
<text x="60" y="346" fill="#1f2430">logical block</text><text x="250" y="346" fill="#2f6fde" font-family="monospace">t // B</text><text x="470" y="346" fill="#1f2430" font-family="monospace" font-weight="700">9 // 4 = 2</text>
<text x="60" y="371" fill="#1f2430">offset in block</text><text x="250" y="371" fill="#2f6fde" font-family="monospace">t % B</text><text x="470" y="371" fill="#1f2430" font-family="monospace" font-weight="700">9 % 4 = 1</text>
<text x="60" y="396" fill="#1f2430">physical block</text><text x="250" y="396" fill="#2f6fde" font-family="monospace">table[2]</text><text x="470" y="396" fill="#1f2430" font-family="monospace" font-weight="700">23</text>
<text x="60" y="421" fill="#1f2430">flat slot</text><text x="250" y="421" fill="#2f6fde" font-family="monospace">block_id × B + offset</text><text x="470" y="421" fill="#1f2430" font-family="monospace" font-weight="700">23 × 4 + 1 = 93</text>
<text x="60" y="450" fill="#5b6170" font-size="12">Blocks needed for n tokens = ceil(n / B) = (n + B − 1) // B → 10 tokens need 3 blocks; the 11th and 12th slots of block #23 are the only waste.</text>
<text x="640" y="342" fill="#1f2430" font-size="13" font-weight="700">Why one flat slot number?</text>
<text x="640" y="362" fill="#5b6170" font-size="12">Per layer, K is [num_blocks, B, 8, 64].</text>
<text x="640" y="378" fill="#5b6170" font-size="12">k_flat views it as [num_blocks × B, 8, 64],</text>
<text x="640" y="394" fill="#5b6170" font-size="12">so a slot is just a row: one scatter</text>
<text x="640" y="410" fill="#5b6170" font-size="12">k_flat[slots] = key writes every token.</text>
