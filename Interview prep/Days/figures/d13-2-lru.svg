<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 445' width='860' height='445' font-family='Inter, Helvetica, Arial, sans-serif'><title>LRU example</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='445' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>LRU cache, capacity 3: the list order after each call</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>front = most recently used, back = next to evict; the map points each key at its list node</text>
<rect x='20' y='70' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='92.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>put(1, a)</text>
<text x='160' y='82' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='86' width='56' height='26' rx='5' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.3'/><text x='188.0' y='103.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='370' y='82' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='103' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>insert at front</text>
<rect x='20' y='126' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>put(2, b)</text>
<text x='160' y='138' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='142' width='56' height='26' rx='5' fill='#c8e1ff' stroke='#d0d7de' stroke-width='1.3'/><text x='188.0' y='159.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<text x='223' y='160' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='230' y='142' width='56' height='26' rx='5' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.3'/><text x='258.0' y='159.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='370' y='138' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='159' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>insert at front</text>
<rect x='20' y='182' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='204.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>put(3, c)</text>
<text x='160' y='194' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='198' width='56' height='26' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='188.0' y='215.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>3</text>
<text x='223' y='216' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='230' y='198' width='56' height='26' rx='5' fill='#c8e1ff' stroke='#d0d7de' stroke-width='1.3'/><text x='258.0' y='215.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<text x='293' y='216' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='300' y='198' width='56' height='26' rx='5' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.3'/><text x='328.0' y='215.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='370' y='194' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='215' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>insert at front (now full)</text>
<rect x='20' y='238' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='260.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>get(1)</text>
<text x='160' y='250' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='254' width='56' height='26' rx='5' fill='#c8e1ff' stroke='#1f2328' stroke-width='1.3'/><text x='188.0' y='271.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>1</text>
<text x='223' y='272' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='230' y='254' width='56' height='26' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='258.0' y='271.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>3</text>
<text x='293' y='272' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='300' y='254' width='56' height='26' rx='5' fill='#c8e1ff' stroke='#d0d7de' stroke-width='1.3'/><text x='328.0' y='271.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<text x='370' y='250' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='271' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>hit: splice 1 to the front</text>
<rect x='20' y='294' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='316.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>put(4, d)</text>
<text x='160' y='306' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='310' width='56' height='26' rx='5' fill='#c8e1ff' stroke='#1f2328' stroke-width='1.3'/><text x='188.0' y='327.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>4</text>
<text x='223' y='328' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='230' y='310' width='56' height='26' rx='5' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.3'/><text x='258.0' y='327.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='293' y='328' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='300' y='310' width='56' height='26' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='328.0' y='327.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>3</text>
<text x='370' y='306' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='327' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>full: evict the back (2), insert 4</text>
<rect x='20' y='350' width='110' height='36' rx='5' fill='#ffffff' stroke='#8c959f' stroke-width='1.3'/><text x='75.0' y='372.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>get(2)</text>
<text x='160' y='362' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>front</text>
<rect x='160' y='366' width='56' height='26' rx='5' fill='#f5c6e9' stroke='#d0d7de' stroke-width='1.3'/><text x='188.0' y='383.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>4</text>
<text x='223' y='384' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='230' y='366' width='56' height='26' rx='5' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.3'/><text x='258.0' y='383.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='293' y='384' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>⇄</text>
<rect x='300' y='366' width='56' height='26' rx='5' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.3'/><text x='328.0' y='383.0' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>3</text>
<text x='370' y='362' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>back</text>
<text x='400' y='383' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>miss: 2 was evicted → go to Postgres</text>
<text x='20' y='430' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Every step is O(1): find the node through the map, then relink a few pointers (splice / pop_back / emplace_front).</text></svg>
