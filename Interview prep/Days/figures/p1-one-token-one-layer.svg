<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <rect x="1" y="1" width="978" height="798" rx="14" fill="#fbfbfd" stroke="#d8dbe3"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6170"/></marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1f2430">One forward pass through Llama-3.2-1B (your mini-vLLM model)</text>
  <text x="30" y="60" fill="#5b6170">T = tokens in this pass. Prefill: T = prompt length. Decode: T = 1 per sequence (your llama.py flattens all sequences into [total_tokens]).</text>

  <!-- column headers -->
  <text x="60" y="92" font-size="12" font-weight="700" fill="#5b6170" letter-spacing="1">STEP</text>
  <text x="470" y="92" font-size="12" font-weight="700" fill="#5b6170" letter-spacing="1">TENSOR SHAPE</text>
  <text x="720" y="92" font-size="12" font-weight="700" fill="#5b6170" letter-spacing="1">WEIGHTS</text>

  <!-- embedding -->
  <rect x="50" y="102" width="400" height="40" rx="8" fill="#e8eefc" stroke="#2f6fde"/>
  <text x="66" y="127" fill="#1f2430" font-weight="600">Embedding lookup (token id → vector)</text>
  <text x="470" y="127" fill="#1f2430" font-family="monospace">x: [T, 2048]</text>
  <text x="720" y="127" fill="#5b6170">128256 × 2048 = 262.7M</text>
  <line x1="250" y1="142" x2="250" y2="166" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- layer frame -->
  <rect x="36" y="170" width="920" height="470" rx="12" fill="none" stroke="#7b55c9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="50" y="192" fill="#7b55c9" font-weight="700">Decoder layer  × 16  (same code, different weights)</text>

  <!-- rows -->
  <rect x="50" y="204" width="400" height="38" rx="8" fill="#f0f1f5" stroke="#9aa0ad"/>
  <text x="66" y="228" fill="#1f2430">RMSNorm</text>
  <text x="470" y="228" fill="#1f2430" font-family="monospace">h: [T, 2048]</text>
  <text x="720" y="228" fill="#5b6170">2048 (tiny)</text>
  <line x1="250" y1="242" x2="250" y2="256" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="258" width="400" height="58" rx="8" fill="#fff" stroke="#9aa0ad"/>
  <text x="66" y="280" fill="#1f2430" font-weight="600">Q, K, V projections</text>
  <text x="66" y="302" fill="#2f6fde">Q = h·Wq</text><text x="160" y="302" fill="#e07b28">K = h·Wk</text><text x="254" y="302" fill="#2e9e6b">V = h·Wv</text>
  <text x="470" y="280" fill="#2f6fde" font-family="monospace">Q: [T, 32 heads, 64]</text>
  <text x="470" y="302" fill="#e07b28" font-family="monospace">K, V: [T, 8 heads, 64]</text>
  <text x="720" y="280" fill="#5b6170">Wq 2048×2048 = 4.2M</text>
  <text x="720" y="302" fill="#5b6170">Wk, Wv 2048×512 = 1.0M each</text>
  <line x1="250" y1="316" x2="250" y2="330" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="332" width="400" height="38" rx="8" fill="#fff" stroke="#9aa0ad"/>
  <text x="66" y="356" fill="#1f2430">RoPE: rotate Q and K by token position</text>
  <text x="470" y="356" fill="#1f2430" font-family="monospace">shapes unchanged</text>
  <text x="720" y="356" fill="#5b6170">no weights · θ base 500000</text>
  <line x1="250" y1="370" x2="250" y2="384" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="386" width="400" height="42" rx="8" fill="#fdf0e4" stroke="#e07b28" stroke-width="2"/>
  <text x="66" y="412" fill="#1f2430" font-weight="700">Write new K, V into the paged KV cache</text>
  <text x="470" y="404" fill="#1f2430">at slots from slot_mapping</text>
  <text x="470" y="422" fill="#5b6170" font-size="12">this is the memory that paging manages</text>
  <text x="720" y="412" fill="#e07b28" font-weight="600">32 KiB per token (all layers)</text>
  <line x1="250" y1="428" x2="250" y2="442" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="444" width="400" height="58" rx="8" fill="#fff" stroke="#9aa0ad"/>
  <text x="66" y="466" fill="#1f2430" font-weight="600">Attention over every cached token</text>
  <text x="66" y="488" fill="#5b6170" font-size="13">query head h uses KV head h // 4 (GQA)</text>
  <text x="470" y="466" fill="#1f2430" font-family="monospace">out: [T, 32, 64]</text>
  <text x="470" y="488" fill="#1f2430" font-family="monospace">→ [T, 2048]</text>
  <text x="720" y="476" fill="#5b6170">no weights (reads cache)</text>
  <line x1="250" y1="502" x2="250" y2="516" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="518" width="400" height="38" rx="8" fill="#fff" stroke="#9aa0ad"/>
  <text x="66" y="542" fill="#1f2430">o_proj, then residual: x = x + attn</text>
  <text x="470" y="542" fill="#1f2430" font-family="monospace">x: [T, 2048]</text>
  <text x="720" y="542" fill="#5b6170">Wo 2048×2048 = 4.2M</text>
  <line x1="250" y1="556" x2="250" y2="570" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="50" y="572" width="400" height="58" rx="8" fill="#f1ecfb" stroke="#7b55c9"/>
  <text x="66" y="594" fill="#1f2430" font-weight="600">RMSNorm → SwiGLU MLP, then residual</text>
  <text x="66" y="616" fill="#5b6170" font-size="13" font-family="monospace">down( silu(gate(h)) * up(h) )</text>
  <text x="470" y="594" fill="#1f2430" font-family="monospace">gate, up: [T, 8192]</text>
  <text x="470" y="616" fill="#1f2430" font-family="monospace">down → x: [T, 2048]</text>
  <text x="720" y="594" fill="#7b55c9" font-weight="600">3 × 2048×8192 = 50.3M</text>
  <text x="720" y="616" fill="#5b6170" font-size="13">the MLP is 83% of a layer</text>

  <line x1="250" y1="640" x2="250" y2="664" stroke="#5b6170" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="50" y="666" width="400" height="42" rx="8" fill="#e8eefc" stroke="#2f6fde"/>
  <text x="66" y="692" fill="#1f2430" font-weight="600">Final RMSNorm → lm_head → argmax</text>
  <text x="470" y="692" fill="#1f2430" font-family="monospace">logits: [T, 128256]</text>
  <text x="720" y="692" fill="#5b6170">tied to embedding (0 new)</text>

  <!-- totals -->
  <rect x="50" y="724" width="880" height="56" rx="8" fill="#eef7f2" stroke="#2e9e6b"/>
  <text x="66" y="746" fill="#1f2430"><tspan font-weight="700">Where the 1.24B parameters live:</tspan> 16 layers × (10.5M attention + 50.3M MLP) = 973M, plus 262.7M embedding ≈ 1.24B.</text>
  <text x="66" y="768" fill="#1f2430">In bf16 that is ≈ 2.5 GB. <tspan font-weight="700">Every decode step reads all of it once</tspan> — that read is what makes decode memory-bound.</text>
</svg>
