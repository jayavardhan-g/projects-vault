<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 400' width='860' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>centroid vs average linkage</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='400' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='m-ink' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1f2328'/></marker><marker id='m-muted' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#57606a'/></marker><marker id='m-red' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#cf222e'/></marker><marker id='m-blue' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#0969da'/></marker><marker id='m-green' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1a7f37'/></marker><marker id='m-amber' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#bf8700'/></marker><marker id='m-grey' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#8c959f'/></marker></defs><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why refine must use 1 − x·mean, not the normalised centroid</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>members at −50°, 0°, 50°; candidate face x at 75°; threshold 0.75</text>
<circle cx='120' cy='230' r='160' fill='none' stroke='#d0d7de' stroke-dasharray='3 3'/>
<line x1='120' y1='230' x2='222.8' y2='352.6' stroke='#0969da' stroke-width='2' marker-end='url(#m-blue)'/><text x='231.8' y='367.3' text-anchor='start' font-size='12' font-weight='600' fill='#0969da'>member -50°</text>
<line x1='120' y1='230' x2='280.0' y2='230.0' stroke='#0969da' stroke-width='2' marker-end='url(#m-blue)'/><text x='294.0' y='234.0' text-anchor='start' font-size='12' font-weight='600' fill='#0969da'>member 0°</text>
<line x1='120' y1='230' x2='222.8' y2='107.4' stroke='#0969da' stroke-width='2' marker-end='url(#m-blue)'/><text x='231.8' y='100.7' text-anchor='start' font-size='12' font-weight='600' fill='#0969da'>member 50°</text>
<line x1='120' y1='230' x2='241.9' y2='230.0' stroke='#1a7f37' stroke-width='4' marker-end='url(#m-green)'/>
<text x='150' y='252' text-anchor='start' font-size='11' font-weight='700' fill='#1a7f37'>mean, length 0.762</text>
<line x1='120' y1='230' x2='161.4' y2='75.5' stroke='#cf222e' stroke-width='3' marker-end='url(#m-red)'/><text x='165.0' y='65.9' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>x (75°)</text>
<text x='430' y='95' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>distance to each member: 1 − cos</text>
<text x='430' y='121' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>−50°: 1 − cos125° = 1.574</text>
<text x='430' y='147' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0°: 1 − cos75° = 0.741</text>
<text x='430' y='173' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>50°: 1 − cos25° = 0.094</text>
<text x='430' y='211' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>average-linkage distance = 0.803  > 0.75  → stays out</text>
<text x='430' y='237' text-anchor='start' font-size='12' font-weight='400' fill='#1a7f37'>1 − x · mean = 1 − 0.762·cos75° = 0.803  (identical)</text>
<text x='430' y='275' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>normalised centroid (length 1): 1 − cos75° = 0.741</text>
<text x='430' y='301' text-anchor='start' font-size='12' font-weight='400' fill='#cf222e'>&lt; 0.75 → wrongly joins: the centroid sits closer</text>
<text x='430' y='327' text-anchor='start' font-size='12' font-weight='400' fill='#cf222e'>to every face than the members do on average</text>
<text x='20' y='388' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>story 4.2: with zero answers, the normalised version pulled 100–170 noise faces into identities</text></svg>
