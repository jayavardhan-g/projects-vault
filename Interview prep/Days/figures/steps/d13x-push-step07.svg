='#8c959f' xml:space='preserve'> 32</text><text x='64' y='191' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>  }</text><text x='30' y='212' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#8c959f' xml:space='preserve'> 33</text><text x='64' y='212' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>  slots_[head &amp; (Capacity - 1)] = item;</text><text x='30' y='233' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#8c959f' xml:space='preserve'> 34</text><text x='64' y='233' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>  head_.store(head + 1, release);</text><text x='30' y='254' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#8c959f' xml:space='preserve'> 35</text><text x='64' y='254' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>  return true;</text><text x='30' y='275' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#8c959f' xml:space='preserve'> 36</text><text x='64' y='275' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>}</text><text x='596' y='78' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the variables right now</text>
