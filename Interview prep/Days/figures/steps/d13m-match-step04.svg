.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>B1  qty 30</text><text x='30' y='349' text-anchor='start' font-size='11' font-weight='700' fill='#1a7f37'>best_bid_ →</text><text x='540' y='392' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>oldest order is next to the price column (the level head)</text><rect x='30' y='400' width='250' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2'/><text x='155.0' y='426.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>incoming: buy id 9 @ 102, qty left 30</text><text x='300' y='427' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>filled 40</text>
