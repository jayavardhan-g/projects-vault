<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Price-time priority: buy 70 @ 102, then cancel the remainder</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>best price first; at one price the oldest order first; trades execute at the resting order's price</text>

<g>
