<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Segment B: base 65,000 ≤ 65,000. Replay all 2,000. r.seq = 67,000: the book is exactly as before the crash.</text>
<rect x='80.0' y='90' width='480.0' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='88.0' y='112' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>snapshot: the book after 60,000 commands</text><rect x='160.0' y='150' width='600.0' height='40' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='166.0' y='144' text-anchor='start' font-size='11' font-weight='600' fill='#57606a'>segment A: base 50,000, 15,000 records</text><rect x='160.0' y='150' width='400.0' height='40' rx='4' fill='#d0d7de' stroke='#57606a' stroke-width='1.2'/><text x='360.0' y='175' text-anchor='middle' font-size='10' font-weight='600' fill='#57606a'>in the snapshot: skip</text><rect x='560.0' y='150' width='200.0' height='40' rx='4' fill='#c7f0d2' stroke='#1a7f37' stroke-width='2'/><text x='660.0' y='175' text-anchor='middle' font-size='11' font-weight='700' fill='#1a7f37'>replay</text><rect x='760.0' y='220' width='80.0' height='40' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='840.0' y='214' text-anchor='end' font-size='11' font-weight='600' fill='#57606a'>segment B: base 65,000, 2,000 records</text><rect x='760.0' y='220' width='80.0' height='40' rx='4' fill='#c7f0d2' stroke='#1a7f37' stroke-width='2'/><text x='800.0' y='245' text-anchor='middle' font-size='11' font-weight='700' fill='#1a7f37'>replay</text><line x1='840.0' y1='80' x2='840.0' y2='300' stroke='#cf222e' stroke-width='2' stroke-dasharray='6 4'/><text x='840.0' y='76' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>r.seq = 67,000</text>
