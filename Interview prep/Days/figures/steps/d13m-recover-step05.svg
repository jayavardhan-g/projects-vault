<line x1='80.0' y1='300' x2='900.0' y2='300' stroke='#57606a' stroke-width='1.2'/><line x1='160.0' y1='296' x2='160.0' y2='304' stroke='#57606a' stroke-width='1.2'/><text x='160.0' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>50,000</text><line x1='360.0' y1='296' x2='360.0' y2='304' stroke='#57606a' stroke-width='1.2'/><text x='360.0' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>55,000</text><line x1='560.0' y1='296' x2='560.0' y2='304' stroke='#57606a' stroke-width='1.2'/><text x='560.0' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>60,000</text><line x1='760.0' y1='296' x2='760.0' y2='304' stroke='#57606a' stroke-width='1.2'/><text x='760.0' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>65,000</text><line x1='840.0' y1='296' x2='840.0' y2='304' stroke='#57606a' stroke-width='1.2'/><text x='840.0' y='320' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>67,000</text><text x='906.0' y='304' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>seq</text>
