<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='960' height='380' font-family='Inter, Helvetica, Arial, sans-serif'><title>ObjectPool: a free stack of pre-allocated Orders</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='380' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>ObjectPool: a free stack of pre-allocated Orders</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>acquire = free_[--top_]   release = free_[top_++] = p</text>

<g>
<rect x='20' y='334' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='354' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='354' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Constructor: every node is free. top_ = 4 counts the free ones.</text>
<text x='60' y='92' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>storage_: 4 Orders, allocated once</text><rect x='60' y='104' width='88' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='104.0' y='127.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>N0</text><text x='104.0' y='142.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free</text><rect x='156' y='104' width='88' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='200.0' y='127.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>N1</text><text x='200.0' y='142.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free</text><rect x='252' y='104' width='88' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='296.0' y='127.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>N2</text><text x='296.0' y='142.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free</text><rect x='348' y='104' width='88' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='392.0' y='127.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>N3</text><text x='392.0' y='142.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free</text><text x='520' y='92' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>free_: a stack of pointers</text><rect x='520' y='104' width='88' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='564' y='134' text-anchor='middle' font-size='14' font-weight='700' fill='#1f2328'>N0</text><text x='564' y='172' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free_[0]</text><rect x='616' y='104' width='88' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='660' y='134' text-anchor='middle' font-size='14' font-weight='700' fill='#1f2328'>N1</text><text x='660' y='172' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free_[1]</text><rect x='712' y='104' width='88' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='756' y='134' text-anchor='middle' font-size='14' font-weight='700' fill='#1f2328'>N2</text><text x='756' y='172' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free_[2]</text><rect x='808' y='104' width='88' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='852' y='134' text-anchor='middle' font-size='14' font-weight='700' fill='#1f2328'>N3</text><text x='852' y='172' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>free_[3]</text><line x1='904' y1='226' x2='904' y2='186' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><text x='904' y='244' text-anchor='middle' font-size='13' font-weight='700' fill='#0969da'>top_ = 4</text><text x='60' y='250' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'></text>
</g>
</svg>