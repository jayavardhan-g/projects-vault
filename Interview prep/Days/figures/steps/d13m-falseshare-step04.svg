<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='960' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>False sharing, and what alignas(64) fixes</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='400' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>False sharing, and what alignas(64) fixes</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>a core must own a whole cache line to write any byte of it</text>
<text x='40' y='84' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>without alignas: head_ and tail_ on ONE 64-byte cache line</text><text x='520' y='84' text-anchor='start' font-size='13' font-weight='700' fill='#1a7f37'>with alignas(64): one line each</text><line x1='490' y1='66' x2='490' y2='340' stroke='#d0d7de' stroke-width='1.2'/>
<g>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/4</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>next pop: back to core B. Every operation pays a cross-core transfer. That is false sharing.</text>
<rect x='90' y='200' width='320' height='44' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='110' y='227' text-anchor='start' font-size='13' font-weight='700' fill='#0969da'>head_</text><text x='250' y='227' text-anchor='start' font-size='13' font-weight='700' fill='#1a7f37'>tail_</text><text x='250' y='262' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>one cache line</text><rect x='60' y='110' width='120' height='50' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='120.0' y='133.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>core A (producer)</text><text x='120.0' y='148.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>copy invalid</text><rect x='320' y='110' width='120' height='50' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='380.0' y='133.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>core B (consumer)</text><text x='380.0' y='148.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>owns the line</text><text x='250' y='300' text-anchor='middle' font-size='13' font-weight='700' fill='#cf222e'>line transfers so far: 4</text><line x1='380' y1='162' x2='350' y2='198' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><rect x='540' y='110' width='150' height='50' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='615.0' y='133.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>core A (producer)</text><text x='615.0' y='148.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>owns its line</text><rect x='770' y='110' width='150' height='50' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='845.0' y='133.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>core B (consumer)</text><text x='845.0' y='148.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>owns its line</text><rect x='530' y='200' width='170' height='44' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='545' y='227' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>head_  tail_cache_</text><rect x='760' y='200' width='170' height='44' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='775' y='227' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>tail_  head_cache_</text><text x='730' y='290' text-anchor='middle' font-size='12' font-weight='600' fill='#1a7f37'>no line ever changes owner</text>
</g>
</svg>