<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='960' height='440' font-family='Inter, Helvetica, Arial, sans-serif'><title>Why head is published with release and read with acquire</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='440' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why head is published with release and read with acquire</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the same two steps (write the slot, publish head) with and without an ordering rule</text>
<rect x='20' y='64' width='920' height='150' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/><text x='34' y='86' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>relaxed stores and loads: nothing forbids this order</text><rect x='20' y='224' width='920' height='150' rx='8' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/><text x='34' y='246' text-anchor='start' font-size='13' font-weight='700' fill='#1a7f37'>write slot → release-store head ⇒ acquire-load head → read slot</text>
<g>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/5</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Bottom: the consumer acquire-loads head = 5. Everything written before the release is visible.</text>
<text x='40' y='116' text-anchor='start' font-size='11' font-weight='600' fill='#57606a'>slot 0</text><rect x='90' y='100' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='124' y='100' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='158' y='100' width='30' height='26' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='192' y='100' width='30' height='26' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><rect x='226' y='100' width='30' height='26' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='90' y='144' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>16 of 40 bytes written</text><rect x='300' y='98' width='130' height='32' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='365.0' y='118.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ = 5</text><text x='300' y='146' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>what the producer has stored</text><rect x='520' y='98' width='150' height='32' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='595.0' y='117.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>consumer sees head 5</text><rect x='710' y='98' width='200' height='32' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.2'/><text x='810.0' y='117.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>reads a torn command ✗</text><text x='40' y='276' text-anchor='start' font-size='11' font-weight='600' fill='#57606a'>slot 0</text><rect x='90' y='260' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='124' y='260' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='158' y='260' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='192' y='260' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><rect x='226' y='260' width='30' height='26' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='90' y='304' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>40 of 40 bytes written</text><rect x='300' y='258' width='130' height='32' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='365.0' y='278.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ = 5</text><text x='300' y='306' text-anchor='start' font-size='10' font-weight='400' fill='#57606a'>what the producer has stored</text><rect x='520' y='258' width='150' height='32' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='595.0' y='277.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>consumer sees head 5</text>
