<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='960' height='430' font-family='Inter, Helvetica, Arial, sans-serif'><title>SPSC ring, Capacity 4: nine calls</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='430' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>SPSC ring, Capacity 4: nine calls</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>indices only grow; slot = index &amp; 3; each side reloads the other index only when its cached copy says full or empty</text>
<text x='120' y='92' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>slots_ (Capacity 4)</text><rect x='560' y='80' width='170' height='26' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='645.0' y='96.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>producer writes</text><rect x='760' y='80' width='170' height='26' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='845.0' y='96.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>consumer writes</text>
<g>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/10</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>push C: write slot 2, then head = 3.</text>
<rect x='120' y='110' width='80' height='70' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='160' y='153' text-anchor='middle' font-size='22' font-weight='700' fill='#1f2328'>A</text><text x='160' y='198' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>slot 0</text><rect x='210' y='110' width='80' height='70' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='250' y='153' text-anchor='middle' font-size='22' font-weight='700' fill='#1f2328'>B</text><text x='250' y='198' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>slot 1</text><rect x='300' y='110' width='80' height='70' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='340' y='153' text-anchor='middle' font-size='22' font-weight='700' fill='#1f2328'>C</text><text x='340' y='198' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>slot 2</text><rect x='390' y='110' width='80' height='70' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='430' y='153' text-anchor='middle' font-size='22' font-weight='700' fill='#8c959f'></text><text x='430' y='198' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>slot 3</text><line x1='415' y1='250' x2='415' y2='208' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><text x='409' y='254' text-anchor='end' font-size='11' font-weight='600' fill='#0969da'>head &amp; 3 = 3</text><line x1='175' y1='300' x2='175' y2='208' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><text x='181' y='304' text-anchor='start' font-size='11' font-weight='600' fill='#1a7f37'>tail &amp; 3 = 0</text><text x='120' y='350' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>size = head − tail = 3 − 0 = 3</text><rect x='560' y='116' width='170' height='40' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.4'/><text x='572' y='141' text-anchor='start' font-size='12' font-weight='600' fill='#0969da'>head_</text><text x='718' y='142' text-anchor='end' font-size='16' font-weight='700' fill='#cf222e'>3</text><rect x='560' y='166' width='170' height='40' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='572' y='191' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>tail_cache_</text><text x='718' y='192' text-anchor='end' font-size='16' font-weight='700' fill='#1f2328'>0</text><rect x='760' y='116' width='170' height='40' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='772' y='141' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>tail_</text><text x='918' y='142' text-anchor='end' font-size='16' font-weight='700' fill='#1f2328'>0</text><rect x='760' y='166' width='170' height='40' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><text x='772' y='191' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>head_cache_</text><text x='918' y='192' text-anchor='end' font-size='16' font-weight='700' fill='#1f2328'>0</text><text x='560' y='232' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>yellow = holds an item not yet popped</text><text x='560' y='250' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>grey letter = already popped, not erased</text><text x='560' y='268' text-anchor='start' font-size='11' font-weight='400' fill='#cf222e'>red = changed or touched in this step</text>
</g>
</svg>