<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 420' width='960' height='420' font-family='Inter, Helvetica, Arial, sans-serif'><title>What breaks if head is published before the slot is written</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='420' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>What breaks if head is published before the slot is written</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the two lines of push in the wrong order</text>

<g>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/5</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The producer writes E into slot 0. Too late: the consumer has already moved past index 4.</text>
<rect x='40' y='74' width='400' height='60' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='56' y='98' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#cf222e' xml:space='preserve'>head_.store(head + 1, release);  // first</text><text x='56' y='120' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#cf222e' xml:space='preserve'>slots_[head &amp; 3] = item;         // second</text><text x='470' y='96' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>lines 33 and 34 swapped</text><rect x='60' y='170' width='80' height='56' rx='4' fill='#ffe8a3' stroke='#cf222e' stroke-width='2.4'/><text x='100.0' y='203.76' text-anchor='middle' font-size='16' font-weight='600' fill='#1f2328'>E</text><text x='100' y='244' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 0</text><rect x='150' y='170' width='80' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='190.0' y='203.76' text-anchor='middle' font-size='16' font-weight='600' fill='#1f2328'>B</text><text x='190' y='244' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 1</text><rect x='240' y='170' width='80' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='280.0' y='203.76' text-anchor='middle' font-size='16' font-weight='600' fill='#1f2328'>C</text><text x='280' y='244' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 2</text><rect x='330' y='170' width='80' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='370.0' y='203.76' text-anchor='middle' font-size='16' font-weight='600' fill='#1f2328'>D</text><text x='370' y='244' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 3</text><rect x='470' y='170' width='180' height='56' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='560.0' y='203.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head_ = 5</text><rect x='680' y='170' width='240' height='56' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='800.0' y='202.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>tail = 5: slot 0 counts as read</text><text x='60' y='290' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>result: command A applied twice, command E never applied ✗</text>
</g>
</svg>