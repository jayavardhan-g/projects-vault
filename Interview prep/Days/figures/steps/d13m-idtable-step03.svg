'96' height='58' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='628' y='140' text-anchor='middle' font-size='16' font-weight='700' fill='#1f2328'>D</text><text x='628' y='158' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>home 5</text><text x='628' y='186' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 5</text><rect x='684' y='110' width='96' height='58' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='732' y='140' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>empty</text><text x='732' y='186' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 6</text><rect x='788' y='110' width='96' height='58' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='836' y='140' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>empty</text><text x='836' y='186' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>slot 7</text><text x='60' y='250' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>B is still in the table but can no longer be found ✗</text>
