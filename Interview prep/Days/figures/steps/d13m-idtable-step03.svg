<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' width='960' height='430' font-family='Inter, Helvetica, Arial, sans-serif'><title>IdTable::erase(A): backward-shift deletion</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='430' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>IdTable::erase(A): backward-shift deletion</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>open addressing with linear probing, 8 slots; each key shows its home slot = mix(id) &amp; mask</text>

<g>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/7</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The wrong way to erase A: just empty slot 2. Now find(B) starts at 2, sees empty, and stops.</text>
