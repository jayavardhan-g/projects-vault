<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 420' width='820' height='420' font-family='Inter, Helvetica, Arial, sans-serif'><title>IVF</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='820' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='m-ink' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1f2328'/></marker><marker id='m-muted' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#57606a'/></marker><marker id='m-red' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#cf222e'/></marker><marker id='m-blue' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#0969da'/></marker><marker id='m-green' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1a7f37'/></marker><marker id='m-amber' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#bf8700'/></marker><marker id='m-grey' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#8c959f'/></marker></defs><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>IVF: search only the nearest list(s), and sometimes miss</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>k-means puts the 6 photos in 2 lists; with nprobe = 1 only one list is scanned</text>
<path d='M360.0,360.0 A280,280 0 0 0 -100.0,145.5' fill='none' stroke='#8c959f' stroke-width='1.2' stroke-dasharray='3 3'/>
<line x1='80' y1='360' x2='294.6' y2='295.6' stroke='#cf222e' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#m-red)'/>
<line x1='80' y1='360' x2='121.6' y2='139.9' stroke='#0969da' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#m-blue)'/><text x='123.4' y='134.1' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>centroid B (79.3°)</text>
<line x1='80' y1='360' x2='267.3' y2='191.4' stroke='#bf8700' stroke-width='3' marker-end='url(#m-amber)'/><text x='194.4' y='261.0' text-anchor='end' font-size='12' font-weight='600' fill='#bf8700'>query (42°)</text>
<text x='230' y='338' text-anchor='start' font-size='11' font-weight='600' fill='#cf222e'>centroid A (16.7°)</text>
<circle cx='358.9' cy='335.6' r='8' fill='#ffd8b5' stroke='#1f2328' stroke-width='1'/>
<text x='370.9' y='329.6' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>5: 0.799</text>
<circle cx='350.5' cy='287.5' r='8' fill='#ffd8b5' stroke='#1f2328' stroke-width='1'/>
<text x='362.5' y='281.5' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>9: 0.891</text>
<circle cx='322.5' cy='220.0' r='8' fill='#ffd8b5' stroke='#1f2328' stroke-width='1'/>
<text x='334.5' y='234.0' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>40: 0.978</text>
<circle cx='260.0' cy='145.5' r='8' fill='#c8e1ff' stroke='#1a7f37' stroke-width='1'/>
<text x='272.0' y='139.5' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>77: 0.990</text>
<circle cx='175.8' cy='96.9' r='8' fill='#c8e1ff' stroke='#1f2328' stroke-width='1'/>
<text x='187.8' y='90.9' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>12: 0.883</text>
<circle cx='-60.0' cy='117.5' r='8' fill='#c8e1ff' stroke='#1f2328' stroke-width='1'/>
<text x='-72.0' y='111.5' text-anchor='end' font-size='11' font-weight='600' fill='#1f2328'>81: 0.208</text>
<text x='470' y='110' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>query vs centroids: A 0.904, B 0.795</text>
<text x='470' y='135' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>nprobe = 1 → scan list A {5, 9, 40} only</text>
<text x='470' y='160' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>→ best found: 40 (0.978)</text>
<text x='470' y='195' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>true best: 77 (0.990), in list B</text>
<text x='470' y='220' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>nprobe = 2 (scan both) finds it,</text>
<text x='470' y='240' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>but then IVF saves nothing</text>
<text x='20' y='408' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>orange-filled = list A, blue-filled = list B; Flat (Photo-Seek's choice) scans all 6 and never misses</text></svg>
