<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 440' width='960' height='440' font-family='Inter, Helvetica, Arial, sans-serif'><title>Finding a price level: a tree vs a flat array</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='440' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Finding a price level: a tree vs a flat array</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>std::map (the naive engine) against std::vector&lt;Level&gt; indexed by price (this engine)</text>

<g opacity='1'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The usual way, std::map: prices in a balanced tree. Every node is its own small block somewhere on the heap.</text>
<line x1='480' y1='140' x2='280' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='480' y1='140' x2='680' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='180' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='380' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='580' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='780' y2='256' stroke='#57606a' stroke-width='1.2'/><rect x='425' y='96' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='122.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 100</text><rect x='225' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='280.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 98</text><rect x='625' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='680.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 102</text><rect x='125' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='180.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 97</text><rect x='325' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='380.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 99</text><rect x='525' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='580.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 101</text><rect x='725' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 103</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Find the level for price 101. Start at the root: 101 &gt; 100, so go right.</text>
<line x1='480' y1='140' x2='280' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='480' y1='140' x2='680' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='180' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='380' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='580' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='780' y2='256' stroke='#57606a' stroke-width='1.2'/><rect x='425' y='96' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='122.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 100</text><rect x='225' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='280.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 98</text><rect x='625' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='680.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 102</text><rect x='125' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='180.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 97</text><rect x='325' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='380.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 99</text><rect x='525' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='580.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 101</text><rect x='725' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 103</text><text x='40' y='340' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>hop 1</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>101 &lt; 102, so go left.</text>
<line x1='480' y1='140' x2='280' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='480' y1='140' x2='680' y2='176' stroke='#cf222e' stroke-width='2.6'/><line x1='280' y1='220' x2='180' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='380' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='580' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='780' y2='256' stroke='#57606a' stroke-width='1.2'/><rect x='425' y='96' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='122.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 100</text><rect x='225' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='280.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 98</text><rect x='625' y='176' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='680.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 102</text><rect x='125' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='180.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 97</text><rect x='325' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='380.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 99</text><rect x='525' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='580.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 101</text><rect x='725' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 103</text><text x='40' y='340' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>hop 2: follow a pointer to another block of memory (likely a cache miss)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Found, after 3 hops. With n price levels that is about log2(n) hops: O(log n).</text>
<line x1='480' y1='140' x2='280' y2='176' stroke='#57606a' stroke-width='1.2'/><line x1='480' y1='140' x2='680' y2='176' stroke='#cf222e' stroke-width='2.6'/><line x1='280' y1='220' x2='180' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='280' y1='220' x2='380' y2='256' stroke='#57606a' stroke-width='1.2'/><line x1='680' y1='220' x2='580' y2='256' stroke='#cf222e' stroke-width='2.6'/><line x1='680' y1='220' x2='780' y2='256' stroke='#57606a' stroke-width='1.2'/><rect x='425' y='96' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='122.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 100</text><rect x='225' y='176' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='280.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 98</text><rect x='625' y='176' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='680.0' y='202.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 102</text><rect x='125' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='180.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 97</text><rect x='325' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='380.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 99</text><rect x='525' y='256' width='110' height='44' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='580.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 101</text><rect x='725' y='256' width='110' height='44' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='282.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>price 103</text><text x='40' y='340' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>hop 3; and a new price means allocating a new node</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>This engine: a flat array. The price IS the index, so the address is one multiplication and one addition.</text>
<text x='60' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>asks_ : one array, the index is the price</text><rect x='60' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='116.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[97]</text><text x='116.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='180' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='236.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[98]</text><text x='236.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='300' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='356.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[99]</text><text x='356.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='420' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='476.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[100]</text><text x='476.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='540' y='124' width='112' height='60' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='596.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[101]</text><text x='596.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='660' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='716.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[102]</text><text x='716.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='780' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='836.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[103]</text><text x='836.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><text x='60' y='230' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='13' font-weight='700' fill='#1f2328' xml:space='preserve'>address of asks_[101]  =  start of the array + 101 × 24 bytes</text><text x='60' y='270' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>one step, however many prices there are: O(1)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The cost: 65,536 levels × 24 bytes ≈ 1.5 MB per side, mostly empty. Fine when prices are bounded integers.</text>
<text x='60' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>asks_ : one array, the index is the price</text><rect x='60' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='116.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[97]</text><text x='116.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='180' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='236.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[98]</text><text x='236.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='300' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='356.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[99]</text><text x='356.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='420' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='476.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[100]</text><text x='476.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='540' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='596.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[101]</text><text x='596.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='660' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='716.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[102]</text><text x='716.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><rect x='780' y='124' width='112' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='836.0' y='152.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>asks_[103]</text><text x='836.0' y='168.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>24 bytes</text><text x='60' y='230' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='13' font-weight='700' fill='#1f2328' xml:space='preserve'>address of asks_[101]  =  start of the array + 101 × 24 bytes</text><text x='60' y='270' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>two sides → about 3 MB per symbol, whatever is in the book</text>
</g>
</svg>