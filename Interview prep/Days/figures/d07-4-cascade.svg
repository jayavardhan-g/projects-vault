<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 330' width='880' height='330' font-family='Inter, Helvetica, Arial, sans-serif'><title>cascade latency</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Time to first audio: a cascade adds up its stages</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>illustrative stage costs (prep pack exercise 5), not measurements</text>
<rect x='40.0' y='95' width='250.0' height='40' fill='#ffd8b5' stroke='#ffffff' stroke-width='2'/>
<text x='165.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>500</text>
<text x='165.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>wait for end of speech</text>
<rect x='290.0' y='95' width='50.0' height='40' fill='#c8e1ff' stroke='#ffffff' stroke-width='2'/>
<text x='315.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>100</text>
<text x='315.0' y='168' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>ASR finalise</text>
<rect x='340.0' y='95' width='150.0' height='40' fill='#c7f0d2' stroke='#ffffff' stroke-width='2'/>
<text x='415.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>300</text>
<text x='415.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>LLM first token</text>
<rect x='490.0' y='95' width='150.0' height='40' fill='#f5c6e9' stroke='#ffffff' stroke-width='2'/>
<text x='565.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>300</text>
<text x='565.0' y='168' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>first clause, 10 tok</text>
<rect x='640.0' y='95' width='100.0' height='40' fill='#fff1a8' stroke='#ffffff' stroke-width='2'/>
<text x='690.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>200</text>
<text x='690.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>TTS first chunk</text>
<text x='750.0' y='120' text-anchor='start' font-size='14' font-weight='700' fill='#cf222e'>= 1,400 ms</text>
<rect x='40' y='195' width='100.0' height='26' fill='#1a7f37' fill-opacity='0.3' stroke='#1a7f37'/><text x='148.0' y='213' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>human turn gap ≈ 200 ms</text>
<rect x='40' y='231' width='160.0' height='26' fill='#0969da' fill-opacity='0.25' stroke='#0969da'/><text x='208.0' y='249' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>GPT-4o audio ≈ 320 ms average (vendor number)</text>
<text x='40' y='291' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Errors compound too: at 10% WER a 20-word question is fully right 0.9²⁰ ≈ 12% of the time (independence sketch).</text>
<g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0.0000;0.0500;0.9700'/><animateTransform attributeName='transform' type='translate' dur='7.0s' repeatCount='indefinite' values='40.0,115.0;290.0,115.0;340.0,115.0;490.0,115.0;640.0,115.0;740.0,115.0;740.0,115.0' keyTimes='0.0000;0.2100;0.3700;0.5300;0.6900;0.8500;1'/><circle r='7' fill='#cf222e' stroke='#1f2328' stroke-width='1.5'/></g>
<text x='20' y='316' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the red dot is the clock; nothing plays until it reaches the end of the last box</text></svg>
