<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 470' width='900' height='470' font-family='Inter, Helvetica, Arial, sans-serif'><title>retrieval funnel</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='470' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Retrieve, fuse, rerank: each stage is cheap enough for its input size</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>one query · median latencies from RESULTS §2</text>
<rect x='20' y='120' width='130' height='70' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.5'/><text x='85.0' y='149.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>11,355 chunks</text><text x='85.0' y='168.0' text-anchor='middle' font-size='11' fill='#57606a'>the whole corpus</text>
<rect x='200' y='80' width='150' height='62' rx='8' fill='#fff4e5' stroke='#bf8700' stroke-width='1.5'/><text x='275.0' y='105.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>BM25 → top 40</text><text x='275.0' y='124.0' text-anchor='middle' font-size='11' fill='#57606a'>16 ms, word overlap</text>
<rect x='200' y='168' width='150' height='62' rx='8' fill='#e8f1fe' stroke='#0969da' stroke-width='1.5'/><text x='275.0' y='193.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>dense → top 40</text><text x='275.0' y='212.0' text-anchor='middle' font-size='11' fill='#57606a'>39 ms, cosine</text>
<rect x='400' y='120' width='140' height='70' rx='8' fill='#eef9f0' stroke='#1a7f37' stroke-width='1.5'/><text x='470.0' y='149.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>RRF</text><text x='470.0' y='168.0' text-anchor='middle' font-size='11' fill='#57606a'>≤ 80 unique → 40</text>
