<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>persistence</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='400' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>What Raft must persist before replying, and what breaks without it</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>persist() writes term, votedFor and the log to raft_node_X.bin (temp + fsync + rename + fsync dir)</text>
<rect x='20' y='66' width='130' height='30' rx='5' fill='#c8e1ff' stroke='#0969da' stroke-width='1.3'/><text x='85.0' y='85.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>currentTerm</text>
<text x='165' y='86' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>a restarted node at term 0 would accept a deposed leader's messages and vote in old terms</text>
<rect x='20' y='106' width='130' height='30' rx='5' fill='#c8e1ff' stroke='#0969da' stroke-width='1.3'/><text x='85.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>votedFor</text>
<text x='165' y='126' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>forget the vote → vote again in the same term → two leaders in one term (below)</text>
<rect x='20' y='146' width='130' height='30' rx='5' fill='#c8e1ff' stroke='#0969da' stroke-width='1.3'/><text x='85.0' y='165.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>log[]</text>
<text x='165' y='166' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>forget acknowledged entries → a 'majority' that held an entry no longer does → committed data lost</text>
<text x='20' y='208' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>The double vote, if n3 replied before persisting its vote (term 5, 3 nodes):</text>
<rect x='20' y='222' width='160' height='52' rx='8' fill='#c7f0d2' stroke='#8c959f' stroke-width='1.5'/><text x='100.0' y='242.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>n1 asks n3</text><text x='100.0' y='261.0' text-anchor='middle' font-size='11' fill='#57606a'>n3 votes n1, replies</text>
<line x1='180' y1='248' x2='196' y2='248' stroke='#57606a' stroke-width='1.5'/><path d='M196.0,248.0 L186.0,253.0 L186.0,243.0 z' fill='#57606a'/>
<rect x='196' y='222' width='160' height='52' rx='8' fill='#ffc9c9' stroke='#8c959f' stroke-width='1.5'/><text x='276.0' y='242.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>n3 crashes</text><text x='276.0' y='261.0' text-anchor='middle' font-size='11' fill='#57606a'>votedFor never saved</text>
<line x1='356' y1='248' x2='372' y2='248' stroke='#57606a' stroke-width='1.5'/><path d='M372.0,248.0 L362.0,253.0 L362.0,243.0 z' fill='#57606a'/>
<rect x='372' y='222' width='160' height='52' rx='8' fill='#fff1a8' stroke='#8c959f' stroke-width='1.5'/><text x='452.0' y='242.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>n3 restarts</text><text x='452.0' y='261.0' text-anchor='middle' font-size='11' fill='#57606a'>votedFor = none (t5)</text>
<line x1='532' y1='248' x2='548' y2='248' stroke='#57606a' stroke-width='1.5'/><path d='M548.0,248.0 L538.0,253.0 L538.0,243.0 z' fill='#57606a'/>
<rect x='548' y='222' width='160' height='52' rx='8' fill='#c7f0d2' stroke='#8c959f' stroke-width='1.5'/><text x='628.0' y='242.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>n2 asks n3</text><text x='628.0' y='261.0' text-anchor='middle' font-size='11' fill='#57606a'>n3 votes n2 too</text>
<line x1='708' y1='248' x2='724' y2='248' stroke='#57606a' stroke-width='1.5'/><path d='M724.0,248.0 L714.0,253.0 L714.0,243.0 z' fill='#57606a'/>
<rect x='724' y='222' width='160' height='52' rx='8' fill='#ffc9c9' stroke='#8c959f' stroke-width='1.5'/><text x='804.0' y='242.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>two leaders</text><text x='804.0' y='261.0' text-anchor='middle' font-size='11' fill='#57606a'>n1: n1+n3, n2: n2+n3</text>
<text x='20' y='304' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>So the order is always: change state → persist() → reply (handle_request_vote persists at line 766 before answering).</text>
<text x='20' y='328' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Cost: every write pays 2 fsyncs (file + directory) under the global mutex; on main the whole log is rewritten each time,</text>
<text x='20' y='348' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>so writes/s fell from 235 to 125 over 6,000 writes (compaction_bench.json, compaction off).</text>
<text x='20' y='380' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>A SIGKILL test can't catch a missing fsync: the page cache survives a process kill. Only power loss would.</text></svg>
