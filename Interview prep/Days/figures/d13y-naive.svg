<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='960' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>Cancel in the naive engine vs this one</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='400' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Cancel in the naive engine vs this one</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>both find the order by id in O(1); the difference is unlinking it from its price level</text>

<g opacity='1'><animate attributeName='opacity' dur='25.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/5</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The naive engine keeps each price level as a std::list of orders. A "cancel id 4" arrives.</text>
<text x='40' y='96' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>price level 101: five resting orders, oldest on the left</text><rect x='40' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='115.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 1</text><text x='115.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='192' y1='138' x2='218' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='220' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='295.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 2</text><text x='295.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='372' y1='138' x2='398' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='400' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 3</text><text x='475.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='552' y1='138' x2='578' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='655.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 4</text><text x='655.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='732' y1='138' x2='758' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='760' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='835.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 5</text><text x='835.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><rect x='40' y='214' width='330' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='247.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>cancel id 4</text><text x='400' y='248' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='25.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2000;0.4000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/5</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Its id map finds the order OBJECT in one step. But the map does not know where that order sits in the list.</text>
<text x='40' y='96' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>price level 101: five resting orders, oldest on the left</text><rect x='40' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='115.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 1</text><text x='115.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='192' y1='138' x2='218' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='220' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='295.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 2</text><text x='295.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='372' y1='138' x2='398' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='400' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 3</text><text x='475.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='552' y1='138' x2='578' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='655.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 4</text><text x='655.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='732' y1='138' x2='758' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='760' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='835.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 5</text><text x='835.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><rect x='40' y='214' width='330' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='247.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>cancel id 4</text><text x='400' y='248' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>id → the order: O(1). Its place in the list: unknown.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='25.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.4000;0.6000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/5</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>So erase_from walks the list from the front, comparing ids: 1? no. 2? no. 3? no.</text>
<text x='40' y='96' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>price level 101: five resting orders, oldest on the left</text><rect x='40' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='115.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 1</text><text x='115.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='192' y1='138' x2='218' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='220' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='295.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 2</text><text x='295.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='372' y1='138' x2='398' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='400' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='475.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 3</text><text x='475.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='552' y1='138' x2='578' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='655.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 4</text><text x='655.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='732' y1='138' x2='758' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='760' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='835.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 5</text><text x='835.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><rect x='40' y='214' width='330' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='247.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>cancel id 4</text><text x='400' y='248' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>3 comparisons so far, each one a pointer hop</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='25.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6000;0.8000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/5</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Found at the 4th node. With 10,000 orders at one price this walk can take 10,000 steps: O(n).</text>
<text x='40' y='96' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>price level 101: five resting orders, oldest on the left</text><rect x='40' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='115.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 1</text><text x='115.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='192' y1='138' x2='218' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='220' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='295.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 2</text><text x='295.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='372' y1='138' x2='398' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='400' y='108' width='150' height='60' rx='4' fill='#f5c6e9' stroke='#cf222e' stroke-width='2.4'/><text x='475.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 3</text><text x='475.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='552' y1='138' x2='578' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='108' width='150' height='60' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='655.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 4</text><text x='655.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><line x1='732' y1='138' x2='758' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='760' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='835.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 5</text><text x='835.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>a std::list node</text><rect x='40' y='214' width='330' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='247.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>cancel id 4</text><text x='400' y='248' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>this walk is the real "O(n) cancellation"</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='25.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/5</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>This engine: the id table returns the Order*, and the Order itself holds prev and next. No walk at all.</text>
<text x='40' y='96' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>price level 101: five resting orders, oldest on the left</text><rect x='40' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='115.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 1</text><text x='115.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>prev / next inside</text><line x1='192' y1='138' x2='218' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='220' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='295.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 2</text><text x='295.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>prev / next inside</text><line x1='372' y1='138' x2='398' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='400' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='475.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 3</text><text x='475.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>prev / next inside</text><line x1='552' y1='138' x2='578' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='580' y='108' width='150' height='60' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='655.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 4</text><text x='655.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>prev / next inside</text><line x1='732' y1='138' x2='758' y2='138' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='760' y='108' width='150' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='835.0' y='136.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>order id 5</text><text x='835.0' y='153.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>prev / next inside</text><rect x='40' y='214' width='330' height='56' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='247.04' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>cancel id 4</text><text x='400' y='248' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>two pointer writes: 3.next = 5 and 5.prev = 3. O(1).</text>
</g>
</svg>