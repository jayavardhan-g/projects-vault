<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 380' width='960' height='380' font-family='Inter, Helvetica, Arial, sans-serif'><title>Why head_ must be std::atomic at all</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='380' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why head_ must be std::atomic at all</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>what a compiler is allowed to do with a plain shared variable</text>

<g opacity='1'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2500;1'/>
<rect x='20' y='334' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='354' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/4</text>
<text x='72' y='354' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The consumer waits for work: it loops while the ring looks empty. head_ here is a plain variable.</text>
<rect x='40' y='80' width='430' height='60' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='56' y='104' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>size_t head_;          // plain, NOT atomic</text><text x='56' y='126' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#1f2328' xml:space='preserve'>while (tail == head_) { }   // tail is 4</text><rect x='520' y='80' width='190' height='60' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='615.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ in memory: 4</text><rect x='730' y='80' width='190' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='825.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer register: –</text><text x='40' y='190' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>the source says: read head_ every time round the loop</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2500;0.5000;1'/>
<rect x='20' y='334' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='354' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/4</text>
<text x='72' y='354' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The compiler sees no code in THIS thread that changes head_. It may read it once and keep it in a register.</text>
<rect x='40' y='80' width='430' height='60' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='56' y='104' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>size_t head_;          // plain, NOT atomic</text><text x='56' y='126' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#1f2328' xml:space='preserve'>r = head_;  while (tail == r) { }</text><rect x='520' y='80' width='190' height='60' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='615.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ in memory: 4</text><rect x='730' y='80' width='190' height='60' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='825.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer register: 4</text><text x='40' y='190' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>legal for a plain variable: a second thread writing it is a data race, which C++ leaves undefined</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.7500;1'/>
<rect x='20' y='334' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='354' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/4</text>
<text x='72' y='354' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The producer pushes: memory now holds 5. The consumer's register still holds 4.</text>
<rect x='40' y='80' width='430' height='60' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='56' y='104' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>size_t head_;          // plain, NOT atomic</text><text x='56' y='126' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#1f2328' xml:space='preserve'>r = head_;  while (tail == r) { }</text><rect x='520' y='80' width='190' height='60' rx='4' fill='#c8e1ff' stroke='#cf222e' stroke-width='2.4'/><text x='615.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ in memory: 5</text><rect x='730' y='80' width='190' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='825.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer register: 4</text><text x='40' y='190' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>the new value never reaches the loop</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='20.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.7500;1'/>
<rect x='20' y='334' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='354' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/4</text>
<text x='72' y='354' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>4 == 4 forever. The consumer spins and never sees the command. With std::atomic this cannot happen.</text>
<rect x='40' y='80' width='430' height='60' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='56' y='104' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='400' fill='#1f2328' xml:space='preserve'>size_t head_;          // plain, NOT atomic</text><text x='56' y='126' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#cf222e' xml:space='preserve'>r = head_;  while (tail == r) { }</text><rect x='520' y='80' width='190' height='60' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='615.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>head_ in memory: 5</text><rect x='730' y='80' width='190' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='825.0' y='114.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer register: 4</text><text x='40' y='190' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>the consumer hangs ✗</text><rect x='40' y='230' width='880' height='76' rx='8' fill='#ffffff' stroke='#1a7f37' stroke-width='1.6'/><text x='56' y='256' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' font-weight='700' fill='#1a7f37' xml:space='preserve'>std::atomic&lt;size_t&gt; head_;   while (tail == head_.load(acquire)) { }</text><text x='56' y='284' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>atomic: every .load() must really read memory, so the next trip round the loop sees 5 and exits ✓</text>
</g>
</svg>