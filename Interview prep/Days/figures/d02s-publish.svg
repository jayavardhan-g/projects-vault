<text x='640' y='300' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Publishing happens after EVERY forward pass,</text>
<text x='640' y='318' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>not only at the end: requests sharing a</text>
<text x='640' y='336' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>prompt are already running in parallel.</text>
<text x='20' y='486' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the two full blocks become tree nodes and gain a grey reference; at finish the orange references go; the partial block returns to the pool</text></svg>
