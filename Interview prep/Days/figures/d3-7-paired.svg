<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 380' width='860' height='380' font-family='Inter, Helvetica, Arial, sans-serif'><title>Paired median</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='380' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why a paired median: neighbours slow down whichever arm happens to be running</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>made-up numbers showing the mechanism; true speedup 7.5× in every round</text>
<rect x='60' y='271.5' width='48' height='28.5' rx='3' fill='#8c959f' opacity='0.85'/>
<text x='84' y='265.5' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>380</text>
<text x='84' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>HF</text>
<rect x='120' y='86.25' width='48' height='213.75' rx='3' fill='#0969da' opacity='0.85'/>
<text x='144' y='80.25' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>2850</text>
<text x='144' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>ours</text>
<text x='114' y='336' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>round 1: quiet</text>
<text x='114' y='354' text-anchor='middle' font-size='11' font-weight='600' fill='#1a7f37'>ratio 7.50×</text>
<rect x='260' y='281.25' width='48' height='18.75' rx='3' fill='#8c959f' opacity='0.85'/>
<text x='284' y='275.25' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>250</text>
<text x='284' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>HF</text>
<rect x='320' y='159.375' width='48' height='140.625' rx='3' fill='#0969da' opacity='0.85'/>
<text x='344' y='153.375' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>1875</text>
<text x='344' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>ours</text>
<text x='314' y='336' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>round 2: neighbour job</text>
<text x='314' y='354' text-anchor='middle' font-size='11' font-weight='600' fill='#1a7f37'>ratio 7.50× (both arms slowed)</text>
<rect x='460' y='271.5' width='48' height='28.5' rx='3' fill='#8c959f' opacity='0.85'/>
<text x='484' y='265.5' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>380</text>
<text x='484' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>HF</text>
<rect x='520' y='165.0' width='48' height='135.0' rx='3' fill='#0969da' opacity='0.85'/>
<text x='544' y='159.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>1800</text>
<text x='544' y='316' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>ours</text>
<text x='514' y='336' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>round 3: neighbour job</text>
<text x='514' y='354' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>ratio 4.74× (only ours slowed)</text>
<line x1='40' y1='300' x2='630' y2='300' stroke='#57606a'/>
<rect x='650' y='90' width='190' height='80' rx='8' fill='#dafbe1' stroke='#4ac26b' stroke-width='1.5'/><text x='745.0' y='124.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>paired median</text><text x='745.0' y='143.0' text-anchor='middle' font-size='11' fill='#57606a'>median(7.5, 7.5, 4.74) = 7.5×</text>
<rect x='650' y='190' width='190' height='80' rx='8' fill='#ffebe9' stroke='#ff8182' stroke-width='1.5'/><text x='745.0' y='224.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>independent medians</text><text x='745.0' y='243.0' text-anchor='middle' font-size='11' fill='#57606a'>1875 / 380 = 4.93×</text>
<text x='650' y='296' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>Real Phase 5 run: paired</text>
<text x='650' y='312' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>7.61, 4.76, 7.51 → 7.51×;</text>
<text x='650' y='328' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>independent medians: 4.77×</text></svg>
