<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <rect x="1" y="1" width="978" height="468" rx="14" fill="#fbfbfd" stroke="#d8dbe3"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1f2430">The roofline (H200, bf16): how fast can this work possibly run?</text>

  <!-- plot area: x0=90..650, y 360 (1) .. 60 (10^4); x = 90 + 140*log10(I), y = 360 - 75*log10(P) -->
  <rect x="90" y="60" width="560" height="300" fill="#fff" stroke="#d8dbe3"/>
  <rect x="90" y="60" width="323.9" height="300" fill="#fdf0e4" opacity="0.7"/>
  <rect x="413.9" y="60" width="236.1" height="300" fill="#e8eefc" opacity="0.7"/>
  <text x="110" y="82" fill="#e07b28" font-weight="700">MEMORY-BOUND</text>
  <text x="110" y="100" fill="#5b6170" font-size="12">speed = bandwidth × intensity</text>
  <text x="430" y="82" fill="#2f6fde" font-weight="700">COMPUTE-BOUND</text>
  <text x="430" y="100" fill="#5b6170" font-size="12">speed = peak FLOP/s</text>
  <!-- grid -->
  <g stroke="#e4e6ec">
    <line x1="230" y1="60" x2="230" y2="360"/><line x1="370" y1="60" x2="370" y2="360"/><line x1="510" y1="60" x2="510" y2="360"/>
    <line x1="90" y1="285" x2="650" y2="285"/><line x1="90" y1="210" x2="650" y2="210"/><line x1="90" y1="135" x2="650" y2="135"/>
  </g>
  <!-- roof -->
  <polyline points="90,308.9 413.9,135.4 650,135.4" fill="none" stroke="#1f2430" stroke-width="3"/>
  <line x1="413.9" y1="135.4" x2="413.9" y2="360" stroke="#1f2430" stroke-dasharray="4 4"/>
  <text x="420" y="128" fill="#1f2430" font-size="12" font-weight="700">ridge ≈ 206 FLOP/byte</text>
  <text x="560" y="128" fill="#1f2430" font-size="12">989 TFLOP/s</text>
  <text x="170" y="250" fill="#1f2430" font-size="12" transform="rotate(-28 170 250)">4.8 TB/s × intensity</text>

  <!-- points -->
  <g font-size="12">
    <circle cx="92" cy="308.9" r="6" fill="#e07b28"/><text x="102" y="330" fill="#1f2430">decode B=1 (≈5 TFLOP/s, 0.5% of peak)</text>
    <circle cx="216.4" cy="241.2" r="6" fill="#e07b28"/><text x="226" y="256" fill="#1f2430">decode B=8</text>
    <circle cx="342.8" cy="173.5" r="6" fill="#e07b28"/><text x="290" y="160" fill="#1f2430">decode B=64</text>
    <circle cx="553.6" cy="135.4" r="6" fill="#2f6fde"/><text x="520" y="160" fill="#1f2430">prefill N=2048</text>
  </g>

  <!-- axes -->
  <g fill="#5b6170" font-size="12" text-anchor="middle">
    <text x="90" y="378">1</text><text x="230" y="378">10</text><text x="370" y="378">100</text><text x="510" y="378">1000</text><text x="650" y="378">10000</text>
  </g>
  <text x="370" y="398" text-anchor="middle" fill="#1f2430" font-size="13">arithmetic intensity (FLOPs per byte moved, log)  ≈ B for decode, ≈ N for prefill</text>
  <g fill="#5b6170" font-size="12" text-anchor="end">
    <text x="84" y="364">1</text><text x="84" y="289">10</text><text x="84" y="214">100</text><text x="84" y="139">1000</text><text x="84" y="64">10⁴</text>
  </g>
  <text x="30" y="210" fill="#1f2430" font-size="13" text-anchor="middle" transform="rotate(-90 30 210)">attainable TFLOP/s (log)</text>

  <!-- side notes -->
  <g font-size="13" fill="#1f2430">
    <text x="672" y="76" font-weight="700">Read it like this</text>
    <text x="672" y="100">1. Find your intensity on the x-axis.</text>
    <text x="672" y="120">2. Go up to the roof. That height is</text>
    <text x="684" y="138">the best you can ever do.</text>
    <text x="672" y="162">3. Left of the ridge, the GPU waits</text>
    <text x="684" y="180">on memory: buy bandwidth or raise</text>
    <text x="684" y="198">intensity (bigger batch).</text>
    <text x="672" y="222">4. Right of it, the ALUs are full:</text>
    <text x="684" y="240">only fewer FLOPs help.</text>
    <text x="672" y="276" font-weight="700">Ridge = peak ÷ bandwidth</text>
    <text x="672" y="296" font-family="monospace">989e12 / 4.8e12 ≈ 206</text>
    <text x="672" y="330" font-weight="700">Decode B=1 floor</text>
    <text x="672" y="350" font-family="monospace">2.5 GB / 4.8 TB/s ≈ 0.5 ms</text>
  </g>
  <text x="30" y="430" fill="#5b6170" font-size="12">Decode intensity ≈ B ignores the KV-cache read. At long contexts every sequence also reads its own KV, which adds bytes and pulls decode further left.</text>
  <text x="30" y="450" fill="#5b6170" font-size="12">Points are where the work would sit if it hit the roof. Real runs sit below it; at small sizes the CPU launch overhead (regime 3) dominates.</text>
</svg>
