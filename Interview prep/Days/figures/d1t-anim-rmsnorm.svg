<text x='410' y='66' text-anchor='middle' font-size='15' font-weight='600' fill='#cf222e' opacity='1'>1. the token's 8 features: x<animate attributeName='opacity' dur='15.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0;0;0;1' keyTimes='0.0000;0.2000;0.4000;0.6000;0.8000;1.0000'/></text>
<text x='410' y='66' text-anchor='middle' font-size='15' font-weight='600' fill='#cf222e' opacity='0'>2. square each one: x²<animate attributeName='opacity' dur='15.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0;0;0' keyTimes='0.0000;0.2000;0.4000;0.6000;0.8000;1.0000'/></text>
<text x='410' y='66' text-anchor='middle' font-size='15' font-weight='600' fill='#cf222e' opacity='0'>3. average the squares: mean(x²) = 1.15, so rms = √(mean + ε) = 1.07<animate attributeName='opacity' dur='15.0s' repeatCount='indefinite' calcMode='discrete' values='0;0;1;0;0;0' keyTimes='0.0000;0.2000;0.4000;0.6000;0.8000;1.0000'/></text>
<text x='410' y='66' text-anchor='middle' font-size='15' font-weight='600' fill='#cf222e' opacity='0'>4. divide every feature by rms = 1.07: the vector now has rms 1<animate attributeName='opacity' dur='15.0s' repeatCount='indefinite' calcMode='discrete' values='0;0;0;1;0;0' keyTimes='0.0000;0.2000;0.4000;0.6000;0.8000;1.0000'/></text>
<text x='410' y='66' text-anchor='middle' font-size='15' font-weight='600' fill='#cf222e' opacity='0'>5. multiply by the learned weight w (per feature)<animate attributeName='opacity' dur='15.0s' repeatCount='indefinite' calcMode='discrete' values='0;0;0;0;1;0' keyTimes='0.0000;0.2000;0.4000;0.6000;0.8000;1.0000'/></text></svg>
