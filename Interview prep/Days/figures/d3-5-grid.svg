<text x='30' y='356' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>All programs run at the same time on the GPU's 132 SMs (H200): 1,024 programs ≈ 8 per SM. num_warps = 4 → 128 threads per program.</text>
<text x='30' y='380' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the highlight walks the grid, but on the GPU these programs run in parallel. Colour = which KV head is read.</text></svg>
