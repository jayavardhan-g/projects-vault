<text x='560' y='470' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Bigger tiles push dots right (more FLOPs per HBM byte). Past the</text>
<text x='560' y='488' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>ridge (13.9) HBM stops being the limit; the dashed shared-memory</text>
<text x='560' y='506' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>roof appears; re-plotted per SHARED byte (hollow), tiled T32 sits</text>
<text x='560' y='524' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>right on it (8.4 vs 8.64): that's the wall register blocking broke.</text>
<text x='20' y='563' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the two tiles pour into the FLOP cube (bigger tile → cube grows faster than tiles); each kernel's dot rises to its measured speed</text></svg>
