<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 420' width='960' height='420' font-family='Inter, Helvetica, Arial, sans-serif'><title>Two log segments, one follower: who changes which state</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='420' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Two log segments, one follower: who changes which state</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>Active → Sealed (matching)   Sealed → Free (follower)   Free → Active (matching)</text>

<g opacity='1'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Matching appends to segment 0 (Active). The follower trails it, replaying into its own replica book.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='80' y='150' width='137.5' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Active</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='380' y='150' width='0' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Free</text><rect x='115' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='205' y1='118' x2='205' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='115' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='205' y1='250' x2='205' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>kept by the follower</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Segment 0 fills up. append returns false.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.6'/><rect x='80' y='150' width='250.0' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Active</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='380' y='150' width='0' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Free</text><rect x='115' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='205' y1='118' x2='205' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='115' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='205' y1='250' x2='205' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>kept by the follower</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Rotate, done by MATCHING: segment 0 Active → Sealed, segment 1 Free → Active. Matching goes on at once.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='80' y='150' width='250.0' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Sealed</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.6'/><rect x='380' y='150' width='25.0' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Active</text><rect x='415' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='505.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='505' y1='118' x2='505' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='115' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='205' y1='250' x2='205' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>kept by the follower</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The follower finishes replaying segment 0 and snapshots its REPLICA. Matching copies nothing.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='80' y='150' width='250.0' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Sealed</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='380' y='150' width='87.5' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Active</text><rect x='415' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='505.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='505' y1='118' x2='505' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='115' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='205' y1='250' x2='205' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>snapshot written (tmp → fsync → rename)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Done by the FOLLOWER: the snapshot covers segment 0, so Sealed → Free. It now follows segment 1.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.6'/><rect x='80' y='150' width='0' height='60' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Free</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='380' y='150' width='150.0' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Active</text><rect x='415' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='505.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='505' y1='118' x2='505' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='415' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='505.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='505' y1='250' x2='505' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>kept by the follower</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='374' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='394' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='394' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Segment 1 fills. Matching seals it and takes segment 0 (Free → Active). Each state change has one owner.</text>
<rect x='80' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#cf222e' stroke-width='2.6'/><rect x='80' y='150' width='25.0' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1'/><text x='205' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 0: Active</text><rect x='380' y='150' width='250' height='60' rx='4' fill='#ffffff' stroke='#57606a' stroke-width='1.2'/><rect x='380' y='150' width='250.0' height='60' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1'/><text x='505' y='186' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>segment 1: Sealed</text><rect x='115' y='84' width='180' height='34' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='104.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>matching thread appends</text><line x1='205' y1='118' x2='205' y2='148' stroke='#0969da' stroke-width='1.6' marker-end='url(#ah)'/><rect x='415' y='250' width='180' height='34' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='505.0' y='270.96' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>follower replays</text><line x1='505' y1='250' x2='505' y2='212' stroke='#1a7f37' stroke-width='1.6' marker-end='url(#ah)'/><rect x='700' y='150' width='220' height='60' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='810.0' y='178.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>replica book</text><text x='810.0' y='193.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>kept by the follower</text>
</g>
</svg>