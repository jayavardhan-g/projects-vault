<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' font-family='Inter, Helvetica, Arial, sans-serif'><title>Nagle and delayed ACK</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='400' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why every response took ~43 ms: Nagle meets delayed ACK</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the server writes the headers and the body in two write() calls; TCP_NODELAY is off</text>
<text x='260' y='78' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>today: Nagle on</text>
<text x='130' y='98' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>client (k6)</text>
<text x='390' y='98' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>server</text>
<line x1='130' y1='105' x2='130' y2='370' stroke='#8c959f' stroke-width='1.5'/>
<line x1='390' y1='105' x2='390' y2='370' stroke='#8c959f' stroke-width='1.5'/>
<line x1='130' y1='120' x2='384' y2='140' stroke='#1f2328' stroke-width='2'/><path d='M384.0,140.0 L373.6,144.2 L374.4,134.2 z' fill='#1f2328'/><text x='260.0' y='124.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>GET /val?id=1234</text><circle r='5' fill='#1f2328' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0200;0.1000;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='130;130;390;390' keyTimes='0.0000;0.0200;0.1000;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='120;120;140;140' keyTimes='0.0000;0.0200;0.1000;1.0000'/></circle>
<line x1='390' y1='150' x2='136' y2='170' stroke='#0969da' stroke-width='2'/><path d='M136.0,170.0 L145.6,164.2 L146.4,174.2 z' fill='#0969da'/><text x='260.0' y='154.0' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>segment 1: headers</text><circle r='5' fill='#0969da' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.1200;0.2000;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='390;390;130;130' keyTimes='0.0000;0.1200;0.2000;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='150;150;170;170' keyTimes='0.0000;0.1200;0.2000;1.0000'/></circle>
<rect x='398' y='178' width='72' height='120' rx='6' fill='#fff1a8' stroke='#bf8700'/>
<text x='434' y='200' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>body held:</text>
<text x='434' y='216' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>headers not</text>
<text x='434' y='231' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>ACKed yet</text>
<text x='434' y='250' text-anchor='middle' font-size='11' font-weight='600' fill='#bf8700'>(Nagle)</text>
<rect x='48' y='178' width='74' height='110' rx='6' fill='#ffc9c9' stroke='#cf222e'/>
<text x='85' y='200' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>waits ~40 ms</text>
<text x='85' y='216' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>to piggyback</text>
<text x='85' y='231' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>the ACK</text>
<text x='85' y='250' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>(delayed ACK)</text>
<line x1='130' y1='290' x2='384' y2='305' stroke='#cf222e' stroke-width='2'/><path d='M384.0,305.0 L373.7,309.4 L374.3,299.4 z' fill='#cf222e'/><text x='260.0' y='291.5' text-anchor='middle' font-size='11' font-weight='600' fill='#cf222e'>ACK (timer fired)</text><circle r='5' fill='#cf222e' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.5500;0.6300;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='130;130;390;390' keyTimes='0.0000;0.5500;0.6300;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='290;290;305;305' keyTimes='0.0000;0.5500;0.6300;1.0000'/></circle>
<line x1='390' y1='315' x2='136' y2='335' stroke='#0969da' stroke-width='2'/><path d='M136.0,335.0 L145.6,329.2 L146.4,339.2 z' fill='#0969da'/><text x='260.0' y='319.0' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>segment 2: body</text><circle r='5' fill='#0969da' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.6600;0.7400;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='390;390;130;130' keyTimes='0.0000;0.6600;0.7400;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='315;315;335;335' keyTimes='0.0000;0.6600;0.7400;1.0000'/></circle>
<text x='260' y='365' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>response complete after ~43 ms</text>
<text x='690' y='78' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>with TCP_NODELAY</text>
<text x='560' y='98' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>client (k6)</text>
<text x='820' y='98' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>server</text>
<line x1='560' y1='105' x2='560' y2='370' stroke='#8c959f' stroke-width='1.5'/>
<line x1='820' y1='105' x2='820' y2='370' stroke='#8c959f' stroke-width='1.5'/>
<line x1='560' y1='120' x2='814' y2='140' stroke='#1f2328' stroke-width='2'/><path d='M814.0,140.0 L803.6,144.2 L804.4,134.2 z' fill='#1f2328'/><text x='690.0' y='124.0' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>GET /val?id=1234</text><circle r='5' fill='#1f2328' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0200;0.1000;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='560;560;820;820' keyTimes='0.0000;0.0200;0.1000;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='120;120;140;140' keyTimes='0.0000;0.0200;0.1000;1.0000'/></circle>
<line x1='820' y1='150' x2='566' y2='170' stroke='#0969da' stroke-width='2'/><path d='M566.0,170.0 L575.6,164.2 L576.4,174.2 z' fill='#0969da'/><text x='690.0' y='154.0' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>segment 1: headers</text><circle r='5' fill='#0969da' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.1200;0.2000;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='820;820;560;560' keyTimes='0.0000;0.1200;0.2000;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='150;150;170;170' keyTimes='0.0000;0.1200;0.2000;1.0000'/></circle>
<line x1='820' y1='175' x2='566' y2='195' stroke='#0969da' stroke-width='2'/><path d='M566.0,195.0 L575.6,189.2 L576.4,199.2 z' fill='#0969da'/><text x='690.0' y='179.0' text-anchor='middle' font-size='11' font-weight='600' fill='#0969da'>segment 2: body (sent at once)</text><circle r='5' fill='#0969da' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.2200;0.3000;1.0000'/><animate attributeName='cx' dur='8.0s' repeatCount='indefinite' values='820;820;560;560' keyTimes='0.0000;0.2200;0.3000;1.0000'/><animate attributeName='cy' dur='8.0s' repeatCount='indefinite' values='175;175;195;195' keyTimes='0.0000;0.2200;0.3000;1.0000'/></circle>
<text x='690' y='240' text-anchor='middle' font-size='12' font-weight='700' fill='#1a7f37'>response complete in &lt; 1 ms</text>
<text x='690' y='262' text-anchor='middle' font-size='12' font-weight='400' fill='#1f2328'>srv.set_tcp_nodelay(true)</text>
<text x='690' y='282' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>(prep pack exercise 1)</text>
<text x='20' y='392' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the dots are packets. k6's http_req_receiving (first to last byte) averages 42.7 ms: the held body.</text></svg>
