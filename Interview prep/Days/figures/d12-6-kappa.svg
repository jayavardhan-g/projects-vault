<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 360' width='860' height='360' font-family='Inter, Helvetica, Arial, sans-serif'><title>kappa</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='360' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Judge vs hand labels (n = 40): agreement and Cohen's κ</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>rows = the LLM judge, columns = the blind hand label; the diagonal is agreement</text>
<text x='196.0' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>supported</text>
<text x='288.0' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>partial</text>
<text x='380.0' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>unsupported</text>
