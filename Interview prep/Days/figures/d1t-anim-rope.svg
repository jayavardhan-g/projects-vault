<text x='410' y='292' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>barely moves: encodes long range</text>
<text x='690' y='38' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>q at position m, k at position n</text><text x='690' y='58' text-anchor='middle' font-size='12' fill='#57606a'>both shift by 1 each step; the gap stays (m − n) rad</text><circle cx='690' cy='170' r='88' fill='#f6f8fa' stroke='#d0d7de'/><line x1='594' y1='170' x2='786' y2='170' stroke='#d0d7de'/><line x1='690' y1='74' x2='690' y2='266' stroke='#d0d7de'/>
