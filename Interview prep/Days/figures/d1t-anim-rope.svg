<text x='140' y='292' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328' opacity='1'>position p = 0: angle 0 rad<animate attributeName='opacity' dur='14s' repeatCount='indefinite' calcMode='discrete' values='1;0;0;0;0;0;0;1' keyTimes='0.0000;0.1429;0.2857;0.4286;0.5714;0.7143;0.8571;1.0000'/></text>
