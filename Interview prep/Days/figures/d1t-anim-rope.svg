<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 830 360' width='830' height='360' font-family='Inter, Helvetica, Arial, sans-serif'><title>RoPE animation: rotating feature pairs</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='830' height='360' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='140' y='38' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>Pair 0 (features 0, 2)</text><text x='140' y='58' text-anchor='middle' font-size='12' fill='#57606a'>inv_freq = 1: turns 1 rad ≈ 57° per position</text><circle cx='140' cy='170' r='88' fill='#f6f8fa' stroke='#d0d7de'/><line x1='44' y1='170' x2='236' y2='170' stroke='#d0d7de'/><line x1='140' y1='74' x2='140' y2='266' stroke='#d0d7de'/>
