<text x='410' y='38' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>Pair 1 (features 1, 3)</text><text x='410' y='58' text-anchor='middle' font-size='12' fill='#57606a'>inv_freq = 0.0014: ~4,440 positions per turn</text><circle cx='410' cy='170' r='88' fill='#f6f8fa' stroke='#d0d7de'/><line x1='314' y1='170' x2='506' y2='170' stroke='#d0d7de'/><line x1='410' y1='74' x2='410' y2='266' stroke='#d0d7de'/>
