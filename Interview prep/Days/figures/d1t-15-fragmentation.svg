<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 905 292' width='905' height='292' font-family='Inter, Helvetica, Arial, sans-serif'><title>Contiguous vs paged KV cache</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='905' height='292' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='450' y='26' text-anchor='middle' font-size='15' font-weight='700' fill='#1f2328'>Same three requests, two ways to store their KV cache (48 slots of memory)</text>
<text x='450' y='46' text-anchor='middle' font-size='12' fill='#57606a'>A needs 6 slots, B needs 10, C needs 2. Solid = holds a token's K, V; pale = reserved but empty (wasted); grey = free.</text>
