<text x='410' y='240' text-anchor='middle' font-size='12' fill='#1f2328'>KV cache per token: 2 × 16 layers × 8 KV heads × 64 × 2 bytes = 32 KiB  (with 32 KV heads it would be 128 KiB)</text>
<text x='410' y='260' text-anchor='middle' font-size='12' fill='#57606a'>Toy model: 2 query heads share 1 KV head. The naive path copies each KV head with repeat_interleave;</text>
<text x='410' y='277' text-anchor='middle' font-size='12' fill='#57606a'>the Triton kernel copies nothing and just reads KV head h // 4.</text></svg>
