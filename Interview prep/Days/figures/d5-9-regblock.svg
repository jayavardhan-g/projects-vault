<rect x='380' y='70' width='490' height='250' rx='8' fill='#fbfcfd' stroke='#d0d7de' stroke-width='1'/>
<text x='396' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>kernel</text>
<text x='536' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>shared loads per k</text>
<text x='686' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>FMAs per k</text>
<text x='786' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>loads per FMA</text>
<text x='396' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>tiled 1-to-1</text>
<text x='536' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<text x='686' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='786' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2</text>
<text x='396' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>block2d, R = 2</text>
<text x='536' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>4</text>
<text x='686' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>4</text>
<text x='786' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1</text>
<text x='396' y='190' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>block2d, R = 4</text>
<text x='536' y='190' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>8</text>
<text x='686' y='190' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>16</text>
<text x='786' y='190' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0.5</text>
<text x='396' y='220' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>general R</text>
<text x='536' y='220' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2R</text>
<text x='686' y='220' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>R²</text>
<text x='786' y='220' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2 / R</text>
<text x='396' y='270' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Each register value is reused R times, so shared-memory</text>
<text x='396' y='290' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>traffic per FMA falls by R. Cost: R² accumulators per thread</text>
<text x='396' y='310' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>(62 registers at R = 4), so fewer threads fit: 50% occupancy.</text>
<text x='20' y='368' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: row i of the patch uses av[i] (red) with the whole bv row (blue)</text></svg>
