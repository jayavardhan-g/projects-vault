<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0400;0.2000;1.0000'/><rect x='36' y='455' width='330' height='38' fill='#ffffff'/><rect x='32' y='455' width='4' height='36' rx='2' fill='#0969da'/><text x='40' y='470' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>1. the grid tiles C</text><text x='56' y='486' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>blockIdx.y = tile row, blockIdx.x = tile column</text></g>
<text x='40' y='510' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>2. one block = one 64 × 64 tile</text><text x='56' y='526' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>rowBase = by·64 + ty·4, colBase = bx·64 + tx·4</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.2000;0.4500;1.0000'/><rect x='36' y='495' width='330' height='38' fill='#ffffff'/><rect x='32' y='495' width='4' height='36' rx='2' fill='#0969da'/><text x='40' y='510' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>2. one block = one 64 × 64 tile</text><text x='56' y='526' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>rowBase = by·64 + ty·4, colBase = bx·64 + tx·4</text></g>
<text x='40' y='550' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>3. one thread = a 4 × 4 patch</text><text x='56' y='566' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>16 accumulators in registers, written once at the end</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.4500;0.9800;1.0000'/><rect x='36' y='535' width='330' height='38' fill='#ffffff'/><rect x='32' y='535' width='4' height='36' rx='2' fill='#0969da'/><text x='40' y='550' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>3. one thread = a 4 × 4 patch</text><text x='56' y='566' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>16 accumulators in registers, written once at the end</text></g>
<text x='400' y='470' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>The simpler kernels use dim3(32, 32) threads</text><text x='400' y='488' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>and one output per thread: 1024 × 1024 blocks.</text>
<text x='400' y='512' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Same C, different ownership: that choice</text><text x='400' y='530' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>decides every load pattern that follows.</text>
<text x='20' y='588' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: zoom from the whole grid to one block, then to one thread's 4 × 4 patch</text></svg>
