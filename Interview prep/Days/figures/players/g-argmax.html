<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>argmax</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 235' font-family='Inter, Helvetica, Arial, sans-serif'><title>argmax</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='640' height='235' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>x.argmax(dim=-1): the INDEX of the largest value</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>greedy decoding picks token id 1 here</text>
<text x='122.0' y='99' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>logits</text>
<rect x='30' y='107' width='184' height='52' rx='7' fill='none' stroke='#6e7781' stroke-width='1.3'/>
<rect x='35' y='112' width='42' height='42' rx='4' fill='#ffd8b5' stroke='#ffffff'/>
<text x='56.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.1</text>
<rect x='79' y='112' width='42' height='42' rx='4' fill='#c8e1ff' stroke='#ffffff'/>
<text x='100.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>2.1</text>
<rect x='123' y='112' width='42' height='42' rx='4' fill='#c7f0d2' stroke='#ffffff'/>
<text x='144.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.6</text>
<rect x='167' y='112' width='42' height='42' rx='4' fill='#f5c6e9' stroke='#ffffff'/>
<text x='188.0' y='137.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>1.9</text>

<text x='100' y='168' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>id 1</text>
<text x='144' y='168' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>id 2</text>
<text x='188' y='168' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>id 3</text>
<text x='30' y='190' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>[4]: one score per token id</text>
<line x1='230' y1='128' x2='354' y2='128' stroke='#57606a' stroke-width='2' marker-end='url(#ah)'/><text x='295.0' y='119' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>argmax()</text>
<rect x='380' y='108' width='120' height='40' rx='8' fill='#c8e1ff' stroke='#1f2328'/><text x='440' y='133' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>1 (not 2.1)</text>

<rect x='76' y='109' width='48' height='48' rx='6' fill='none' stroke='#0969da' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.2100;0.3500;1.0000'/></rect>
<rect x='120' y='109' width='48' height='48' rx='6' fill='none' stroke='#0969da' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.3600;0.5000;1.0000'/></rect>
<rect x='164' y='109' width='48' height='48' rx='6' fill='none' stroke='#0969da' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.5100;0.6500;1.0000'/></rect>
<rect x='76' y='109' width='48' height='48' rx='6' fill='none' stroke='#cf222e' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.7000;0.9800;1.0000'/></rect>
<rect x='378' y='106' width='124' height='44' rx='4' fill='#ffffff' opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;0.85;0;0' keyTimes='0.0000;0.0400;0.7000;1.0000'/></rect>
<text x='20' y='221' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: scan every value, keep the position of the best. .max() would return 2.1 itself</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=7.0, steps=[0.0, 0.28, 1.4, 2.45, 3.5, 4.55, 4.9, 6.86], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
