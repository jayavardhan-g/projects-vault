:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}

<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Both barriers present. Each warp loads its half of tile t; warp 1 is slower (its loads missed in cache).</text>

</g>

e-dasharray='5 3'/><text x='438.0' y='206' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>__syncthreads</text><line x1='532.5' y1='70' x2='532.5' y2='196' stroke='#0969da' stroke-width='1.5'/><text x='532.5' y='66' text-anchor='middle' font-size='10' font-weight='700' fill='#0969da'>now</text><rect x='660' y='100' width='260' height='40' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='790.0' y='124.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>rows from warp 0: tile t+1</text><rect x='660' y='150' width='260' height='40' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='790.0' y='174.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>rows from warp 1: tile t+1</text><rect x='40' y='236' width='880' height='40' rx='4' fill='#c7f0d2' stroke='#1a7f37' stroke-width='2'/><text x='480.0' y='260.32' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>Cost of the two barriers: the fast warp idles (grey). That idle time is why later kernels double-buffer.</text>

<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=30.8, steps=[0.0, 4.401, 8.8, 13.201, 17.599, 22.0, 26.399], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
