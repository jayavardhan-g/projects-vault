<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online softmax trace</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 420' font-family='Inter, Helvetica, Arial, sans-serif'><title>Online softmax trace</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Online softmax on 4 scores, in 2 chunks of 2</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>scores s = [2, 4, 1, 3], values v = [[1,0], [0,1], [1,1], [2,0]]; keep only m (max), l (sum) and acc (weighted sum)</text>
<rect x='120' y='70' width='62' height='34' rx='4' fill='#ffd8b5' stroke='#ffffff'/><text x='151.0' y='91.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>s=2</text>
<rect x='120' y='108' width='62' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='151.0' y='127.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>v=[1,0]</text>
<rect x='190' y='70' width='62' height='34' rx='4' fill='#ffd8b5' stroke='#ffffff'/><text x='221.0' y='91.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>s=4</text>
<rect x='190' y='108' width='62' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='221.0' y='127.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>v=[0,1]</text>
<rect x='290' y='70' width='62' height='34' rx='4' fill='#c8e1ff' stroke='#ffffff'/><text x='321.0' y='91.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>s=1</text>
<rect x='290' y='108' width='62' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='321.0' y='127.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>v=[1,1]</text>
<rect x='360' y='70' width='62' height='34' rx='4' fill='#c8e1ff' stroke='#ffffff'/><text x='391.0' y='91.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>s=3</text>
<rect x='360' y='108' width='62' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='391.0' y='127.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>v=[2,0]</text>
<text x='186' y='160' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>chunk 0</text>
<text x='356' y='160' text-anchor='middle' font-size='12' font-weight='700' fill='#0969da'>chunk 1</text>
<text x='250' y='180' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>start</text>
<text x='420' y='180' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>after chunk 0</text>
<text x='660' y='180' text-anchor='middle' font-size='11' font-weight='600' fill='#57606a'>after chunk 1</text>
<text x='20' y='213' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>m (running max)</text>
<rect x='205' y='192' width='90' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='250.0' y='211.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>−∞</text>
<rect x='310' y='192' width='220' height='30' rx='4' fill='#fff8c5' stroke='#ffffff'/><text x='420.0' y='211.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>max(−∞, 4) = 4</text>
<rect x='545' y='192' width='230' height='30' rx='4' fill='#ddf4ff' stroke='#ffffff'/><text x='660.0' y='211.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>max(4, 3) = 4</text>
<text x='20' y='249' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>alpha = e^(m_old − m_new)</text>
<rect x='205' y='228' width='90' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='250.0' y='247.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'></text>
<rect x='310' y='228' width='220' height='30' rx='4' fill='#fff8c5' stroke='#ffffff'/><text x='420.0' y='247.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>e^(−∞) = 0</text>
<rect x='545' y='228' width='230' height='30' rx='4' fill='#ddf4ff' stroke='#ffffff'/><text x='660.0' y='247.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>e^(4 − 4) = 1</text>
<text x='20' y='285' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>p = e^(s − m_new)</text>
<rect x='205' y='264' width='90' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='250.0' y='283.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'></text>
<rect x='310' y='264' width='220' height='30' rx='4' fill='#fff8c5' stroke='#ffffff'/><text x='420.0' y='283.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>e^−2, e^0 = 0.135, 1</text>
<rect x='545' y='264' width='230' height='30' rx='4' fill='#ddf4ff' stroke='#ffffff'/><text x='660.0' y='283.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>e^−3, e^−1 = 0.050, 0.368</text>
<text x='20' y='321' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>l = l·alpha + Σp</text>
<rect x='205' y='300' width='90' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='250.0' y='319.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0</text>
<rect x='310' y='300' width='220' height='30' rx='4' fill='#fff8c5' stroke='#ffffff'/><text x='420.0' y='319.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0·0 + 1.135 = 1.135</text>
<rect x='545' y='300' width='230' height='30' rx='4' fill='#ddf4ff' stroke='#ffffff'/><text x='660.0' y='319.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>1.135·1 + 0.418 = 1.553</text>
<text x='20' y='357' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>acc = acc·alpha + Σ p·v</text>
<rect x='205' y='336' width='90' height='30' rx='4' fill='#f6f8fa' stroke='#ffffff'/><text x='250.0' y='355.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>[0, 0]</text>
<rect x='310' y='336' width='220' height='30' rx='4' fill='#fff8c5' stroke='#ffffff'/><text x='420.0' y='355.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>[0.135, 1.000]</text>
<rect x='545' y='336' width='230' height='30' rx='4' fill='#ddf4ff' stroke='#ffffff'/><text x='660.0' y='355.0' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>[0.921, 1.050]</text>
<rect x='305' y='188' width='230' height='186' rx='6' fill='none' stroke='#cf222e' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0800;0.4500;1.0000'/></rect>
<rect x='540' y='188' width='240' height='186' rx='6' fill='none' stroke='#cf222e' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.4800;0.8500;1.0000'/></rect>
<rect x='116' y='66' width='144' height='76' rx='6' fill='none' stroke='#0969da' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0800;0.4500;1.0000'/></rect>
<rect x='286' y='66' width='144' height='76' rx='6' fill='none' stroke='#0969da' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.4800;0.8500;1.0000'/></rect>
<text x='20' y='400' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>output = acc / l = [0.921, 1.050] / 1.553 = [0.593, 0.676] — exactly softmax(s) @ v. Exact weights: [0.087, 0.644, 0.032, 0.237].</text>
<text x='610' y='100' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>a chunk = a tile of 128</text>
<text x='610' y='116' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>tokens in the kernel</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=8.0, steps=[0.0, 0.64, 3.6, 3.84, 6.8], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
