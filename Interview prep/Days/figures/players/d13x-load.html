<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>load = take a snapshot; store = write it back</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' font-family='Inter, Helvetica, Arial, sans-serif'><title>load = take a snapshot; store = write it back</title>

<rect x='0' y='0' width='960' height='330' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>load = take a snapshot; store = write it back</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>const size_t head = head_.load(...): one read of the shared counter, then work on the private copy</text>

<g opacity='1'><animate attributeName='opacity' dur='17.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2500;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/4</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Before line 28. head_ lives in memory where both threads can reach it. The local does not exist yet.</text>
<rect x='40' y='100' width='300' height='70' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='190.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head_ = 4</text><text x='190.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>shared: std::atomic&lt;size_t&gt;, in memory</text><rect x='620' y='100' width='300' height='70' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='770.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head = ?</text><text x='770.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>local: const size_t, in a register</text><text x='40' y='220' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='17.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2500;0.5000;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/4</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Line 28: head_.load(...) reads memory once and the result is kept in the local head.</text>
<rect x='40' y='100' width='300' height='70' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='190.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head_ = 4</text><text x='190.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>shared: std::atomic&lt;size_t&gt;, in memory</text><rect x='620' y='100' width='300' height='70' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='770.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head = 4</text><text x='770.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>local: const size_t, in a register</text><line x1='342' y1='135' x2='618' y2='135' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='480' y='124' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>.load() copies the value</text><text x='40' y='220' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='17.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.7500;1'/>
<rect x='20' y='284' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/4</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Lines 29, 31, 33, 34 all use the LOCAL head. Same value every time, and no more trips to shared memory.</text>
<rect x='40' y='100' width='300' height='70' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='190.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head_ = 4</text><text x='190.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>shared: std::atomic&lt;size_t&gt;, in memory</text><rect x='620' y='100' width='300' height='70' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='770.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head = 4</text><text x='770.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>local: const size_t, in a register</text><text x='40' y='220' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'>used by: head − tail_cache_ (29, 31)   head &amp; (Capacity − 1) (33)   head + 1 (34)</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='17.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.7500;1'/>

<text x='32' y='304' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/4</text>
<text x='72' y='304' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Line 34: head_.store(head + 1) writes 5 into the shared variable. The local is const: it stays 4.</text>
<rect x='40' y='100' width='300' height='70' rx='4' fill='#c8e1ff' stroke='#cf222e' stroke-width='2.4'/><text x='190.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head_ = 5</text><text x='190.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>shared: std::atomic&lt;size_t&gt;, in memory</text><rect x='620' y='100' width='300' height='70' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='770.0' y='133.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>head = 4</text><text x='770.0' y='150.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>local: const size_t, in a register</text><line x1='618' y1='150' x2='342' y2='150' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='480' y='172' text-anchor='middle' font-size='12' font-weight='700' fill='#cf222e'>.store(head + 1) writes back</text><text x='40' y='220' text-anchor='start' font-size='13' font-weight='600' fill='#1f2328'></text>
</g>
</svg></div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=17.6, steps=[0.0, 4.4, 8.8, 13.2], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
