<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 445' font-family='Inter, Helvetica, Arial, sans-serif'><title>LoRA</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='445' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>LoRA on one projection: frozen W plus a thin detour B·A</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>q_proj of Qwen2.5-0.5B: W is 896 × 896; r = 16; output = W x + (α / r) · B (A x), α / r = 32 / 16 = 2</text>
<rect x='30' y='190' width='90' height='50' rx='8' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.5'/><text x='75.0' y='209.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>x</text><text x='75.0' y='228.0' text-anchor='middle' font-size='11' fill='#57606a'>[896]</text>
<rect x='200' y='80' width='150' height='150' rx='6' fill='#eef1f4' stroke='#8c959f'/>
<text x='275' y='150' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>W (frozen)</text><text x='275' y='170' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>896 × 896</text><text x='275' y='188' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>802,816 numbers</text>
<rect x='200' y='275' width='150' height='16' rx='3' fill='#ffd8b5' stroke='#bf8700'/><text x='275' y='309' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>A: 16 × 896 (trained)</text>

<rect x='380' y='205' width='60' height='36' rx='8' fill='#ffd8b5' stroke='#d0d7de' stroke-width='1.5'/><text x='410.0' y='217.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>A x</text><text x='410.0' y='236.0' text-anchor='middle' font-size='11' fill='#57606a'>[16]</text>
<line x1='120.0' y1='205.0' x2='198.0' y2='160.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/><line x1='120.0' y1='225.0' x2='198.0' y2='283.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/>
<line x1='352.0' y1='283.0' x2='410.0' y2='241.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/>
<line x1='440.0' y1='232.0' x2='461.0' y2='253.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/><line x1='473.0' y1='300.0' x2='518.0' y2='300.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/>
<rect x='520' y='280' width='90' height='40' rx='8' fill='#fff1a8' stroke='#d0d7de' stroke-width='1.5'/><text x='565.0' y='305.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>× α/r = 2</text>
<rect x='520' y='135' width='90' height='40' rx='8' fill='#eef1f4' stroke='#d0d7de' stroke-width='1.5'/><text x='565.0' y='149.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>W x</text><text x='565.0' y='168.0' text-anchor='middle' font-size='11' fill='#57606a'>[896]</text>
<line x1='352.0' y1='155.0' x2='518.0' y2='155.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/>
<circle cx='680' cy='225' r='20' fill='#ffffff' stroke='#1f2328'/><text x='680' y='231' text-anchor='middle' font-size='20' font-weight='700' fill='#1f2328'>+</text>
<line x1='610.0' y1='155.0' x2='666.0' y2='212.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/><line x1='610.0' y1='300.0' x2='666.0' y2='238.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/>
<line x1='700.0' y1='225.0' x2='760.0' y2='225.0' stroke='#57606a' stroke-width='1.5' marker-end='url(#ah)'/><rect x='760' y='205' width='110' height='40' rx='8' fill='#c7f0d2' stroke='#d0d7de' stroke-width='1.5'/><text x='815.0' y='219.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>h</text><text x='815.0' y='238.0' text-anchor='middle' font-size='11' fill='#57606a'>[896]</text>
<text x='30' y='405' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>trainable here: A + B = 16 · 896 + 896 · 16 = 28,672 numbers (3.6% of W's 802,816)</text>
<g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0.0000;0.0500;0.9700'/><animateTransform attributeName='transform' type='translate' dur='7.0s' repeatCount='indefinite' values='75.0,215.0;275.0,155.0;565.0,155.0;680.0,225.0;815.0,225.0;815.0,225.0' keyTimes='0.0000;0.1500;0.2500;0.3500;0.4500;1'/><circle r='6' fill='#8c959f' stroke='#1f2328' stroke-width='1.5'/></g>
<g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0.0000;0.5000;0.9700'/><animateTransform attributeName='transform' type='translate' dur='7.0s' repeatCount='indefinite' values='75.0,215.0;275.0,283.0;410.0,223.0;463.0,300.0;565.0,300.0;680.0,225.0;815.0,225.0;815.0,225.0' keyTimes='0.0000;0.5750;0.6500;0.7250;0.8000;0.8750;0.9500;1'/><circle r='6' fill='#bf8700' stroke='#1f2328' stroke-width='1.5'/></g>
<text x='20' y='431' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: grey = the frozen path, amber = the low-rank detour; at step 0, B = 0 so the detour adds nothing</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=7.0, steps=[0.0, 0.35, 3.5, 6.79], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
