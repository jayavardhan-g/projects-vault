<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>mmap: the kernel makes a range of the process's addresses refer to the pages of the log file.</text>

<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>

<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>records_[2] = c is an ordinary 40-byte memory write. It lands straight in the kernel's page. No system call.</text>
<rect x='30' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='46' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the engine process</text><rect x='335' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='351' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the kernel: page cache (RAM)</text><rect x='640' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='656' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the disk</text><rect x='50' y='120' width='250' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='175.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>records_[2] = c</text><text x='175.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>a plain memory store</text><rect x='50' y='196' width='250' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='175.0' y='219.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>the order book</text><text x='175.0' y='234.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>ordinary process memory</text><rect x='355' y='120' width='250' height='60' rx='4' fill='#c8e1ff' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>file page: [r0, r1, c]</text><text x='480.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>DIRTY: newer than the disk</text><rect x='660' y='120' width='250' height='60' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>wal file: [r0, r1]</text><text x='785.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>not written yet</text><line x1='302' y1='150' x2='353' y2='150' stroke='#0969da' stroke-width='2' stroke-dasharray='4 3'/><text x='328' y='142' text-anchor='middle' font-size='9' font-weight='600' fill='#0969da'>same page</text><text x='40' y='312' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>compare: write() would copy the bytes into the kernel through a system call, every record</text>
</g>

<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The kernel writes dirty pages to disk later, on its own schedule (typically within seconds).</text>

shed by the kernel</text><line x1='302' y1='150' x2='353' y2='150' stroke='#0969da' stroke-width='2' stroke-dasharray='4 3'/><text x='328' y='142' text-anchor='middle' font-size='9' font-weight='600' fill='#0969da'>same page</text><line x1='607' y1='150' x2='658' y2='150' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='40' y='312' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>

<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>kill -9 before the flush: the process and its book vanish. The dirty page belongs to the KERNEL, so it survives.</text>
<rect x='30' y='78' width='290' height='190' rx='8' fill='#eaeef2' stroke='#d0d7de' stroke-width='1' stroke-dasharray='6 4'/><text x='46' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the engine process  (killed)</text><rect x='335' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='351' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the kernel: page cache (RAM)</text><rect x='640' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='656' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the disk</text><rect x='355' y='120' width='250' height='60' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>file page: [r0, r1, c]</text><text x='480.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>still dirty, still there</text><rect x='660' y='120' width='250' height='60' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='785.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>wal file: [r0, r1, c]</text><text x='785.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>the kernel flushes it anyway</text><line x1='607' y1='150' x2='658' y2='150' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='40' y='312' text-anchor='start' font-size='13' font-weight='700' fill='#1a7f37'>the record reaches the disk → recovery can replay it ✓</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='33.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='394' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Power cut before the flush: all RAM is gone, the page cache with it. The disk never got the record.</text>
<rect x='30' y='78' width='290' height='190' rx='8' fill='#eaeef2' stroke='#d0d7de' stroke-width='1' stroke-dasharray='6 4'/><text x='46' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the engine process  (killed)</text><rect x='335' y='78' width='290' height='190' rx='8' fill='#eaeef2' stroke='#d0d7de' stroke-width='1' stroke-dasharray='6 4'/><text x='351' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the kernel: page cache (RAM)  (lost)</text><rect x='640' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='656' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the disk</text><rect x='660' y='120' width='250' height='60' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>wal file: [r0, r1]</text><text x='785.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>c was never written</text><text x='40' y='312' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>the record is lost ✗   only msync / fsync (force the flush and wait) protect against this</text>
</g>

<text x='32' y='414' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='414' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>This engine calls msync only at the end of a run. So the honest claim is: recovery from PROCESS crashes.</text>
<rect x='30' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='46' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the engine process</text><rect x='335' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='351' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the kernel: page cache (RAM)</text><rect x='640' y='78' width='290' height='190' rx='8' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/><text x='656' y='100' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>the disk</text><rect x='50' y='120' width='250' height='60' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='175.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>records_[n] = c</text><text x='175.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>fast: no syscall per record</text><rect x='50' y='196' width='250' height='50' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='175.0' y='219.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>the order book</text><text x='175.0' y='234.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>ordinary process memory</text><rect x='355' y='120' width='250' height='60' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>dirty pages</text><text x='480.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>flushed later by the kernel</text><rect x='660' y='120' width='250' height='60' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='785.0' y='148.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>wal file</text><text x='785.0' y='163.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>may lag behind by seconds</text><line x1='302' y1='150' x2='353' y2='150' stroke='#0969da' stroke-width='2' stroke-dasharray='4 3'/><text x='328' y='142' text-anchor='middle' font-size='9' font-weight='600' fill='#0969da'>same page</text><text x='40' y='312' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>survives kill -9 and segfaults; does not promise anything after a power cut or kernel crash</text>
</g>

<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=33.0, steps=[0.0, 5.501, 10.999, 16.5, 22.001, 27.499], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
