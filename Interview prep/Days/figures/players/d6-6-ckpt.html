<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>checkpointing memory</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>

<text x='220' y='80' text-anchor='middle' font-size='13' font-weight='700' fill='#1f2328'>baseline: keep all 7</text>

<text x='220' y='155.19999999999996' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>A3  64</text>

<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.2800;0.5200;1.0000'/><rect x='470' y='244.8' width='180' height='82.2' rx='3' fill='#c8e1ff' stroke='#cf222e' stroke-width='2'/><text x='560' y='290.4' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>128 MiB in use</text><text x='560' y='404' text-anchor='middle' font-size='12' font-weight='600' fill='#cf222e'>forward 3: z3 a3 (overwrites)</text></g>
<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.5200;0.7600;1.0000'/><rect x='470' y='244.8' width='180' height='82.2' rx='3' fill='#c8e1ff' stroke='#cf222e' stroke-width='2'/><text x='560' y='290.4' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>128 MiB in use</text><text x='560' y='404' text-anchor='middle' font-size='12' font-weight='600' fill='#cf222e'>backward: rebuild z3 a3 from A2</text></g>
<g opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.7600;1.0000;1.0000'/><rect x='470' y='203.2' width='180' height='123.80000000000001' rx='3' fill='#ffd8b5' stroke='#cf222e' stroke-width='2'/><text x='560' y='269.6' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>192 MiB in use</text><text x='560' y='404' text-anchor='middle' font-size='12' font-weight='600' fill='#cf222e'>backward: rebuild z1 a1 z2 from X</text></g>
<text x='690' y='130' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>arena = max(</text>
<text x='690' y='148' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>  2·n3 = 128,</text>
<text x='690' y='166' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>  2·n1 + n2 = 192) MiB</text>
<text x='690' y='200' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>activations: 400 → 272</text>

<text x='690' y='248' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>whole step: 962 → 834</text>
<text x='690' y='266' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>(−128 MiB = −13.3%)</text>
<text x='690' y='296' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>cost: backward 136.1 →</text>
<text x='690' y='314' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>171.7 ms (+26%)</text>
<text x='20' y='438' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: what the one arena holds in each phase. Five separate buffers instead would total 400 again: the 0 MB bug</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=8.0, steps=[0.0, 2.24, 4.16, 6.08], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
