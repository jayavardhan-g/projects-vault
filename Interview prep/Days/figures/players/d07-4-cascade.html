<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>cascade latency</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 330' font-family='Inter, Helvetica, Arial, sans-serif'><title>cascade latency</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='880' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Time to first audio: a cascade adds up its stages</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>illustrative stage costs (prep pack exercise 5), not measurements</text>
<rect x='40.0' y='95' width='250.0' height='40' fill='#ffd8b5' stroke='#ffffff' stroke-width='2'/>
<text x='165.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>500</text>
<text x='165.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>wait for end of speech</text>
<rect x='290.0' y='95' width='50.0' height='40' fill='#c8e1ff' stroke='#ffffff' stroke-width='2'/>
<text x='315.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>100</text>
<text x='315.0' y='168' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>ASR finalise</text>
<rect x='340.0' y='95' width='150.0' height='40' fill='#c7f0d2' stroke='#ffffff' stroke-width='2'/>
<text x='415.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>300</text>
<text x='415.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>LLM first token</text>
<rect x='490.0' y='95' width='150.0' height='40' fill='#f5c6e9' stroke='#ffffff' stroke-width='2'/>
<text x='565.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>300</text>
<text x='565.0' y='168' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>first clause, 10 tok</text>
<rect x='640.0' y='95' width='100.0' height='40' fill='#fff1a8' stroke='#ffffff' stroke-width='2'/>
<text x='690.0' y='120' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>200</text>
<text x='690.0' y='153' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>TTS first chunk</text>
<text x='750.0' y='120' text-anchor='start' font-size='14' font-weight='700' fill='#cf222e'>= 1,400 ms</text>
<rect x='40' y='195' width='100.0' height='26' fill='#1a7f37' fill-opacity='0.3' stroke='#1a7f37'/><text x='148.0' y='213' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>human turn gap ≈ 200 ms</text>
<rect x='40' y='231' width='160.0' height='26' fill='#0969da' fill-opacity='0.25' stroke='#0969da'/><text x='208.0' y='249' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>GPT-4o audio ≈ 320 ms average (vendor number)</text>
<text x='40' y='291' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Errors compound too: at 10% WER a 20-word question is fully right 0.9²⁰ ≈ 12% of the time (independence sketch).</text>
<g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0.0000;0.0500;0.9700'/><animateTransform attributeName='transform' type='translate' dur='7.0s' repeatCount='indefinite' values='40.0,115.0;290.0,115.0;340.0,115.0;490.0,115.0;640.0,115.0;740.0,115.0;740.0,115.0' keyTimes='0.0000;0.2100;0.3700;0.5300;0.6900;0.8500;1'/><circle r='7' fill='#cf222e' stroke='#1f2328' stroke-width='1.5'/></g>
<text x='20' y='316' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the red dot is the clock; nothing plays until it reaches the end of the last box</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=7.0, steps=[0.0, 0.35, 6.79], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
