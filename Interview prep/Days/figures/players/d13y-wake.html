<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeping on a lock vs spinning on a ring</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' font-family='Inter, Helvetica, Arial, sans-serif'><title>Sleeping on a lock vs spinning on a ring</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='430' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Sleeping on a lock vs spinning on a ring</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>the same handoff of one command, done two ways</text>

<g opacity='1'><animate attributeName='opacity' dur='22.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.2500;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/4</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>No commands yet. The naive consumer goes to SLEEP (the OS takes it off its core). The ring's consumer keeps looping.</text>
<text x='40' y='88' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>naive engine: mutex + condition variable queue</text><rect x='40' y='96' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: idle</text><text x='165.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='127' x2='346' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='96' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='131.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>queue: empty</text><line x1='584' y1='127' x2='636' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='96' width='280' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: asleep</text><text x='780.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>waiting on a condition variable</text><text x='40' y='218' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>this engine: SPSC ring, the consumer spins</text><rect x='40' y='226' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: idle</text><text x='165.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='257' x2='346' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='226' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='261.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>ring: empty</text><line x1='584' y1='257' x2='636' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='226' width='280' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: running</text><text x='780.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>pop() → false, pause, try again</text><text x='40' y='334' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='22.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.2500;0.5000;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/4</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>A command arrives on both. Naive: lock, push, unlock, notify. Ring: write the slot, store head_.</text>
<text x='40' y='88' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>naive engine: mutex + condition variable queue</text><rect x='40' y='96' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: lock, push, notify</text><text x='165.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>a system call wakes the sleeper</text><line x1='294' y1='127' x2='346' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='96' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='131.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>queue: 1 command</text><line x1='584' y1='127' x2='636' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='96' width='280' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: still asleep</text><text x='780.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><text x='40' y='218' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>this engine: SPSC ring, the consumer spins</text><rect x='40' y='226' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: slot = c; head_ = 1</text><text x='165.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>two plain memory writes</text><line x1='294' y1='257' x2='346' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='226' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='261.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>ring: 1 command</text><line x1='584' y1='257' x2='636' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='226' width='280' height='62' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='780.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: running</text><text x='780.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>its next pop() sees head_ = 1</text><text x='40' y='334' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='22.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.7500;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/4</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The OS must now wake the sleeper: mark it runnable, pick a core, switch to it. The spinner is already working.</text>
<text x='40' y='88' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>naive engine: mutex + condition variable queue</text><rect x='40' y='96' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: done</text><text x='165.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='127' x2='346' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='96' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='131.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>queue: 1 command</text><line x1='584' y1='127' x2='636' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='96' width='280' height='62' rx='4' fill='#fff1a8' stroke='#cf222e' stroke-width='2.4'/><text x='780.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: waking up…</text><text x='780.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>scheduler + context switch</text><text x='40' y='218' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>this engine: SPSC ring, the consumer spins</text><rect x='40' y='226' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: done</text><text x='165.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='257' x2='346' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='226' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='261.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>ring: empty</text><line x1='584' y1='257' x2='636' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='226' width='280' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: applying the command</text><text x='780.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>log, then match</text><text x='40' y='334' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>a wake-up costs microseconds; one more trip round a spin loop costs nanoseconds</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='22.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.7500;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/4</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Only now does the naive consumer run. The docs blame most of the naive engine's 2.2 ms p99 on this sleep and wake.</text>
<text x='40' y='88' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>naive engine: mutex + condition variable queue</text><rect x='40' y='96' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: done</text><text x='165.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='127' x2='346' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='96' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='131.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>queue: empty</text><line x1='584' y1='127' x2='636' y2='127' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='96' width='280' height='62' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='125.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: applying the command</text><text x='780.0' y='140.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>much later</text><text x='40' y='218' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>this engine: SPSC ring, the consumer spins</text><rect x='40' y='226' width='250' height='62' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='165.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>producer: done</text><text x='165.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'></text><line x1='294' y1='257' x2='346' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='350' y='226' width='230' height='62' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='465.0' y='261.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>ring: empty</text><line x1='584' y1='257' x2='636' y2='257' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='640' y='226' width='280' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='780.0' y='255.0' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>consumer: spinning again</text><text x='780.0' y='270.0' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>ready for the next one</text><text x='40' y='334' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>the price of spinning: one core runs at 100% even when there is no work</text>
</g>
</svg></div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=22.0, steps=[0.0, 5.5, 11.0, 16.5], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
