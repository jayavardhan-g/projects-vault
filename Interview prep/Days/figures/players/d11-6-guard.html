<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>guard ladder</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 330' font-family='Inter, Helvetica, Arial, sans-serif'><title>guard ladder</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='820' height='330' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='m-ink' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1f2328'/></marker><marker id='m-muted' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#57606a'/></marker><marker id='m-red' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#cf222e'/></marker><marker id='m-blue' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#0969da'/></marker><marker id='m-green' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1a7f37'/></marker><marker id='m-amber' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#bf8700'/></marker><marker id='m-grey' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#8c959f'/></marker></defs><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>The guard: back off the strength until the text stays fluent</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>ratio = ppl(steered text) ÷ ppl(baseline text), both scored by the UNsteered model (illustrative values)</text>
<line x1='100' y1='270' x2='710' y2='270' stroke='#57606a'/>
<text x='94' y='274' text-anchor='end' font-size='10' font-weight='400' fill='#57606a'>0×</text>
<text x='94' y='184' text-anchor='end' font-size='10' font-weight='400' fill='#57606a'>1×</text>
<text x='94' y='94' text-anchor='end' font-size='10' font-weight='400' fill='#57606a'>2×</text>
<rect x='140' y='90.0' width='70' height='180.0' rx='4' fill='#ffd8b5' stroke='#cf222e' stroke-width='1.5'/>
<text x='175' y='82.0' text-anchor='middle' font-size='11' font-weight='700' fill='#cf222e'>2.0× ✗ too high</text>
<rect x='136' y='64.0' width='78' height='210.0' rx='6' fill='none' stroke='#1f2328' stroke-width='2' opacity='0'><animate attributeName='opacity' dur='6.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1;0.43000000000000005;1'/></rect>
<text x='175' y='288' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>rung: vec × 1.0</text>
<rect x='285' y='135.0' width='70' height='135.0' rx='4' fill='#c7f0d2' stroke='#1a7f37' stroke-width='1.5'/>
<text x='320' y='127.0' text-anchor='middle' font-size='11' font-weight='700' fill='#1a7f37'>1.5× ✓ accept</text>
<rect x='281' y='109.0' width='78' height='165.0' rx='6' fill='none' stroke='#1f2328' stroke-width='2' opacity='0'><animate attributeName='opacity' dur='6.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.44999999999999996;0.78;1'/></rect>
<text x='320' y='288' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>rung: vec × 0.75</text>
<rect x='430' y='230' width='70' height='40' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-dasharray='4 3'/>
<text x='465' y='254' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>not tried</text>
<text x='465' y='288' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>rung: vec × 0.5</text>
<rect x='575' y='230' width='70' height='40' rx='4' fill='#f6f8fa' stroke='#d0d7de' stroke-dasharray='4 3'/>
<text x='610' y='254' text-anchor='middle' font-size='10' font-weight='400' fill='#57606a'>not tried</text>
<text x='610' y='288' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>rung: vec × 0.25</text>
<line x1='100' y1='112.5' x2='710' y2='112.5' stroke='#bf8700' stroke-width='2' stroke-dasharray='6 4'/>
<text x='712' y='106.5' text-anchor='end' font-size='11' font-weight='700' fill='#bf8700'>1.75×</text>
<text x='20' y='318' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>baseline ppl 5.66; rung 1.0 → 11.31 (2.0×) rejected; rung 0.75 → 8.49 (1.5×) accepted. All 4 fail → return the baseline</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=6.0, steps=[0.0, 0.6, 2.58, 4.68], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
