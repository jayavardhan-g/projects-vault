<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why only one thread may change the book</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>

<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Why only one thread may change the book</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>a "lost update": two threads read, change and write the same number</text>

<g opacity='1'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>

<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Imagine TWO matching threads. Both want to trade against the same resting order S1, which has 40 shares.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 40</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>thread A: a buyer wants 30</text><text x='560' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>thread B: another buyer wants 20</text><rect x='40' y='186' width='360' height='62' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='220.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>has read nothing yet</text><text x='220.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><rect x='560' y='186' width='360' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='740.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>has read nothing yet</text><text x='740.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>

<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Thread A reads S1.qty and gets 40. It keeps that number in its own register.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 40</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>thread A: a buyer wants 30</text><text x='560' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>thread B: another buyer wants 20</text><rect x='40' y='186' width='360' height='62' rx='4' fill='#c8e1ff' stroke='#cf222e' stroke-width='2.4'/><text x='220.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>my copy: 40</text><text x='220.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>x = S1.qty</text><rect x='560' y='186' width='360' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='740.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>has read nothing yet</text><text x='740.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Before A writes anything back, thread B reads S1.qty too. It also gets 40.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 40</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>thread A: a buyer wants 30</text><text x='560' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>thread B: another buyer wants 20</text><rect x='40' y='186' width='360' height='62' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='220.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>my copy: 40</text><text x='220.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><rect x='560' y='186' width='360' height='62' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='740.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>my copy: 40</text><text x='740.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>x = S1.qty</text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>A fills its 30 and writes back 40 − 30 = 10.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 10</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>thread A: a buyer wants 30</text><text x='560' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>thread B: another buyer wants 20</text><rect x='40' y='186' width='360' height='62' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='220.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>writes 10</text><text x='220.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>S1.qty = 40 − 30</text><rect x='560' y='186' width='360' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='740.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>my copy: 40 (now out of date)</text><text x='740.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'></text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>B fills its 20 and writes back 40 − 20 = 20. A's write is gone.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#cf222e' stroke-width='2.4'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 20</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>thread A: a buyer wants 30</text><text x='560' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#1a7f37'>thread B: another buyer wants 20</text><rect x='40' y='186' width='360' height='62' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='220.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>thinks 10 are left</text><text x='220.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'></text><rect x='560' y='186' width='360' height='62' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='740.0' y='215.0' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2328'>writes 20</text><text x='740.0' y='232.0' text-anchor='middle' font-size='12' font-weight='400' fill='#57606a'>S1.qty = 40 − 20</text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#cf222e'>50 shares were sold from an order of 40, and the book says 20 remain ✗</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='30.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='354' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='374' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='374' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The design here: only ONE thread ever touches the book. Other threads hand it commands through a queue.</text>
<rect x='310' y='76' width='340' height='64' rx='4' fill='#ffd8d3' stroke='#57606a' stroke-width='1.2'/><text x='480.0' y='106.0' text-anchor='middle' font-size='17' font-weight='600' fill='#1f2328'>S1.qty = 40 → 10 → 0</text><text x='480.0' y='126.0' text-anchor='middle' font-size='15' font-weight='400' fill='#57606a'>one resting sell order (shared memory)</text><rect x='40' y='190' width='150' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='115.0' y='219.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>buy 30</text><rect x='200' y='190' width='150' height='50' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='275.0' y='219.68' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>buy 20</text><line x1='354' y1='215' x2='416' y2='215' stroke='#57606a' stroke-width='1.6' marker-end='url(#ah)'/><rect x='420' y='180' width='260' height='70' rx='4' fill='#c7f0d2' stroke='#cf222e' stroke-width='2.4'/><text x='550.0' y='213.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>the ONE matching thread</text><text x='550.0' y='229.0' text-anchor='middle' font-size='11' font-weight='400' fill='#57606a'>runs one command at a time</text><line x1='550' y1='178' x2='500' y2='144' stroke='#cf222e' stroke-width='1.6' marker-end='url(#ahr)'/><text x='40' y='176' text-anchor='start' font-size='12' font-weight='700' fill='#57606a'>commands wait in a queue</text><text x='700' y='206' text-anchor='start' font-size='16' font-weight='700' fill='#1a7f37'>40 → 10 → 0</text><text x='700' y='228' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>second buyer gets the 10 left</text><text x='40' y='300' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>no lock is needed on the book, and the order of commands is always the same ✓</text>
</g>
</svg></div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=30.0, steps=[0.0, 5.001, 9.999, 15.0, 20.001, 24.999], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
