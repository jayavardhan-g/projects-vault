<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>naive walk</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 560' font-family='Inter, Helvetica, Arial, sans-serif'><title>naive walk</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='960' height='560' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>mm_naive / mm_coalesced: one thread, one output, two long walks</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>C[row][col] = Σₖ A[row][k] · B[k][col] for k = 0 … 32767; nothing is shared between threads</text>
<rect x='40' y='300' width='220' height='220' rx='3' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='150.0' y='536' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>A: [32768, 32768]</text>
<rect x='300' y='66' width='220' height='220' rx='3' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='528' y='80' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>B: [32768, 32768]</text>
<rect x='300' y='300' width='220' height='220' rx='3' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='410.0' y='536' text-anchor='middle' font-size='12' font-weight='600' fill='#1f2328'>C: [32768, 32768]</text>
<rect x='40' y='379.2' width='220' height='6' fill='none' stroke='#cf222e' stroke-width='1.5' stroke-dasharray='5 3'/><rect x='436.4' y='66' width='6' height='220' fill='none' stroke='#0969da' stroke-width='1.5' stroke-dasharray='5 3'/>
<g><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='1.0;0.0;1.0;1.0' keyTimes='0.0000;0.0200;0.7200;1.0000'/><rect x='436.4' y='379.2' width='6' height='6' fill='#1a7f37'/></g>
<text x='36' y='385.2' text-anchor='end' font-size='10' font-weight='600' fill='#cf222e'>row</text><text x='439.4' y='60' text-anchor='middle' font-size='10' font-weight='600' fill='#0969da'>col</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><rect x='40' y='379.2' width='2' height='6' rx='3' fill='#fca5a5' stroke='#24292f' stroke-width='1.6' fill-opacity='0.92'><animate attributeName='x' dur='12.0s' repeatCount='indefinite'  values='40.0;40.0;40.0;40.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='y' dur='12.0s' repeatCount='indefinite'  values='379.2;379.2;379.2;379.2' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='width' dur='12.0s' repeatCount='indefinite'  values='2.0;2.0;220.0;220.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='height' dur='12.0s' repeatCount='indefinite'  values='6.0;6.0;6.0;6.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/></rect></g>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><rect x='436.4' y='66' width='6' height='2' rx='3' fill='#93c5fd' stroke='#24292f' stroke-width='1.6' fill-opacity='0.92'><animate attributeName='x' dur='12.0s' repeatCount='indefinite'  values='436.4;436.4;436.4;436.4' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='y' dur='12.0s' repeatCount='indefinite'  values='66.0;66.0;66.0;66.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='width' dur='12.0s' repeatCount='indefinite'  values='6.0;6.0;6.0;6.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><animate attributeName='height' dur='12.0s' repeatCount='indefinite'  values='2.0;2.0;220.0;220.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/></rect></g>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/><rect x='40' y='376.2' width='8' height='12' fill='#cf222e'><animate attributeName='x' dur='12.0s' repeatCount='indefinite'  values='40.0;40.0;252.0;252.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/></rect><rect x='433.4' y='66' width='12' height='8' fill='#0969da'><animate attributeName='y' dur='12.0s' repeatCount='indefinite'  values='66.0;66.0;278.0;278.0' keyTimes='0.0000;0.0600;0.6800;1.0000'/></rect></g>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.7000;0.9800;1.0000'/><rect x='434.4' y='377.2' width='10' height='10' rx='4' fill='none' stroke='#1a7f37' stroke-width='3'/></g>
<text x='570' y='110' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>1. k = 0 … 32767: one FMA per step</text><text x='586' y='126' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>reads A[row][k] (red) and B[k][col] (blue)</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.0400;0.6800;1.0000'/><rect x='566' y='95' width='330' height='38' fill='#ffffff'/><rect x='562' y='95' width='4' height='36' rx='2' fill='#0969da'/><text x='570' y='110' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>1. k = 0 … 32767: one FMA per step</text><text x='586' y='126' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>reads A[row][k] (red) and B[k][col] (blue)</text></g>
<text x='570' y='160' text-anchor='start' font-size='12' font-weight='600' fill='#57606a'>2. write C[row][col] once</text><text x='586' y='176' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>after 32768 FMAs, from one register (acc)</text>
<g opacity='0'><animate attributeName='opacity' dur='12.0s' repeatCount='indefinite' calcMode='discrete' values='0.0;1.0;0.0;0.0' keyTimes='0.0000;0.6800;0.9800;1.0000'/><rect x='566' y='145' width='330' height='38' fill='#ffffff'/><rect x='562' y='145' width='4' height='36' rx='2' fill='#0969da'/><text x='570' y='160' text-anchor='start' font-size='12' font-weight='700' fill='#0969da'>2. write C[row][col] once</text><text x='586' y='176' text-anchor='start' font-size='11' font-weight='400' fill='#1f2328'>after 32768 FMAs, from one register (acc)</text></g>
<text x='570' y='240' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Per FMA: 2 floats from global memory = 8 bytes</text>
<text x='570' y='260' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>for 2 FLOPs → intensity 0.25 FLOP/B.</text>
<text x='570' y='290' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Row `row` of A is read again by all 32768</text>
<text x='570' y='308' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>threads with that row; column `col` of B by all</text>
<text x='570' y='326' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>32768 threads with that column. No reuse,</text>
<text x='570' y='344' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>except what the caches happen to catch.</text>
<text x='570' y='380' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>naive and coalesced do exactly this walk.</text>
<text x='570' y='398' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>They differ only in which thread owns which</text>
<text x='570' y='416' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>(row, col): see the warp-address figure.</text>
<text x='20' y='548' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: the k pointer sweeps the whole row of A and the whole column of B, then the one C cell is written</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=12.0, steps=[0.0, 0.24, 0.48, 0.72, 8.16, 8.4, 8.64, 11.76], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
