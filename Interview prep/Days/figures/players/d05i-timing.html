<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>How time_kernel measures a kernel</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 430' font-family='Inter, Helvetica, Arial, sans-serif'><title>How time_kernel measures a kernel</title>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='ahr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#cf222e'/></marker></defs>
<rect x='0' y='0' width='960' height='430' rx='12' fill='#ffffff' stroke='#d0d7de' stroke-width='1'/>
<text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>How time_kernel measures a kernel</text>
<text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>matmul_bench.cu:312–344: warm-up, CUDA events, and the 30-second budget</text>
<text x='40' y='104' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>CPU (host)</text><text x='40' y='184' text-anchor='start' font-size='13' font-weight='700' fill='#1f2328'>GPU stream</text><line x1='150' y1='96' x2='920' y2='96' stroke='#d0d7de' stroke-width='1'/><line x1='150' y1='176' x2='920' y2='176' stroke='#d0d7de' stroke-width='1'/>
<g opacity='1'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0' keyTimes='0;0.1667;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>1/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Warm-up: time_kernel first runs untimed launches (1 for the custom kernels, 2 for cuBLAS) and waits for them.</text>
<rect x='160' y='82' width='70' height='28' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='195.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>launch ×1</text><rect x='230' y='82' width='190' height='28' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='325.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>cudaDeviceSynchronize</text><rect x='170' y='162' width='240' height='28' rx='4' fill='#eaeef2' stroke='#57606a' stroke-width='1.2'/><text x='290.0' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>warm-up kernel (untimed)</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>Why warm up [theory]: the first launch can pay one-off costs that are not the kernel:</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>module loading, clocks ramping up, cold caches and TLBs, cuBLAS picking its algorithm.</text><text x='40' y='290' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>The project does this at matmul_bench.cu:318–319 (and 3 warm-ups in mlp_bench and bench_attention).</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.1667;0.3333;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>2/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>cudaEventRecord(beg) only ENQUEUES a marker. The CPU returns at once.</text>
<rect x='160' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(beg)</text><circle cx='200' cy='176' r='7' fill='#cf222e'/><text x='200' y='164' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>beg</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>The timestamp is taken when the GPU reaches the marker, on the GPU's own clock,</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>not when the CPU makes the call. So host code before or after does not leak into the time.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.3333;0.5000;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>3/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>The launch is asynchronous: the CPU queues the kernel in microseconds; the GPU runs it later.</text>
<rect x='160' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(beg)</text><rect x='250' y='82' width='70' height='28' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='285.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>launch()</text><rect x='320' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='365.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(end)</text><rect x='210' y='162' width='650' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='535.0' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>kernel: block2d_t64r4 ≈ 2.7 s</text><circle cx='200' cy='176' r='7' fill='#cf222e'/><text x='200' y='164' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>beg</text><circle cx='870' cy='176' r='7' fill='#cf222e'/><text x='870' y='164' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>end</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>A CPU timer around launch() alone would measure only the enqueue (µs): the classic timing bug.</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Events bracket exactly the GPU work between them: no copies, no Python, no host code.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.5000;0.6667;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>4/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>cudaEventSynchronize(end): the CPU sleeps until the GPU reaches end. Then ElapsedTime(beg, end) is valid.</text>
<rect x='160' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(beg)</text><rect x='250' y='82' width='70' height='28' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='285.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>launch()</text><rect x='320' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='365.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(end)</text><rect x='410' y='82' width='460' height='28' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='640.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>EventSynchronize(end) … waits</text><rect x='210' y='162' width='650' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='535.0' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>kernel</text><circle cx='200' cy='176' r='7' fill='#cf222e'/><text x='200' y='164' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>beg</text><circle cx='870' cy='176' r='7' fill='#cf222e'/><text x='870' y='164' text-anchor='middle' font-size='10' font-weight='700' fill='#cf222e'>end</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>first = 2,737 ms for block2d_t64r4 at N = 32768.</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Budget test (line 331): first / 1000 × iters &lt; 30 s?  2.737 × 10 = 27.4 s &lt; 30 → YES.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0;0.6667;0.8333;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>5/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Fits the budget: 9 more launches back to back between ONE event pair; the mean of 10 is reported.</text>
<rect x='160' y='82' width='50' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='185.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record</text><rect x='210' y='82' width='90' height='28' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='255.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>9 launches</text><rect x='300' y='82' width='50' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='325.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record</text><rect x='350' y='82' width='550' height='28' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='625.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Synchronize … waits</text><rect x='200' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='237.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k2</text><rect x='277' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='314.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k3</text><rect x='354' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='391.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k4</text><rect x='431' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='468.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k5</text><rect x='508' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='545.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k6</text><rect x='585' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='622.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k7</text><rect x='662' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='699.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k8</text><rect x='739' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='776.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k9</text><rect x='816' y='162' width='75' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='853.5' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>k10</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#1f2328'>returns {total / 10, 10}: 2,736.6 ms, n = 10 (the CSV iters column).</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Back-to-back launches also hide the per-launch gap, which only matters for tiny kernels.</text>
</g>
<g opacity='0'><animate attributeName='opacity' dur='27.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;1' keyTimes='0;0.8333;1'/>
<rect x='20' y='384' width='920' height='30' rx='6' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1'/>
<text x='32' y='404' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>6/6</text>
<text x='72' y='404' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Does not fit: mm_naive first = 140,486 ms → 140.5 × 10 = 1,405 s &gt; 30 s → it stops at n = 1.</text>
<rect x='160' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='205.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(beg)</text><rect x='250' y='82' width='70' height='28' rx='4' fill='#c8e1ff' stroke='#57606a' stroke-width='1.2'/><text x='285.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>launch()</text><rect x='320' y='82' width='90' height='28' rx='4' fill='#fff1a8' stroke='#57606a' stroke-width='1.2'/><text x='365.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Record(end)</text><rect x='410' y='82' width='490' height='28' rx='4' fill='#f5c6e9' stroke='#57606a' stroke-width='1.2'/><text x='655.0' y='99.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>Synchronize (140 s)</text><rect x='210' y='162' width='680' height='28' rx='4' fill='#c7f0d2' stroke='#57606a' stroke-width='1.2'/><text x='550.0' y='179.6' text-anchor='middle' font-size='10' font-weight='600' fill='#1f2328'>mm_naive, one run, 140,486 ms</text><text x='40' y='246' text-anchor='start' font-size='12' font-weight='700' fill='#cf222e'>Every kernel except cuBLAS and block2d_t64r4 has n = 1 at N = 32768 (strided: 3.635 × 10 = 36 s &gt; 30).</text><text x='40' y='268' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Fine for a 140 s run (launch noise is negligible), but say "single run, no error bars" if asked.</text>
</g>
</svg></div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=27.6, steps=[0.0, 4.601, 9.199, 13.8, 18.401, 22.999], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
