<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>online softmax</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 420' font-family='Inter, Helvetica, Arial, sans-serif'><title>online softmax</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='900' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>Online softmax on one query row: 4 keys in 2 tiles of 2</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>scores s = [2, 1 | 3, 0], values v = [1, 3 | 2, 0]; exact answer Σ softmax(s)·v = 1.786</text>
<text x='20' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'></text>
<text x='70' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>tile scores</text>
<text x='170' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>m_tile</text>
<text x='240' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>p = e^(s−m_tile)</text>
<text x='370' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>l_tile</text>
<text x='440' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>Σ p·v</text>
<text x='510' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>m_new</text>
<text x='580' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>e_run</text>
<text x='650' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>e_tile</text>
<text x='720' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>l</text>
<text x='800' y='90' text-anchor='start' font-size='11' font-weight='700' fill='#1f2328'>o</text>
<text x='20' y='120' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>start</text>
<text x='70' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='170' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='240' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='370' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='440' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='510' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>m = −∞</text>
<text x='580' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>
<text x='650' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'></text>

<text x='800' y='120' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>0</text>

<text x='70' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>[2, 1]</text>

<text x='440' y='160' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2.104</text>

<rect x='14' y='142' width='860' height='28' rx='5' fill='none' stroke='#cf222e' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.0500;0.4500;1.0000'/></rect>
<text x='20' y='200' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>tile 2</text>
<text x='70' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>[3, 0]</text>
<text x='170' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>3</text>
<text x='240' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>[1, 0.050]</text>
<text x='370' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>1.050</text>
<text x='440' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>2.000</text>
<text x='510' y='200' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>3</text>

<rect x='14' y='182' width='860' height='28' rx='5' fill='none' stroke='#cf222e' stroke-width='2.5' opacity='0'><animate attributeName='opacity' dur='8.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0;0' keyTimes='0.0000;0.4500;0.8500;1.0000'/></rect>
<rect x='20' y='250' width='860' height='120' rx='8' fill='#fbfcfd' stroke='#d0d7de' stroke-width='1'/>
<text x='36' y='274' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>Update rules (per row):  m_new = max(m, m_tile),  e_run = e^(m − m_new),  e_tile = e^(m_tile − m_new)</text>
<text x='36' y='296' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>l = e_run · l + e_tile · l_tile</text>
<text x='330' y='296' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>o = e_run · o + e_tile · Σ p·v</text>
<text x='640' y='296' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>answer = o / l</text>
<text x='36' y='322' text-anchor='start' font-size='12' font-weight='400' fill='#0969da'>tile 2: l = 0.368 · 1.368 + 1 · 1.050 = 1.553,   o = 0.368 · 2.104 + 1 · 2.000 = 2.774</text>
<text x='36' y='346' text-anchor='start' font-size='12' font-weight='600' fill='#1a7f37'>o / l = 2.774 / 1.553 = 1.786 = the exact softmax-weighted average. Never needed all 4 scores at once.</text>
<text x='20' y='408' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: one tile at a time; the old state is rescaled by e_run when a bigger max appears</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=8.0, steps=[0.0, 0.4, 3.6, 6.8], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
