<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcFace margin</title><style>
:root{--bg:#f6f8fa;--ink:#1f2328;--mute:#57606a;--line:#d0d7de;--acc:#0969da;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#30363d;--acc:#4493f8;--card:#161b22}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)} button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
#lab{font-weight:700;min-width:110px;font-variant-numeric:tabular-nums} .hint{color:var(--mute);font-size:13px}
</style></head><body><div class="wrap">
<div class="bar"><button id="prev" title="Left arrow">◀ Previous</button><button id="next" class="main" title="Right arrow">Next ▶</button>
<span id="lab"></span><input id="sl" type="range" min="0" max="1000" value="0" aria-label="position">
<button id="play" title="Space">Play</button>
<select id="sp" aria-label="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="fig"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 420' font-family='Inter, Helvetica, Arial, sans-serif'><title>ArcFace margin</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker></defs><rect x='0' y='0' width='860' height='420' rx='12' fill='#ffffff' stroke='#d0d7de'/><defs><marker id='m-ink' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1f2328'/></marker><marker id='m-muted' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#57606a'/></marker><marker id='m-red' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#cf222e'/></marker><marker id='m-blue' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#0969da'/></marker><marker id='m-green' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#1a7f37'/></marker><marker id='m-amber' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#bf8700'/></marker><marker id='m-grey' markerUnits='userSpaceOnUse' markerWidth='12' markerHeight='12' refX='10' refY='6' orient='auto'><path d='M0,1 L11,6 L0,11 z' fill='#8c959f'/></marker></defs><text x='20' y='28' text-anchor='start' font-size='15' font-weight='700' fill='#1f2328'>ArcFace: add a margin m to the angle of the RIGHT identity</text><text x='20' y='48' text-anchor='start' font-size='12' font-weight='400' fill='#57606a'>s = 64, m = 0.5 rad (28.6°); the face must beat the others even after being pushed 28.6° away</text>
<path d='M370.0,370.0 A290,290 0 0 0 54.7,81.1' fill='none' stroke='#8c959f' stroke-width='1.2' stroke-dasharray='3 3'/>
<line x1='80' y1='370' x2='370.0' y2='370.0' stroke='#1f2328' stroke-width='2.5' marker-end='url(#m-ink)'/><text x='378.0' y='374.0' text-anchor='start' font-size='12' font-weight='600' fill='#1f2328'>W_y: centre of the true person</text>
<line x1='80' y1='370' x2='130.4' y2='84.4' stroke='#0969da' stroke-width='2' marker-end='url(#m-blue)'/><text x='132.8' y='74.6' text-anchor='middle' font-size='12' font-weight='600' fill='#0969da'>W₂ (80°)</text>
<line x1='80' y1='370' x2='105.3' y2='81.1' stroke='#8c959f' stroke-width='2' marker-end='url(#m-grey)'/><text x='106.3' y='73.1' text-anchor='end' font-size='12' font-weight='600' fill='#8c959f'>W₃ (85°)</text>
<g><line x1='80' y1='370' x2='203.3' y2='156.5' stroke='#cf222e' stroke-width='3' marker-end='url(#m-red)'/><text x='209.3' y='150.1' text-anchor='start' font-size='12' font-weight='600' fill='#cf222e'>face x</text><animateTransform attributeName='transform' type='rotate' dur='8s' repeatCount='indefinite' values='0 80 370;0 80 370;20 80 370;20 80 370;0 80 370' keyTimes='0;0.15;0.55;0.85;1'/></g>
<g opacity='0.9'><line x1='80' y1='370' x2='84.3' y2='196.1' stroke='#bf8700' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#m-amber)'/><text x='84.5' y='188.1' text-anchor='start' font-size='11' font-weight='600' fill='#bf8700'>θ + m = 88.6°</text><animateTransform attributeName='transform' type='rotate' dur='8s' repeatCount='indefinite' values='0 80 370;0 80 370;20.0 80 370;20.0 80 370;0 80 370' keyTimes='0;0.15;0.55;0.85;1'/></g>
<path d='M150.0,370.0 A70,70 0 0 0 115.0,309.4' fill='none' stroke='#cf222e' stroke-width='1.5'/>
<text x='158' y='340' text-anchor='start' font-size='11' font-weight='600' fill='#cf222e'>θ = 60°</text>
<text x='440' y='90' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>θ (face to W_y)</text>
<text x='670' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>60°</text>
<text x='730' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>50°</text>
<text x='790' y='90' text-anchor='middle' font-size='11' font-weight='600' fill='#1f2328'>40°</text>
<text x='440' y='120' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>logit W_y, no margin: s·cos θ</text>
<text x='670' y='120' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>32.0</text>
<text x='730' y='120' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>41.1</text>
<text x='790' y='120' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>49.0</text>
<text x='440' y='150' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>logit W_y, ArcFace: s·cos(θ+m)</text>
<text x='670' y='150' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>1.5</text>
<text x='730' y='150' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>12.6</text>
<text x='790' y='150' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>23.3</text>
<text x='440' y='180' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>logits W₂, W₃</text>
<text x='670' y='180' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>11.1, 5.6</text>
<text x='730' y='180' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>11.1, 5.6</text>
<text x='790' y='180' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>11.1, 5.6</text>
<text x='440' y='210' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>p(true person), ArcFace</text>
<text x='670' y='210' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.0001</text>
<text x='730' y='210' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.81</text>
<text x='790' y='210' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>1.00</text>
<text x='440' y='240' text-anchor='start' font-size='11' font-weight='600' fill='#1f2328'>loss −ln p, ArcFace</text>
<text x='670' y='240' text-anchor='middle' font-size='11' font-weight='400' fill='#cf222e'>9.6</text>
<text x='730' y='240' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.21</text>
<text x='790' y='240' text-anchor='middle' font-size='11' font-weight='400' fill='#1f2328'>0.00</text>
<text x='440' y='290' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>Without the margin, 60° already gives p ≈ 1 (loss 0):</text>
<text x='440' y='310' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>training would stop. With it, the loss stays high</text>
<text x='440' y='330' text-anchor='start' font-size='12' font-weight='400' fill='#1f2328'>until the face sits well inside its person's cone.</text>
<text x='20' y='408' text-anchor='start' font-size='11' font-weight='400' fill='#57606a'>animated: training rotates the face toward W_y; θ + m (orange) must end up closer to W_y than any other centre</text></svg>
</div>
<p class="hint">Keys: ← previous step, → next step, space play / pause. Drag the slider to move freely. The picture stays still until you move it.</p>
</div><script>
const D=8.0, steps=[0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5], svg=document.querySelector('.fig svg'), EPS=0.02;
const lab=document.getElementById('lab'), sl=document.getElementById('sl'), playB=document.getElementById('play'), sp=document.getElementById('sp');
let t=EPS, playing=false, last=0;
svg.pauseAnimations();
function cur(){let i=0; for(let k=0;k<steps.length;k++) if(steps[k]<=t+1e-6) i=k; return i;}
function show(){svg.setCurrentTime(t); sl.value=Math.round(t/D*1000); lab.textContent='step '+(cur()+1)+' / '+steps.length;}
function go(i){playing=false; playB.textContent='Play'; i=(i+steps.length)%steps.length; t=steps[i]+EPS; show();}
document.getElementById('next').onclick=()=>go(cur()+1);
document.getElementById('prev').onclick=()=>go(cur()-1);
sl.oninput=()=>{playing=false; playB.textContent='Play'; t=Math.min(D-EPS,Math.max(EPS,sl.value/1000*D)); show();};
function tick(now){ if(!playing) return; t+=(now-last)/1000*parseFloat(sp.value); last=now; if(t>=D) t=EPS; show(); requestAnimationFrame(tick); }
playB.onclick=()=>{playing=!playing; playB.textContent=playing?'Pause':'Play'; if(playing){last=performance.now(); requestAnimationFrame(tick);} };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){go(cur()+1);e.preventDefault();} else if(e.key==='ArrowLeft'){go(cur()-1);e.preventDefault();} else if(e.key===' '){playB.click();e.preventDefault();} });
show();
</script></body></html>
